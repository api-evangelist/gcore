openapi: 3.2.0
info:
  title: Cloud Images API
  description: '___brandName___ Cloud API provides an API to manage Cloud resources and services.

    API address is: https://api.___serverHost___/cloud


    # Authentication

    You can find the available authorization methods in this section:

    Authorization methods


    Project ID & Region ID


    Most endpoints require project_id and region_id path parameters.

    List Regions

    and

    List Projects

    to see available projects and regions.'
  version: 14.491.0
servers:
- url: https://api.___serverHost___/cloud
tags:
- name: Images
paths:
  /v1/bmimages/{project_id}/{region_id}:
    post:
      operationId: BmImagesViewSet.post
      summary: Create image
      description: 'Create a new image from a bootable volume.

        The volume must be bootable to create an image from it.'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 7
          title: Region Id
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskIDsSerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageCreateFromVolumeSerializer'
      tags:
      - Images
    get:
      operationId: BmImagesViewSet.get
      summary: List bare metal images
      description: 'Retrieve a list of available images for bare metal servers.

        The list can be filtered by visibility, tags, and other parameters.

        Returned entities may or may not be owned by the project.'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 7
          title: Region Id
          type: integer
      - in: query
        name: architecture
        required: false
        description: Filter by image architecture.
        schema:
          $ref: '#/components/schemas/ImageArchitectureTypeEnum'
          description: Filter by image architecture.
          examples:
          - x86_64
      - in: query
        name: include_prices
        required: false
        description: Show price.
        schema:
          description: Show price.
          title: Include Prices
          type: boolean
      - in: query
        name: limit
        required: false
        description: Optional. Limit the number of returned items
        schema:
          default: 1000
          description: Optional. Limit the number of returned items
          examples:
          - 1000
          exclusiveMinimum: 0
          maximum: 1000
          title: Limit
          type: integer
      - in: query
        name: name
        required: false
        description: Filter by image name (case-insensitive substring match)
        schema:
          description: Filter by image name (case-insensitive substring match)
          examples:
          - ubuntu
          title: Name
          type: string
      - in: query
        name: offset
        required: false
        description: Optional. Offset value is used to exclude the first set of records from the result
        schema:
          default: 0
          description: Optional. Offset value is used to exclude the first set of records from the result
          examples:
          - 0
          minimum: 0
          title: Offset
          type: integer
      - in: query
        name: os_distro
        required: false
        description: Filter by OS distribution (case-insensitive). E.g. `ubuntu`, `centos`, `debian`
        schema:
          description: Filter by OS distribution (case-insensitive). E.g. `ubuntu`, `centos`, `debian`
          examples:
          - ubuntu
          title: Os Distro
          type: string
      - in: query
        name: os_version
        required: false
        description: Filter by OS version (case-insensitive). E.g. `22.04`
        schema:
          description: Filter by OS version (case-insensitive). E.g. `22.04`
          examples:
          - '22.04'
          title: Os Version
          type: string
      - in: query
        name: private
        required: false
        description: Any value to show private images
        schema:
          description: Any value to show private images
          title: Private
          type: string
      - in: query
        name: tag_key
        required: false
        description: Optional. Filter by tag keys. ?tag_key=key1&tag_key=key2
        schema:
          description: Optional. Filter by tag keys. ?tag_key=key1&tag_key=key2
          examples:
          - - key1
            - key2
          items:
            description: 'Tag key. Maximum 255 characters. Cannot contain spaces, tabs, newlines, empty string or ''='' character. Trailing or leading whitespaces will be stripped. '
            examples:
            - my-tag
            maxLength: 255
            minLength: 1
            pattern: ^[^\s=]+$
            type: string
          title: Tag Key
          type: array
      - in: query
        name: tag_key_value
        required: false
        description: Optional. Filter by tag key-value pairs.
        schema:
          contentMediaType: application/json
          contentSchema:
            propertyNames:
              description: 'Tag key. Maximum 255 characters. Cannot contain spaces, tabs, newlines, empty string or ''='' character. Trailing or leading whitespaces will be stripped. '
              examples:
              - my-tag
              maxLength: 255
              minLength: 1
              pattern: ^[^\s=]+$
            type: object
            additionalProperties:
              description: 'Tag value. Maximum 255 characters. Cannot contain tabs, newlines, or empty strings. Trailing or leading whitespaces will be stripped. '
              examples:
              - my-tag-value
              maxLength: 255
              minLength: 1
              pattern: ^[^ \t\n\r\f\v]([^\t\n\r\f\v]*[^ \t\n\r\f\v])?$
              type: string
          description: Optional. Filter by tag key-value pairs.
          examples:
          - key: value
          title: Tag Key Value
          type: string
      - in: query
        name: visibility
        required: false
        description: Image visibility. Globally visible images are public
        schema:
          $ref: '#/components/schemas/VisibilityTypeEnum'
          description: Image visibility. Globally visible images are public
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BareMetalImageCollectionSerializer'
      tags:
      - Images
  /v1/downloadimage/{project_id}/{region_id}:
    post:
      operationId: ImageDownloadViewSet.post
      summary: Upload image
      description: 'Upload an image from a URL.

        The image can be configured with various properties like OS type, architecture, and tags.'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 7
          title: Region Id
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskIDsSerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageDownloadSerializer'
      tags:
      - Images
  /v1/images/{project_id}/{region_id}:
    post:
      operationId: ImagesViewSet.post
      summary: Create image
      description: 'Create a new image from a bootable volume.

        The volume must be bootable to create an image from it.'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 7
          title: Region Id
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskIDsSerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageCreateFromVolumeSerializer'
      tags:
      - Images
    get:
      operationId: ImagesViewSet.get
      summary: List images
      description: 'Retrieve a list of available images in the project and region.

        The list can be filtered by visibility, tags, and other parameters.

        Returned entities are owned by the project or are public/shared with the client.'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 7
          title: Region Id
          type: integer
      - in: query
        name: architecture
        required: false
        description: Filter by image architecture.
        schema:
          $ref: '#/components/schemas/ImageArchitectureTypeEnum'
          description: Filter by image architecture.
          examples:
          - x86_64
      - in: query
        name: include_prices
        required: false
        description: Show price.
        schema:
          description: Show price.
          title: Include Prices
          type: boolean
      - in: query
        name: limit
        required: false
        description: Optional. Limit the number of returned items
        schema:
          default: 1000
          description: Optional. Limit the number of returned items
          examples:
          - 1000
          exclusiveMinimum: 0
          maximum: 1000
          title: Limit
          type: integer
      - in: query
        name: name
        required: false
        description: Filter by image name (case-insensitive substring match)
        schema:
          description: Filter by image name (case-insensitive substring match)
          examples:
          - ubuntu
          title: Name
          type: string
      - in: query
        name: offset
        required: false
        description: Optional. Offset value is used to exclude the first set of records from the result
        schema:
          default: 0
          description: Optional. Offset value is used to exclude the first set of records from the result
          examples:
          - 0
          minimum: 0
          title: Offset
          type: integer
      - in: query
        name: os_distro
        required: false
        description: Filter by OS distribution (case-insensitive). E.g. `ubuntu`, `centos`, `debian`
        schema:
          description: Filter by OS distribution (case-insensitive). E.g. `ubuntu`, `centos`, `debian`
          examples:
          - ubuntu
          title: Os Distro
          type: string
      - in: query
        name: os_version
        required: false
        description: Filter by OS version (case-insensitive). E.g. `22.04`
        schema:
          description: Filter by OS version (case-insensitive). E.g. `22.04`
          examples:
          - '22.04'
          title: Os Version
          type: string
      - in: query
        name: private
        required: false
        description: Any value to show private images
        schema:
          description: Any value to show private images
          title: Private
          type: string
      - in: query
        name: tag_key
        required: false
        description: Optional. Filter by tag keys. ?tag_key=key1&tag_key=key2
        schema:
          description: Optional. Filter by tag keys. ?tag_key=key1&tag_key=key2
          examples:
          - - key1
            - key2
          items:
            description: 'Tag key. Maximum 255 characters. Cannot contain spaces, tabs, newlines, empty string or ''='' character. Trailing or leading whitespaces will be stripped. '
            examples:
            - my-tag
            maxLength: 255
            minLength: 1
            pattern: ^[^\s=]+$
            type: string
          title: Tag Key
          type: array
      - in: query
        name: tag_key_value
        required: false
        description: Optional. Filter by tag key-value pairs.
        schema:
          contentMediaType: application/json
          contentSchema:
            propertyNames:
              description: 'Tag key. Maximum 255 characters. Cannot contain spaces, tabs, newlines, empty string or ''='' character. Trailing or leading whitespaces will be stripped. '
              examples:
              - my-tag
              maxLength: 255
              minLength: 1
              pattern: ^[^\s=]+$
            type: object
            additionalProperties:
              description: 'Tag value. Maximum 255 characters. Cannot contain tabs, newlines, or empty strings. Trailing or leading whitespaces will be stripped. '
              examples:
              - my-tag-value
              maxLength: 255
              minLength: 1
              pattern: ^[^ \t\n\r\f\v]([^\t\n\r\f\v]*[^ \t\n\r\f\v])?$
              type: string
          description: Optional. Filter by tag key-value pairs.
          examples:
          - key: value
          title: Tag Key Value
          type: string
      - in: query
        name: visibility
        required: false
        description: Image visibility. Globally visible images are public
        schema:
          $ref: '#/components/schemas/VisibilityTypeEnum'
          description: Image visibility. Globally visible images are public
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageCollectionSerializer'
      tags:
      - Images
  /v1/images/{project_id}/{region_id}/{image_id}:
    get:
      operationId: ImageDetailViewSet.get
      summary: Get image
      description: Retrieve detailed information about a specific image.
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 7
          title: Region Id
          type: integer
      - in: path
        name: image_id
        required: true
        description: Image ID
        schema:
          description: Image ID
          examples:
          - 8cab6f28-09ca-4201-b3f7-23c7893f4bd6
          title: Image Id
          type: string
      - in: query
        name: include_prices
        required: false
        description: Show price
        schema:
          default: false
          description: Show price
          examples:
          - false
          title: Include Prices
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageSerializer'
      tags:
      - Images
    patch:
      operationId: ImageDetailViewSet.patch
      summary: Update image
      description: Update image properties and tags.
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 7
          title: Region Id
          type: integer
      - in: path
        name: image_id
        required: true
        description: Image ID
        schema:
          description: Image ID
          examples:
          - 8cab6f28-09ca-4201-b3f7-23c7893f4bd6
          title: Image Id
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageSerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateImageSerializer'
      tags:
      - Images
    delete:
      operationId: ImageDetailViewSet.delete
      summary: Delete image
      description: 'Delete a specific image.

        The image cannot be deleted if it is used by protected snapshots.'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 7
          title: Region Id
          type: integer
      - in: path
        name: image_id
        required: true
        description: Image ID
        schema:
          description: Image ID
          examples:
          - 8cab6f28-09ca-4201-b3f7-23c7893f4bd6
          title: Image Id
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskIDsSerializer'
      tags:
      - Images
  /v1/pricing/{project_id}/{region_id}/images:
    post:
      operationId: ImagePricingHandler.post
      summary: Preview image price
      description: Preview the billing price for the image of a given size.
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          format: int64
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          format: int64
          title: Region Id
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemPriceResponseSerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImagePricingRequestSerializer'
      tags:
      - Images
  /v1/projectimages/{project_id}/{region_id}:
    get:
      operationId: ProjectImagesViewSet.get
      summary: List project images
      description: Retrieve a list of images owned by the project.
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 7
          title: Region Id
          type: integer
      - in: query
        name: include_prices
        required: false
        description: Show price
        schema:
          default: false
          description: Show price
          examples:
          - false
          title: Include Prices
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageCollectionSerializer'
      tags:
      - Images
  /v1/images/{project_id}/{region_id}/{image_id}/metadata:
    post:
      operationId: ImageMetadataHandler.post
      summary: Create or update image tags
      description: 'Create or update one or more tags for an image.

        If a tag does not exist, it gets created.

        If a tag already exists, its value is overwritten.


        Use PATCH /v1/images/{project_id}/{region_id}/{image_id} instead'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 7
          title: Region Id
          type: integer
      - in: path
        name: image_id
        required: true
        description: Image ID
        schema:
          description: Image ID
          examples:
          - 8cab6f28-09ca-4201-b3f7-23c7893f4bd6
          title: Image Id
          type: string
      responses:
        '204':
          description: No Content
      deprecated: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTagsSerializer'
      tags:
      - Images
    get:
      operationId: ImageMetadataHandler.get
      summary: List image tags
      description: 'Retrieve all tags associated with an image.


        Use GET /v1/images/{project_id}/{region_id}/{image_id} instead'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 7
          title: Region Id
          type: integer
      - in: path
        name: image_id
        required: true
        description: Image ID
        schema:
          description: Image ID
          examples:
          - 8cab6f28-09ca-4201-b3f7-23c7893f4bd6
          title: Image Id
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagCollectionSerializer'
      deprecated: true
      tags:
      - Images
    put:
      operationId: ImageMetadataHandler.put
      summary: Replace image tags
      description: 'Delete all existing tags and replace them with the tags from the request.


        Use PATCH /v1/images/{project_id}/{region_id}/{image_id} instead'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 7
          title: Region Id
          type: integer
      - in: path
        name: image_id
        required: true
        description: Image ID
        schema:
          description: Image ID
          examples:
          - 8cab6f28-09ca-4201-b3f7-23c7893f4bd6
          title: Image Id
          type: string
      responses:
        '204':
          description: No Content
      deprecated: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTagsSerializer'
      tags:
      - Images
  /v1/images/{project_id}/{region_id}/{image_id}/metadata_item:
    get:
      operationId: ImageMetadataItemHandler.get
      summary: Get image tag
      description: 'Retrieve a specific tag by its key from an image.


        Use GET /v1/images/{project_id}/{region_id}/{image_id} instead'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 7
          title: Region Id
          type: integer
      - in: path
        name: image_id
        required: true
        description: Image ID
        schema:
          description: Image ID
          examples:
          - 8cab6f28-09ca-4201-b3f7-23c7893f4bd6
          title: Image Id
          type: string
      - in: query
        name: key
        required: true
        description: Tag key to filter by
        schema:
          description: Tag key to filter by
          examples:
          - cost-center
          maxLength: 255
          minLength: 1
          pattern: ^[^\s=]+$
          title: Key
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagSerializer'
      deprecated: true
      tags:
      - Images
    delete:
      operationId: ImageMetadataItemHandler.delete
      summary: Delete image tag
      description: 'Delete a specific tag by its key from an image.


        Use PATCH /v1/images/{project_id}/{region_id}/{image_id} instead'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 7
          title: Region Id
          type: integer
      - in: path
        name: image_id
        required: true
        description: Image ID
        schema:
          description: Image ID
          examples:
          - 8cab6f28-09ca-4201-b3f7-23c7893f4bd6
          title: Image Id
          type: string
      - in: query
        name: key
        required: true
        description: Tag key to filter by
        schema:
          description: Tag key to filter by
          examples:
          - cost-center
          maxLength: 255
          minLength: 1
          pattern: ^[^\s=]+$
          title: Key
          type: string
      responses:
        '204':
          description: No Content
      deprecated: true
      tags:
      - Images
components:
  schemas:
    BareMetalImageSerializer:
      properties:
        architecture:
          $ref: '#/components/schemas/ImageArchitectureTypeEnum'
          description: 'An image architecture type: aarch64, x86_64.'
          examples:
          - x86_64
        created_at:
          description: Datetime when the image was created
          examples:
          - '2024-05-05T14:51:26.570866'
          format: date-time
          title: Created At
          type: string
        creator_task_id:
          anyOf:
          - type: string
          - type: 'null'
          description: Task that created this entity
          examples:
          - b10dd116-07f5-4225-abb7-f42da5cb78fb
          title: Creator Task Id
        currency_code:
          anyOf:
          - type: string
          - type: 'null'
