components:
  schemas:
    InstanceStatusQuery:
      enum:
      - ACTIVE
      - BUILD
      - ERROR
      - HARD_REBOOT
      - MIGRATING
      - PAUSED
      - REBOOT
      - REBUILD
      - RESIZE
      - REVERT_RESIZE
      - SHELVED
      - SHELVED_OFFLOADED
      - SHUTOFF
      - SOFT_DELETED
      - SUSPENDED
      - VERIFY_RESIZE
      title: InstanceStatusQuery
      type: string
    TaskIDsSerializer:
      properties:
        tasks:
          description: "List of task IDs representing asynchronous operations. Use these IDs to monitor operation progress:\n  * `GET /v1/tasks/{task_id}` - Check individual task status and details\n  Poll task status until completion (`FINISHED`/`ERROR`) before proceeding with dependent operations."
          examples:
          - - d478ae29-dedc-4869-82f0-96104425f565
          items:
            type: string
          title: Tasks
          type: array
      required:
      - tasks
      title: TaskIDsSerializer
      type: object
    CreateInstanceCreateNewVolumeSerializer:
      properties:
        attachment_tag:
          description: Block device attachment tag (not exposed in the normal tags)
          examples:
          - boot
          - data
          - logs
          pattern: ^[^,/]{1,60}$
          title: Attachment Tag
          type: string
        delete_on_termination:
          default: false
          description: Set to `true` to automatically delete the volume when the instance is deleted.
          examples:
          - false
          title: Delete On Termination
          type: boolean
        name:
          description: The name of the volume. If not specified, a name will be generated automatically.
          examples:
          - boot-volume
          pattern: ^[a-zA-Z0-9][a-zA-Z 0-9._\-]{1,61}[a-zA-Z0-9._]$
          title: Name
          type: string
        size:
          description: Volume size in GiB.
          examples:
          - 20
          minimum: 1
          title: Size
          type: integer
        source:
          const: new-volume
          description: New volume will be created from scratch and attached to the instance.
          examples:
          - new-volume
          title: Source
          type: string
        tags:
          $ref: '#/components/schemas/CreateTagsSerializer'
          description: Key-value tags to associate with the resource. A tag is a key-value pair that can be associated with a resource, enabling efficient filtering and grouping for better organization and management. Both tag keys and values have a maximum length of 255 characters. Some tags are read-only and cannot be modified by the user. Tags are also integrated with cost reports, allowing cost data to be filtered based on tag keys or values.
          examples:
          - my-tag: my-tag-value
        type_name:
          $ref: '#/components/schemas/VolumeTypeName'
          default: standard
          description: 'Volume type name. Supported values:

            - `standard` - Network SSD block storage offering stable performance with high random I/O and data reliability (6 IOPS per 1 GiB, 0.4 MB/s per 1 GiB). Max IOPS: 4500. Max bandwidth: 300 MB/s.

            - `ssd_hiiops` - High-performance SSD storage for latency-sensitive transactional workloads (60 IOPS per 1 GiB, 2.5 MB/s per 1 GiB). Max IOPS: 9000. Max bandwidth: 500 MB/s.

            - `ssd_lowlatency` - SSD storage optimized for low-latency and real-time processing. Max IOPS: 5000. Average latency: 300 µs. Snapshots and volume resizing are **not** supported for `ssd_lowlatency`.

            '
          examples:
          - ssd_hiiops
      required:
      - source
      - size
      title: CreateInstanceCreateNewVolumeSerializer
      type: object
    InstanceSerializer:
      properties:
        addresses:
          additionalProperties:
            items:
              anyOf:
              - $ref: '#/components/schemas/InstanceFloatingAddressSerializer'
              - $ref: '#/components/schemas/InstanceFixedAddressShortSerializer'
              - $ref: '#/components/schemas/InstanceFixedAddressSerializer'
            type: array
          description: Map of network_name to list of addresses in that network
          title: Addresses
          type: object
        blackhole_ports:
          description: IP addresses of the instances that are blackholed by DDoS mitigation system
          items:
            $ref: '#/components/schemas/BlackholePortSerializer'
          title: Blackhole Ports
          type: array
        created_at:
          description: Datetime when instance was created
          examples:
          - '2023-11-29T10:56:49Z'
          format: date-time
          title: Created At
          type: string
        creator_task_id:
          anyOf:
          - type: string
          - type: 'null'
          description: Task that created this entity
          title: Creator Task Id
        ddos_profile:
          anyOf:
          - $ref: '#/components/schemas/GetClientProfileSerializer'
          - type: 'null'
          description: Advanced DDoS protection profile. It is always `null` if query parameter `with_ddos=true` is not set.
        fixed_ip_assignments:
          anyOf:
          - items:
              $ref: '#/components/schemas/IpAssignmentsSerializer'
            type: array
          - type: 'null'
          description: Fixed IP assigned to instance
          title: Fixed Ip Assignments
        flavor:
          anyOf:
          - $ref: '#/components/schemas/InstanceFlavorSerializer'
          - $ref: '#/components/schemas/BareMetalFlavorSerializer'
          - $ref: '#/components/schemas/DeprecatedGpuClusterFlavorSerializer'
          description: Flavor
          title: Flavor
        id:
          description: Instance ID
          examples:
          - 6c6aa80f-7836-4dc2-a2ae-125e248be476
          format: uuid4
          title: Id
          type: string
        instance_description:
          anyOf:
          - type: string
          - type: 'null'
          description: Instance description
          examples:
          - Instance description
          title: Instance Description
        instance_isolation:
          anyOf:
          - $ref: '#/components/schemas/IsolationSerializer'
          - type: 'null'
          description: Instance isolation information
        name:
          description: Instance name
          examples:
          - my-instance-1
          title: Name
          type: string
        project_id:
          description: Project ID
          examples:
          - 111
          title: Project Id
          type: integer
        region:
          description: Region name
          examples:
          - Luxembourg
          title: Region
          type: string
        region_id:
          description: Region ID
          examples:
          - 4
          title: Region Id
          type: integer
        security_groups:
          description: Security groups
          items:
            $ref: '#/components/schemas/NameSerializerPydantic'
          title: Security Groups
          type: array
        ssh_key_name:
          anyOf:
          - type: string
          - type: 'null'
          description: SSH key assigned to instance
          title: Ssh Key Name
        status:
          $ref: '#/components/schemas/InstanceStatus'
          description: Instance status
          examples:
          - ACTIVE
        tags:
          description: List of key-value tags associated with the resource. A tag is a key-value pair that can be associated with a resource, enabling efficient filtering and grouping for better organization and management. Some tags are read-only and cannot be modified by the user. Tags are also integrated with cost reports, allowing cost data to be filtered based on tag keys or values.
          examples:
          - - key: my-tag
              read_only: false
              value: my-tag-value
          items:
            $ref: '#/components/schemas/TagSerializer'
          title: Tags
          type: array
        task_id:
          anyOf:
          - type: string
          - type: 'null'
          description: The UUID of the active task that currently holds a lock on the resource. This lock prevents concurrent modifications to ensure consistency. If `null`, the resource is not locked.
          examples:
          - null
          title: Task Id
        task_state:
          anyOf:
          - type: string
          - type: 'null'
          description: Task state
          title: Task State
        vm_state:
          $ref: '#/components/schemas/InstanceVMState'
          description: Virtual machine state (active)
          examples:
          - active
        volumes:
          description: List of volumes
          items:
            $ref: '#/components/schemas/InstanceVolumeSerializer'
          title: Volumes
          type: array
      required:
      - id
      - name
      - created_at
      - status
      - vm_state
      - volumes
      - flavor
      - tags
      - instance_description
      - addresses
      - security_groups
      - ssh_key_name
      - creator_task_id
      - task_state
      - task_id
      - blackhole_ports
      - ddos_profile
      - fixed_ip_assignments
      - instance_isolation
      - region
      - region_id
      - project_id
      title: InstanceSerializer
      type: object
    CreateInstanceCreateVolumeFromImageSerializer:
      properties:
        attachment_tag:
          description: Block device attachment tag (not exposed in the normal tags)
          examples:
          - boot
          - data
          - logs
          pattern: ^[^,/]{1,60}$
          title: Attachment Tag
          type: string
        boot_index:
          description: '- `0` means that this is the primary boot device;

            - A unique positive value is set for the secondary bootable devices;

            - A negative number means that the boot is prohibited.

            '
          examples:
          - 0
          title: Boot Index
          type: integer
        delete_on_termination:
          default: false
          description: Set to `true` to automatically delete the volume when the instance is deleted.
          examples:
          - false
          title: Delete On Termination
          type: boolean
        image_id:
          description: Image ID.
          examples:
