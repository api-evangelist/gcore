    NewInterfaceSpecificSubnetFipSerializerPydantic:
      description: 'The instance will get an IP address from the selected network.

        If you choose to add a floating IP, the instance will be reachable from the internet.

        Otherwise, it will only have a private IP within the network.'
      examples:
      - floating_ip:
          existing_floating_id: 57be69f6-6f6a-4f03-a4ad-8eb86c69ec0a
          source: existing
        network_id: 59905c8e-2619-420a-b046-536096473370
        subnet_id: e3c6ee77-48cb-416b-b204-11b492cc776e3
        type: subnet
      properties:
        floating_ip:
          description: Allows the instance to have a public IP that can be reached from the internet.
          discriminator:
            mapping:
              existing: '#/components/schemas/ExistingInstanceFloatingIpInterfaceSerializer'
              new: '#/components/schemas/NewInstanceFloatingIpInterfaceSerializer'
            propertyName: source
          oneOf:
          - $ref: '#/components/schemas/NewInstanceFloatingIpInterfaceSerializer'
          - $ref: '#/components/schemas/ExistingInstanceFloatingIpInterfaceSerializer'
          title: Floating Ip
        interface_name:
          description: Interface name. Defaults to `null` and is returned as `null` in the API response if not set.
          maxLength: 37
          title: Interface Name
          type: string
        network_id:
          description: The network where the instance will be connected.
          format: uuid4
          title: Network Id
          type: string
        security_groups:
          description: Security group UUIDs applied to this interface. If omitted (or empty), the top-level `security_groups` value applies; if both are omitted, the project's default security group is applied.
          items:
            $ref: '#/components/schemas/MandatoryIdSerializerPydantic'
          title: Security Groups
          type: array
        subnet_id:
          description: The instance will get an IP address from this subnet.
          format: uuid4
          title: Subnet Id
          type: string
        type:
          const: subnet
          description: The instance will get an IP address from the selected network. If you choose to add a floating IP, the instance will be reachable from the internet. Otherwise, it will only have a private IP within the network.
          title: Type
          type: string
      required:
      - type
      - network_id
      - subnet_id
      title: NewInterfaceSpecificSubnetFipSerializerPydantic
      type: object
    AllowedAddressPairsSerializer:
      properties:
        ip_address:
