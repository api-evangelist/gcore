openapi: 3.2.0
info:
  title: Cloud Instances API
  description: '___brandName___ Cloud API provides an API to manage Cloud resources and services.

    API address is: https://api.___serverHost___/cloud


    # Authentication

    You can find the available authorization methods in this section:

    Authorization methods


    Project ID & Region ID


    Most endpoints require project_id and region_id path parameters.

    List Regions

    and

    List Projects

    to see available projects and regions.'
  version: 14.491.0
servers:
- url: https://api.___serverHost___/cloud
tags:
- name: Instances
paths:
  /v1/apptemplates/{project_id}/{region_id}:
    get:
      operationId: AppTemplateListHandler.get
      summary: List apptemplates
      description: Retrieve marketplace application templates list. Application templates are used in instance creation API v2
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppTemplateCollectionSerializer'
      tags:
      - Instances
  /v1/apptemplates/{project_id}/{region_id}/{apptemplate_id}:
    get:
      operationId: AppTemplateGetOneHandler.get
      summary: Get apptemplate
      description: ''
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      - in: path
        name: apptemplate_id
        required: true
        description: App template ID
        schema:
          description: App template ID
          examples:
          - tf2server
          title: Apptemplate Id
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppTemplateSerializer'
      tags:
      - Instances
  /v1/flavors/{project_id}/{region_id}:
    get:
      operationId: FlavorsViewSet.get
      summary: List instance flavors
      description: 'Retrieve a list of available instance flavors in the project and region.

        When `include_prices` is specified, the list includes pricing information.

        Trial mode clients see all prices as 0. Contact support for pricing errors.'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 7
          title: Region Id
          type: integer
      - in: query
        name: disabled
        required: false
        description: Flag for filtering disabled flavors in the region. Defaults to true
        schema:
          default: true
          description: Flag for filtering disabled flavors in the region. Defaults to true
          title: Disabled
          type: boolean
      - in: query
        name: exclude_linux
        required: false
        description: Set to true to exclude flavors dedicated to linux images
        schema:
          default: false
          description: Set to true to exclude flavors dedicated to linux images
          title: Exclude Linux
          type: boolean
      - in: query
        name: exclude_windows
        required: false
        description: Set to true to exclude flavors dedicated to windows images
        schema:
          default: false
          description: Set to true to exclude flavors dedicated to windows images
          title: Exclude Windows
          type: boolean
      - in: query
        name: include_prices
        required: false
        description: Set to true if the response should include flavor prices
        schema:
          default: false
          deprecated: true
          description: Set to true if the response should include flavor prices
          title: Include Prices
          type: boolean
      - in: query
        name: limit
        required: false
        description: Optional. Limit the number of returned items
        schema:
          default: 1000
          description: Optional. Limit the number of returned items
          examples:
          - 1000
          exclusiveMinimum: 0
          maximum: 1000
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        description: Optional. Offset value is used to exclude the first set of records from the result
        schema:
          default: 0
          description: Optional. Offset value is used to exclude the first set of records from the result
          examples:
          - 0
          minimum: 0
          title: Offset
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceFlavorExtendedV1CollectionSerializer'
      tags:
      - Instances
  /v2/instances/{project_id}/{region_id}:
    post:
      operationId: InstanceCreateSetV2.post
      summary: Create instance
      description: 'Create an instance with specified configuration.


        How to get access:


        For Linux,


        - Use the `user_data` field to provide a

        cloud-init script

        in base64 to apply configurations to the instance.

        - Specify the `username` and `password` to create a new user.

        - When only `password` is provided, it is set as the password for the default user of the image.

        - The `user_data` is ignored when the `password` is specified.


        For Windows,


        - Use the `user_data` field to provide a

        cloudbase-init script

        in base64 to create new users on Windows.

        - Use the `password` field to set the password for the ''Admin'' user on Windows.

        - The password of the Admin user cannot be updated via `user_data`.

        - The `username` cannot be specified in the request.'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskIDsSerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInstanceSerializerV2'
      tags:
      - Instances
  /v1/instances/{project_id}/{region_id}:
    get:
      operationId: InstanceViewSetV1.get
      summary: List instances
      description: 'List all instances in the specified project and region.

        Results can be filtered by various parameters like name, status, and IP address.'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      - in: query
        name: available_floating
        required: false
        description: Only show instances which are able to handle floating address
        schema:
          description: Only show instances which are able to handle floating address
          examples:
          - true
          title: Available Floating
          type: boolean
      - in: query
        name: changes-before
        required: false
        description: Filters the instances by a date and time stamp when the instances last changed.
        schema:
          description: Filters the instances by a date and time stamp when the instances last changed.
          examples:
          - '2025-10-01T12:00:00Z'
          format: date-time
          title: Changes-Before
          type: string
      - in: query
        name: changes-since
        required: false
        description: Filters the instances by a date and time stamp when the instances last changed status.
        schema:
          description: Filters the instances by a date and time stamp when the instances last changed status.
          examples:
          - '2025-10-01T12:00:00Z'
          format: date-time
          title: Changes-Since
          type: string
      - in: query
        name: exclude_flavor_prefix
        required: false
        description: Exclude instances with specified flavor prefix
        schema:
          description: Exclude instances with specified flavor prefix
          examples:
          - g1-
          title: Exclude Flavor Prefix
          type: string
      - in: query
        name: exclude_secgroup
        required: false
        description: Exclude instances with specified security group name
        schema:
          description: Exclude instances with specified security group name
          examples:
          - secgroup_name
          title: Exclude Secgroup
          type: string
      - in: query
        name: flavor_id
        required: false
        description: Filter out instances by flavor_id. Flavor id must match exactly.
        schema:
          description: Filter out instances by flavor_id. Flavor id must match exactly.
          examples:
          - g2-standard-32-64
          title: Flavor Id
          type: string
      - in: query
        name: flavor_prefix
        required: false
        description: Filter out instances by flavor_prefix.
        schema:
          description: Filter out instances by flavor_prefix.
          examples:
          - g2-
          title: Flavor Prefix
          type: string
      - in: query
        name: include_ai
        required: false
        description: Include GPU clusters' servers
        schema:
          default: false
          deprecated: true
          description: Include GPU clusters' servers
          examples:
          - false
          title: Include Ai
          type: boolean
      - in: query
        name: include_baremetal
        required: false
        description: Include bare metal servers. Please, use `GET /v1/bminstances/` instead
        schema:
          default: false
          deprecated: true
          description: Include bare metal servers. Please, use `GET /v1/bminstances/` instead
          examples:
          - false
          title: Include Baremetal
          type: boolean
      - in: query
        name: include_k8s
        required: false
        description: Include managed k8s worker nodes
        schema:
          default: true
          description: Include managed k8s worker nodes
          title: Include K8S
          type: boolean
      - in: query
        name: ip
        required: false
        description: 'An IPv4 address to filter results by. Note: partial matches are allowed. For example, searching for 192.168.0.1 will return 192.168.0.1, 192.168.0.10, 192.168.0.110, and so on.'
        schema:
          description: 'An IPv4 address to filter results by. Note: partial matches are allowed. For example, searching for 192.168.0.1 will return 192.168.0.1, 192.168.0.10, 192.168.0.110, and so on.'
          examples:
          - 192.168.0.1
          title: Ip
          type: string
      - in: query
        name: limit
        required: false
        description: Optional. Limit the number of returned items
        schema:
          default: 1000
          description: Optional. Limit the number of returned items
          examples:
          - 1000
          exclusiveMinimum: 0
          maximum: 1000
          title: Limit
          type: integer
      - in: query
        name: name
        required: false
        description: Filter instances by name. You can provide a full or partial name, instances with matching names will be returned. For example, entering 'test' will return all instances that contain 'test' in their name.
        schema:
          description: Filter instances by name. You can provide a full or partial name, instances with matching names will be returned. For example, entering 'test' will return all instances that contain 'test' in their name.
          title: Name
          type: string
      - in: query
        name: offset
        required: false
        description: Optional. Offset value is used to exclude the first set of records from the result
        schema:
          default: 0
          description: Optional. Offset value is used to exclude the first set of records from the result
          examples:
          - 0
          minimum: 0
          title: Offset
          type: integer
      - in: query
        name: only_isolated
        required: false
        description: Include only isolated instances
        schema:
          default: false
          description: Include only isolated instances
          title: Only Isolated
          type: boolean
      - in: query
        name: only_with_fixed_external_ip
        required: false
        description: Return bare metals only with external fixed IP addresses.
        schema:
          description: Return bare metals only with external fixed IP addresses.
          examples:
          - true
          title: Only With Fixed External Ip
          type: boolean
      - in: query
        name: order_by
        required: false
        description: Order by field and direction.
        schema:
          $ref: '#/components/schemas/InstancesOrderByChoices'
          default: created.desc
          description: Order by field and direction.
          examples:
          - name.asc
      - in: query
        name: profile_name
        required: false
        description: Filter result by ddos protection profile name. Effective only with with_ddos set to true.
        schema:
          description: Filter result by ddos protection profile name. Effective only with with_ddos set to true.
          examples:
          - profile_name
          title: Profile Name
          type: string
      - in: query
        name: protection_status
        required: false
        description: Filter result by DDoS protection_status. if parameter is provided. Effective only with with_ddos set to true. (Active, Queued or Error)
        schema:
          description: Filter result by DDoS protection_status. if parameter is provided. Effective only with with_ddos set to true. (Active, Queued or Error)
          enum:
          - Active
          - Queued
          - Error
          examples:
          - Active
          title: Protection Status
          type: string
      - in: query
        name: status
        required: false
        description: Filters instances by status.
        schema:
          $ref: '#/components/schemas/InstanceStatusQuery'
          description: Filters instances by status.
          examples:
          - ACTIVE
      - in: query
        name: tag_key_value
        required: false
        description: Optional. Filter by tag key-value pairs.
        schema:
          contentMediaType: application/json
          contentSchema:
            propertyNames:
              description: 'Tag key. Maximum 255 characters. Cannot contain spaces, tabs, newlines, empty string or ''='' character. Trailing or leading whitespaces will be stripped. '
              examples:
              - my-tag
              maxLength: 255
              minLength: 1
              pattern: ^[^\s=]+$
            type: object
            additionalProperties:
              description: 'Tag value. Maximum 255 characters. Cannot contain tabs, newlines, or empty strings. Trailing or leading whitespaces will be stripped. '
              examples:
              - my-tag-value
              maxLength: 255
              minLength: 1
              pattern: ^[^ \t\n\r\f\v]([^\t\n\r\f\v]*[^ \t\n\r\f\v])?$
              type: string
          description: Optional. Filter by tag key-value pairs.
          examples:
          - key: value
          title: Tag Key Value
          type: string
      - in: query
        name: tag_value
        required: false
        description: Optional. Filter by tag values. ?tag_value=value1&tag_value=value2
        schema:
          description: Optional. Filter by tag values. ?tag_value=value1&tag_value=value2
          examples:
          - - value1
            - value2
          items:
            description: 'Tag value. Maximum 255 characters. Cannot contain tabs, newlines, or empty strings. Trailing or leading whitespaces will be stripped. '
            examples:
            - my-tag-value
            maxLength: 255
            minLength: 1
            pattern: ^[^ \t\n\r\f\v]([^\t\n\r\f\v]*[^ \t\n\r\f\v])?$
            type: string
          title: Tag Value
          type: array
      - in: query
        name: type_ddos_profile
        required: false
        description: Return bare metals either only with advanced or only basic DDoS protection. Effective only with with_ddos set to true. (advanced or basic)
        schema:
          description: Return bare metals either only with advanced or only basic DDoS protection. Effective only with with_ddos set to true. (advanced or basic)
          enum:
          - basic
          - advanced
          examples:
          - advanced
          title: Type Ddos Profile
          type: string
      - in: query
        name: uuid
        required: false
        description: Filter the server list result by the UUID of the server. Allowed UUID part
        schema:
          description: Filter the server list result by the UUID of the server. Allowed UUID part
          examples:
          - b5b4d65d-945f-4b98-ab6f-332319c724ef
          maxLength: 36
          title: Uuid
          type: string
      - in: query
        name: with_ddos
        required: false
        description: Include DDoS profile information in the response when set to `true`. Otherwise, the `ddos_profile` field in the response is `null` by default.
        schema:
          default: false
          description: Include DDoS profile information in the response when set to `true`. Otherwise, the `ddos_profile` field in the response is `null` by default.
          examples:
          - true
          title: With Ddos
          type: boolean
      - in: query
        name: with_interfaces_name
        required: false
        description: Include `interface_name` in the addresses
        schema:
          default: false
          description: Include `interface_name` in the addresses
          examples:
          - true
          title: With Interfaces Name
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceCollectionSerializer'
      tags:
      - Instances
  /v1/instances/{project_id}/{region_id}/{instance_id}:
    get:
      operationId: InstanceInstanceViewSet.get
      summary: Get instance
      description: 'Retrieve detailed information about a specific instance.

        The response content language for ddos_profile can be controlled via the ''language'' cookie parameter.


        **Cookie Parameters**:


        - `language` (str, optional): Language for the response content. Affects the `ddos_profile` field.

        Supported values:

        - `''en''` (default)

        - `''de''`'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      - in: path
        name: instance_id
        required: true
        description: Instance ID
        schema:
          description: Instance ID
          examples:
          - b5b4d65d-945f-4b98-ab6f-332319c724ef
          format: uuid4
          title: Instance Id
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceSerializer'
      tags:
      - Instances
    patch:
      operationId: InstanceInstanceViewSet.patch
      summary: Update instance
      description: Rename instance or update tags
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      - in: path
        name: instance_id
        required: true
        description: Instance ID
        schema:
          description: Instance ID
          examples:
          - b5b4d65d-945f-4b98-ab6f-332319c724ef
          format: uuid4
          title: Instance Id
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceSerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInstanceSerializer'
      tags:
      - Instances
    delete:
      operationId: InstanceInstanceViewSet.delete
      summary: Delete instance
      description: ''
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      - in: path
        name: instance_id
        required: true
        description: Instance ID
        schema:
          description: Instance ID
          examples:
          - b5b4d65d-945f-4b98-ab6f-332319c724ef
          format: uuid4
          title: Instance Id
          type: string
      - in: query
        name: delete_floatings
        required: false
        description: True if it is required to delete floating IPs assigned to the instance. Can't be used with `floatings`.
        schema:
          default: false
          description: True if it is required to delete floating IPs assigned to the instance. Can't be used with `floatings`.
          title: Delete Floatings
          type: boolean
      - in: query
        name: floatings
        required: false
        description: Comma separated list of floating ids that should be deleted. Can't be used with `delete_floatings`.
        schema:
          description: Comma separated list of floating ids that should be deleted. Can't be used with `delete_floatings`.
          title: Floatings
          type: string
      - in: query
        name: reserved_fixed_ips
        required: false
        description: Comma separated list of port IDs to be deleted with the instance
        schema:
          description: Comma separated list of port IDs to be deleted with the instance
          title: Reserved Fixed Ips
          type: string
      - in: query
        name: volumes
        required: false
        description: Comma separated list of volume IDs to be deleted with the instance
        schema:
          description: Comma separated list of volume IDs to be deleted with the instance
          examples:
          - volume_id_1,volume_id_2
          title: Volumes
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskIDsSerializer'
      tags:
      - Instances
  /v2/instances/{project_id}/{region_id}/{instance_id}/action:
    post:
      operationId: InstanceActionHandler.post
      summary: Execute instance action
      description: 'The action can be one of: start, stop, reboot, reboot_hard, suspend or resume.

        Suspend and resume are not available for bare metal instances.'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      - in: path
        name: instance_id
        required: true
        description: Instance ID
        schema:
          description: Instance ID
          examples:
          - b5b4d65d-945f-4b98-ab6f-332319c724ef
          format: uuid4
          title: Instance Id
          type: string
      responses:
        '200':
          description: List of created tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskIDsSerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstanceActionSerializerPydantic'
      tags:
      - Instances
  /v1/instances/{project_id}/{region_id}/{instance_id}/addsecuritygroup:
    post:
      operationId: InstanceAddSecurityGroupHandler.post
      summary: Assign security group
      description: 'Assign the security group to the server.

        To assign multiple security groups to all ports, use the NULL value for the port_id field'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      - in: path
        name: instance_id
        required: true
        description: Instance ID
        schema:
          description: Instance ID
          examples:
          - b5b4d65d-945f-4b98-ab6f-332319c724ef
          format: uuid4
          title: Instance Id
          type: string
      responses:
        '204':
          description: No Content
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstancePortsSecurityGroupsSerializer'
      tags:
      - Instances
  /v1/instances/{project_id}/{region_id}/{instance_id}/attach_interface:
    post:
      operationId: AttachInterfaceHandler.post
      summary: Attach interface
      description: Attach interface to instance
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      - in: path
        name: instance_id
        required: true
        description: Instance ID
        schema:
          description: Instance ID
          examples:
          - bf325375-9af6-4c8b-a2fc-7f6f4ca02e2e
          format: uuid4
          title: Instance Id
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskIDsSerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachInterfaceBodySerializer'
      tags:
      - Instances
  /v1/instances/{project_id}/{region_id}/{instance_id}/available_flavors:
    get:
      operationId: InstanceFlavorViewSet.get
