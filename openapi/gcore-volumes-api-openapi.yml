          application/json:
            schema:
              $ref: '#/components/schemas/InstanceIdSerializer'
      tags:
      - Volumes
  /v1/volumes/{project_id}/{region_id}/{volume_id}/metadata:
    post:
      operationId: VolumeMetadataHandler.post
      summary: Create or update volume tags
      description: 'Create or update one or more tags for a volume.

        If a tag does not exist, it gets created.

        If a tag already exists, its value is overwritten.


        Use PATCH /v1/volumes/{project_id}/{region_id}/{volume_id} instead'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      - in: path
        name: volume_id
        required: true
        description: Volume ID
        schema:
          description: Volume ID
          examples:
          - 726ecfcc-7fd0-4e30-a86e-7892524aa483
          format: uuid4
          title: Volume Id
          type: string
      responses:
        '204':
          description: No Content
      deprecated: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTagsSerializer'
      tags:
      - Volumes
    get:
      operationId: VolumeMetadataHandler.get
      summary: List volume tags
      description: 'Retrieve all tags associated with a volume.


        Use GET /v1/volumes/{project_id}/{region_id}/{volume_id} instead'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      - in: path
        name: volume_id
        required: true
        description: Volume ID
        schema:
          description: Volume ID
          examples:
          - 726ecfcc-7fd0-4e30-a86e-7892524aa483
          format: uuid4
          title: Volume Id
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagCollectionSerializer'
      deprecated: true
      tags:
      - Volumes
    put:
      operationId: VolumeMetadataHandler.put
      summary: Replace volume tags
      description: 'Delete all existing tags and replace them with the tags from the request.


        Use PATCH /v1/volumes/{project_id}/{region_id}/{volume_id} instead'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      - in: path
        name: volume_id
        required: true
        description: Volume ID
        schema:
          description: Volume ID
          examples:
          - 726ecfcc-7fd0-4e30-a86e-7892524aa483
          format: uuid4
          title: Volume Id
          type: string
      responses:
        '204':
          description: No Content
      deprecated: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTagsSerializer'
      tags:
      - Volumes
  /v1/volumes/{project_id}/{region_id}/{volume_id}/metadata_item:
    get:
      operationId: VolumeMetadataItemHandler.get
      summary: Get volume tag
      description: 'Retrieve a specific tag by its key from a volume.


        Use GET /v1/volumes/{project_id}/{region_id}/{volume_id} instead'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      - in: path
        name: volume_id
        required: true
        description: Volume ID
        schema:
          description: Volume ID
          examples:
          - 726ecfcc-7fd0-4e30-a86e-7892524aa483
          format: uuid4
          title: Volume Id
          type: string
      - in: query
        name: key
        required: true
        description: Tag key
        schema:
          description: Tag key
          examples:
          - cost-center
          title: Key
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagSerializer'
      deprecated: true
      tags:
      - Volumes
    delete:
      operationId: VolumeMetadataItemHandler.delete
      summary: Delete volume tag
      description: 'Delete a specific tag by its key from a volume.


        Use PATCH /v1/volumes/{project_id}/{region_id}/{volume_id} instead'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      - in: path
        name: volume_id
        required: true
        description: Volume ID
        schema:
          description: Volume ID
