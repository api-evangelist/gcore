openapi: 3.2.0
info:
  title: Cloud Volumes API
  description: '___brandName___ Cloud API provides an API to manage Cloud resources and services.

    API address is: https://api.___serverHost___/cloud


    # Authentication

    You can find the available authorization methods in this section:

    Authorization methods


    Project ID & Region ID


    Most endpoints require project_id and region_id path parameters.

    List Regions

    and

    List Projects

    to see available projects and regions.'
  version: 14.491.0
servers:
- url: https://api.___serverHost___/cloud
tags:
- name: Volumes
paths:
  /v1/pricing/{project_id}/{region_id}/volumes:
    post:
      operationId: VolumePricingHandler.post
      summary: Preview volume price
      description: Preview the billing price of a volume's type and size.
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          format: int64
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          format: int64
          title: Region Id
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemPriceResponseSerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VolumeOrSnapshotPricingRequestSerializer'
      tags:
      - Volumes
  /v1/volumes/{project_id}/{region_id}:
    post:
      operationId: VolumeViewSet.post
      summary: Create volume
      description: 'Create a new volume in the project and region.

        The volume can be created from scratch, from an image, or from a snapshot.

        Optionally attach the volume to an instance during creation.'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskIDsSerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVolumeSerializer'
      tags:
      - Volumes
    get:
      operationId: VolumeViewSet.get
      summary: List volumes
      description: 'Retrieve a list of volumes in the project and region.

        The list can be filtered by various parameters like bootable status,

        metadata/tags, attachments, instance ID, name, and ID.'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      - in: query
        name: bootable
        required: false
        description: Filter by bootable field
        schema:
          description: Filter by bootable field
          examples:
          - false
          title: Bootable
          type: boolean
      - in: query
        name: cluster_id
        required: false
        description: Filter volumes by k8s cluster ID
        schema:
          description: Filter volumes by k8s cluster ID
          examples:
          - t12345
          title: Cluster Id
          type: string
      - in: query
        name: has_attachments
        required: false
        description: Filter by the presence of attachments
        schema:
          description: Filter by the presence of attachments
          examples:
          - true
          title: Has Attachments
          type: boolean
      - in: query
        name: id_part
        required: false
        description: Filter the volume list result by the ID part of the volume
        schema:
          description: Filter the volume list result by the ID part of the volume
          examples:
          - 726ecfcc-7fd0-4e30-a86e-7892524aa483
          title: Id Part
          type: string
      - in: query
        name: instance_id
        required: false
        description: Filter volumes by instance ID
        schema:
          description: Filter volumes by instance ID
          examples:
          - 169942e0-9b53-42df-95ef-1a8b6525c2bd
          format: uuid4
          title: Instance Id
          type: string
      - in: query
        name: limit
        required: false
        description: Optional. Limit the number of returned items
        schema:
          default: 1000
          description: Optional. Limit the number of returned items
          examples:
          - 1000
          exclusiveMinimum: 0
          maximum: 1000
          title: Limit
          type: integer
      - in: query
        name: name_part
        required: false
        description: Filter volumes by name_part inclusion in volume name.Any substring can be used and volumes will be returned with names containing the substring.
        schema:
          description: Filter volumes by name_part inclusion in volume name.Any substring can be used and volumes will be returned with names containing the substring.
          examples:
          - test
          title: Name Part
          type: string
      - in: query
        name: offset
        required: false
        description: Optional. Offset value is used to exclude the first set of records from the result
        schema:
          default: 0
          description: Optional. Offset value is used to exclude the first set of records from the result
          examples:
          - 0
          minimum: 0
          title: Offset
          type: integer
      - in: query
        name: tag_key
        required: false
        description: Optional. Filter by tag keys. ?tag_key=key1&tag_key=key2
        schema:
          description: Optional. Filter by tag keys. ?tag_key=key1&tag_key=key2
          examples:
          - - key1
            - key2
          items:
            description: 'Tag key. Maximum 255 characters. Cannot contain spaces, tabs, newlines, empty string or ''='' character. Trailing or leading whitespaces will be stripped. '
            examples:
            - my-tag
            maxLength: 255
            minLength: 1
            pattern: ^[^\s=]+$
            type: string
          title: Tag Key
          type: array
      - in: query
        name: tag_key_value
        required: false
        description: Optional. Filter by tag key-value pairs.
        schema:
          contentMediaType: application/json
          contentSchema:
            propertyNames:
              description: 'Tag key. Maximum 255 characters. Cannot contain spaces, tabs, newlines, empty string or ''='' character. Trailing or leading whitespaces will be stripped. '
              examples:
              - my-tag
              maxLength: 255
              minLength: 1
              pattern: ^[^\s=]+$
            type: object
            additionalProperties:
              description: 'Tag value. Maximum 255 characters. Cannot contain tabs, newlines, or empty strings. Trailing or leading whitespaces will be stripped. '
              examples:
              - my-tag-value
              maxLength: 255
              minLength: 1
              pattern: ^[^ \t\n\r\f\v]([^\t\n\r\f\v]*[^ \t\n\r\f\v])?$
              type: string
          description: Optional. Filter by tag key-value pairs.
          examples:
          - key: value
          title: Tag Key Value
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeCollectionSerializer'
      tags:
      - Volumes
  /v1/volumes/{project_id}/{region_id}/{volume_id}:
    get:
      operationId: VolumeInstanceViewSet.get
      summary: Get volume
      description: Retrieve detailed information about a specific volume.
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      - in: path
        name: volume_id
        required: true
        description: Volume ID
        schema:
          description: Volume ID
          examples:
          - 726ecfcc-7fd0-4e30-a86e-7892524aa483
          format: uuid4
          title: Volume Id
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeSerializer'
      tags:
      - Volumes
    patch:
      operationId: VolumeInstanceViewSet.patch
      summary: Update volume
      description: Rename a volume or update tags
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      - in: path
        name: volume_id
        required: true
        description: Volume ID
        schema:
          description: Volume ID
          examples:
          - 726ecfcc-7fd0-4e30-a86e-7892524aa483
          format: uuid4
          title: Volume Id
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeSerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVolumeSerializer'
      tags:
      - Volumes
    delete:
      operationId: VolumeInstanceViewSet.delete
      summary: Delete volume
      description: 'Delete a volume and all its snapshots.

        The volume must be in an available state to be deleted.'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      - in: path
        name: volume_id
        required: true
        description: Volume ID
        schema:
          description: Volume ID
          examples:
          - 726ecfcc-7fd0-4e30-a86e-7892524aa483
          format: uuid4
          title: Volume Id
          type: string
      - in: query
        name: snapshots
        required: false
        description: Comma separated list of snapshot IDs to be deleted with the volume.
        schema:
          description: Comma separated list of snapshot IDs to be deleted with the volume.
          examples:
          - 726ecfcc-7fd0-4e30-a86e-7892524aa483,726ecfcc-7fd0-4e30-a86e-7892524aa484
          title: Snapshots
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskIDsSerializer'
      tags:
      - Volumes
  /v2/volumes/{project_id}/{region_id}/{volume_id}/attach:
    post:
      operationId: VolumeInstanceAttachViewV2.post
      summary: Attach volume
      description: 'Attach the volume to instance. Note: ultra volume can only be attached to an instance with shared flavor'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      - in: path
        name: volume_id
        required: true
        description: Volume ID
        schema:
          description: Volume ID
          examples:
          - 726ecfcc-7fd0-4e30-a86e-7892524aa483
          format: uuid4
          title: Volume Id
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskIDsSerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachVolumeToInstanceSerializer'
      tags:
      - Volumes
  /v2/volumes/{project_id}/{region_id}/{volume_id}/detach:
    post:
      operationId: VolumeInstanceDetachViewV2.post
      summary: Detach volume
      description: Detach the volume from instance
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      - in: path
        name: volume_id
        required: true
        description: Volume ID
        schema:
          description: Volume ID
          examples:
          - 726ecfcc-7fd0-4e30-a86e-7892524aa483
          format: uuid4
          title: Volume Id
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskIDsSerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstanceIdSerializer'
      tags:
      - Volumes
  /v1/volumes/{project_id}/{region_id}/{volume_id}/extend:
    post:
      operationId: VolumeInstanceExtendView.post
      summary: Extend volume
      description: 'Increase the size of a volume.

        The volume must be in an available or in-use state to be extended.

        The new size must be greater than the current size.'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      - in: path
        name: volume_id
        required: true
        description: Volume ID
        schema:
          description: Volume ID
          examples:
          - 726ecfcc-7fd0-4e30-a86e-7892524aa483
          format: uuid4
          title: Volume Id
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskIDsSerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SizeSerializer'
      tags:
      - Volumes
  /v1/volumes/{project_id}/{region_id}/{volume_id}/retype:
    post:
      operationId: VolumeInstanceRetypeView.post
      summary: Change volume type
      description: 'Change the type of a volume.

        The volume must not have any snapshots to change its type.'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      - in: path
        name: volume_id
        required: true
        description: Volume ID
        schema:
          description: Volume ID
          examples:
          - 726ecfcc-7fd0-4e30-a86e-7892524aa483
          format: uuid4
          title: Volume Id
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeSerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VolumeRetypeSerializer'
      tags:
      - Volumes
  /v1/volumes/{project_id}/{region_id}/{volume_id}/revert:
    post:
      operationId: VolumeInstanceRevertView.post
      summary: Revert volume
      description: Revert a volume to its last snapshot. The volume must be in an available state to be reverted.
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      - in: path
        name: volume_id
        required: true
        description: Volume ID
        schema:
          description: Volume ID
          examples:
          - 726ecfcc-7fd0-4e30-a86e-7892524aa483
          format: uuid4
          title: Volume Id
          type: string
      responses:
        '200':
          description: OK
      tags:
      - Volumes
  /v1/volumes/{project_id}/{region_id}/{volume_id}/attach:
    post:
      operationId: VolumeInstanceAttachView.post
      summary: Attach volume
      description: 'Attach a volume to an instance.

        The volume must be in an available state to be attached.'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      - in: path
        name: volume_id
        required: true
        description: Volume ID
        schema:
          description: Volume ID
          examples:
          - 726ecfcc-7fd0-4e30-a86e-7892524aa483
          format: uuid4
          title: Volume Id
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeSerializer'
      deprecated: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachVolumeToInstanceSerializer'
      tags:
      - Volumes
  /v1/volumes/{project_id}/{region_id}/{volume_id}/detach:
    post:
      operationId: VolumeInstanceDetachView.post
      summary: Detach volume
      description: 'Detach a volume from an instance.

        The volume must be in-use state to be detached.'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      - in: path
        name: volume_id
        required: true
        description: Volume ID
        schema:
          description: Volume ID
          examples:
          - 726ecfcc-7fd0-4e30-a86e-7892524aa483
          format: uuid4
          title: Volume Id
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeSerializer'
      deprecated: true
      requestBody:
