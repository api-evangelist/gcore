components:
  schemas:
    ScaleTriggersSerializer:
      properties:
        cpu:
          anyOf:
          - $ref: '#/components/schemas/CpuTriggerSerializer'
          - type: 'null'
          default: null
          description: CPU trigger configuration
        http:
          anyOf:
          - $ref: '#/components/schemas/HttpTriggerSerializer'
          - type: 'null'
          default: null
          description: HTTP trigger configuration
        memory:
          anyOf:
          - $ref: '#/components/schemas/MemoryTriggerSerializer'
          - type: 'null'
          default: null
          description: Memory trigger configuration
      title: ScaleTriggersSerializer
      type: object
    PullSecretCreateSerializer:
      properties:
        login:
          description: Pull secret login
          examples:
          - login
          maxLength: 100
          minLength: 1
          title: Login
          type: string
        name:
          description: Pull secret name
          examples:
          - my-secret
          maxLength: 250
          minLength: 1
          pattern: ^[a-z][-a-z0-9]{0,24}[a-z0-9]$
          title: Name
          type: string
        password:
          description: Pull secret password
          examples:
          - password
          format: password
          maxLength: 5000
          minLength: 1
          title: Password
          type: string
          writeOnly: true
        registry:
          description: Pull secret registry
          examples:
          - some.registry.com
          maxLength: 400
          minLength: 1
          title: Registry
          type: string
      required:
      - name
      - registry
      - login
      - password
      title: PullSecretCreateSerializer
      type: object
    ContainerSerializer:
      properties:
        address:
          description: Container address
          examples:
          - some.example.com
          title: Address
          type: string
        commands:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Container's commands
          examples:
          - python3 app.py -m test
          title: Commands
        created_at:
          description: Container creation date
          examples:
          - '2021-01-01T00:00:00Z'
          format: date-time
          title: Created At
          type: string
        deploy_status:
          $ref: '#/components/schemas/DeployStatusSerializer'
          description: Container deploy status
        description:
          description: Container description
          examples:
          - My first container
          title: Description
          type: string
        envs:
          description: Container environment variables
          examples:
          - ENVIRONMENT_VARIABLE: value 2
            ENV_VAR: value 1
          propertyNames:
            maxLength: 255
            pattern: ^[a-zA-Z_][a-zA-Z0-9_]*$
          title: Envs
          type: object
          additionalProperties:
            maxLength: 255
            type: string
        flavor:
          description: Container flavor
          examples:
          - 250mCPU-512MiB
          title: Flavor
          type: string
        image:
          description: Container image
          examples:
          - nginx:latest
          title: Image
          type: string
        is_api_key_auth:
          description: Enable/Disable api key authentication
          examples:
          - false
          title: Is Api Key Auth
          type: boolean
        is_disabled:
          description: Set to true if container is disabled
          examples:
          - false
          title: Is Disabled
          type: boolean
        listening_port:
          description: Container listening port
          examples:
          - 80
          title: Listening Port
          type: integer
        logging:
          anyOf:
          - $ref: '#/components/schemas/LoggingOutSerializer'
          - type: 'null'
          default: null
          description: Logging configuration
          examples:
          - destination_region_id: 1
            enabled: true
            retention_policy:
              period: 45
            topic_name: my-log-name
        name:
          description: Container name
          examples:
          - nginx
          title: Name
