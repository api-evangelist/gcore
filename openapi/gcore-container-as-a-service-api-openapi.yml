openapi: 3.2.0
info:
  title: Cloud Container as a Service API
  description: '___brandName___ Cloud API provides an API to manage Cloud resources and services.

    API address is: https://api.___serverHost___/cloud


    # Authentication

    You can find the available authorization methods in this section:

    Authorization methods


    Project ID & Region ID


    Most endpoints require project_id and region_id path parameters.

    List Regions

    and

    List Projects

    to see available projects and regions.'
  version: 14.491.0
servers:
- url: https://api.___serverHost___/cloud
tags:
- name: Container as a Service
paths:
  /v1/caas/{project_id}/{region_id}/check_limits:
    post:
      operationId: ContainerCheckLimitsHandler.post
      summary: Check container quota
      description: 'Check if regional quota is exceeded, if yes the number of additional

        quotas needed to create the specified cluster will be calculated.'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project id
        schema:
          description: Project id
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region id
        schema:
          description: Region id
          examples:
          - 1
          title: Region Id
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerQuotaCheckSerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckQuotaBeforeContainerCreation'
      tags:
      - Container as a Service
  /v1/caas/{project_id}/{region_id}/containers:
    post:
      operationId: ContainersHandler.post
      summary: Create container
      description: Create a new container with the specified configuration.
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project id
        schema:
          description: Project id
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region id
        schema:
          description: Region id
          examples:
          - 1
          title: Region Id
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskIDsSerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContainerCreateSerializer'
      tags:
      - Container as a Service
    get:
      operationId: ContainersHandler.get
      summary: List containers
      description: List all containers in the specified project and region.
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project id
        schema:
          description: Project id
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region id
        schema:
          description: Region id
          examples:
          - 1
          title: Region Id
          type: integer
      - in: query
        name: limit
        required: false
        description: Optional. Limit the number of returned items
        schema:
          default: 1000
          description: Optional. Limit the number of returned items
          examples:
          - 1000
          exclusiveMinimum: 0
          maximum: 1000
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        description: Optional. Offset value is used to exclude the first set of records from the result
        schema:
          default: 0
          description: Optional. Offset value is used to exclude the first set of records from the result
          examples:
          - 0
          minimum: 0
          title: Offset
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerListSerializer'
      tags:
      - Container as a Service
  /v1/caas/{project_id}/{region_id}/containers/{container_name}:
    get:
      operationId: ContainerHandler.get
      summary: Get container
      description: Get detailed information about a specific container.
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project id
        schema:
          description: Project id
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region id
        schema:
          description: Region id
          examples:
          - 1
          title: Region Id
          type: integer
      - in: path
        name: container_name
        required: true
        description: Container name
        schema:
          description: Container name
          examples:
          - my-container
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9.-]+[a-zA-Z0-9]$
          title: Container Name
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerSerializer'
      tags:
      - Container as a Service
    patch:
      operationId: ContainerHandler.patch
      summary: Update container
      description: Update the configuration of an existing container.
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project id
        schema:
          description: Project id
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region id
        schema:
          description: Region id
          examples:
          - 1
          title: Region Id
          type: integer
      - in: path
        name: container_name
        required: true
        description: Container name
        schema:
          description: Container name
          examples:
          - my-container
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9.-]+[a-zA-Z0-9]$
          title: Container Name
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskIDsSerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContainerPatchSerializer'
      tags:
      - Container as a Service
    delete:
      operationId: ContainerHandler.delete
      summary: Delete container
      description: Delete a container and all its associated resources.
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project id
        schema:
          description: Project id
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region id
        schema:
          description: Region id
          examples:
          - 1
          title: Region Id
          type: integer
      - in: path
        name: container_name
        required: true
        description: Container name
        schema:
          description: Container name
          examples:
          - my-container
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9.-]+[a-zA-Z0-9]$
          title: Container Name
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskIDsSerializer'
      tags:
      - Container as a Service
  /v1/caas/{project_id}/{region_id}/containers/{container_name}/logs:
    get:
      operationId: LogsContainerHandler.get
      summary: Get container logs
      description: Get the logs for a specific container.
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project id
