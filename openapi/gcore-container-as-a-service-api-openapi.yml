        required: true
        description: Project id
        schema:
          description: Project id
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region id
        schema:
          description: Region id
          examples:
          - 1
          title: Region Id
          type: integer
      - in: query
        name: name
        required: false
        description: Flavor name
        schema:
          anyOf:
          - pattern: ^[0-9]{0,12}mCPU-[0-9]{0,12}M[i]?B$
            type: string
          - type: 'null'
          default: null
          description: Flavor name
          examples:
          - 128mCPU-128MiB
          title: Name
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaasFlavorListSerializer'
      tags:
      - Container as a Service
