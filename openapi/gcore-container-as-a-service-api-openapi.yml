        schema:
          description: Container name
          examples:
          - my-container
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9.-]+[a-zA-Z0-9]$
          title: Container Name
          type: string
      - in: query
        name: limit
        required: false
        description: Limit the number of logs lines
        schema:
          default: 1000
          description: Limit the number of logs lines
          examples:
          - 10
          maximum: 100000
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
