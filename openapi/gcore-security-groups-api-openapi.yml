openapi: 3.2.0
info:
  title: Cloud Security Groups API
  description: '___brandName___ Cloud API provides an API to manage Cloud resources and services.

    API address is: https://api.___serverHost___/cloud


    # Authentication

    You can find the available authorization methods in this section:

    Authorization methods


    Project ID & Region ID


    Most endpoints require project_id and region_id path parameters.

    List Regions

    and

    List Projects

    to see available projects and regions.'
  version: 14.491.0
servers:
- url: https://api.___serverHost___/cloud
tags:
- name: Security Groups
paths:
  /v2/security_groups/{project_id}/{region_id}:
    post:
      operationId: SecurityGroupViewSetV2.post
      summary: Create security group
      description: 'Creates a new security group. Rule handling depends on the `rules` field:

        - omitted: the default template (ingress + egress allow-all) is applied;

        - non-empty list: exactly those rules are created (nothing is appended);

        - empty list `[]`: no rules are created.'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      responses:
        '200':
          description: Task IDs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskIDsSerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSecurityGroupSerializerV2'
      tags:
      - Security Groups
  /v2/security_groups/{project_id}/{region_id}/{group_id}:
    patch:
      operationId: SecurityGroupInstanceViewSetV2.patch
      summary: Update security group
      description: 'Updates the specified security group with the provided changes.


        **Behavior:**

        - Simple fields (name, description) will be updated if provided

        - Undefined fields will remain unchanged

        - If no change is detected for a specific field compared to the current security group state,

        that field will be skipped

        - If no changes are detected at all across all fields, no task will be created and

        an empty task list will be returned


        **Important - Security Group Rules:**

        - Rules must be specified completely as the desired final state

        - The system compares the provided rules against the current state

        - Rules that exist in the request but not in the current state will be added

        - Rules that exist in the current state but not in the request will be removed

        - To keep existing rules, they must be included in the request alongside any new rules'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      - in: path
        name: group_id
        required: true
        description: Security group ID
        schema:
          description: Security group ID
          examples:
          - 00000000-0000-4000-8000-000000000000
          format: uuid4
          title: Group Id
          type: string
      responses:
        '200':
          description: Task IDs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskIDsSerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSecurityGroupSerializerV2'
      tags:
      - Security Groups
