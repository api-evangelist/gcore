        required: false
        description: Limit of items on a single page
        schema:
          default: 10
          description: Limit of items on a single page
          examples:
          - 10
          exclusiveMinimum: 0
          maximum: 1000
          title: Limit
          type: integer
      - in: query
        name: name
        required: false
        description: Optional. Filter by name. Must be specified a full name of the security group.
        schema:
          description: Optional. Filter by name. Must be specified a full name of the security group.
          examples:
          - my_security_group
          title: Name
          type: string
      - in: query
        name: offset
        required: false
        description: Offset in results list
        schema:
          default: 0
          description: Offset in results list
          examples:
          - 0
          minimum: 0
          title: Offset
          type: integer
      - in: query
        name: tag_key
        required: false
        description: Optional. Filter by tag keys. ?tag_key=key1&tag_key=key2
        schema:
          description: Optional. Filter by tag keys. ?tag_key=key1&tag_key=key2
          examples:
          - - key1
            - key2
          items:
            description: 'Tag key. Maximum 255 characters. Cannot contain spaces, tabs, newlines, empty string or ''='' character. Trailing or leading whitespaces will be stripped. '
            examples:
            - my-tag
            maxLength: 255
            minLength: 1
            pattern: ^[^\s=]+$
            type: string
          title: Tag Key
          type: array
      - in: query
        name: tag_key_value
        required: false
        description: Optional. Filter by tag key-value pairs.
        schema:
          contentMediaType: application/json
          contentSchema:
            propertyNames:
              description: 'Tag key. Maximum 255 characters. Cannot contain spaces, tabs, newlines, empty string or ''='' character. Trailing or leading whitespaces will be stripped. '
              examples:
              - my-tag
              maxLength: 255
              minLength: 1
              pattern: ^[^\s=]+$
            type: object
            additionalProperties:
              description: 'Tag value. Maximum 255 characters. Cannot contain tabs, newlines, or empty strings. Trailing or leading whitespaces will be stripped. '
              examples:
              - my-tag-value
              maxLength: 255
              minLength: 1
              pattern: ^[^ \t\n\r\f\v]([^\t\n\r\f\v]*[^ \t\n\r\f\v])?$
              type: string
          description: Optional. Filter by tag key-value pairs.
          examples:
          - key: value
          title: Tag Key Value
          type: string
      responses:
        '200':
          description: Security groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityGroupCollectionSerializer'
      tags:
