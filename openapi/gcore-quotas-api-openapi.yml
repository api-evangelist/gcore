openapi: 3.2.0
info:
  title: Cloud Quotas API
  description: '___brandName___ Cloud API provides an API to manage Cloud resources and services.

    API address is: https://api.___serverHost___/cloud


    # Authentication

    You can find the available authorization methods in this section:

    Authorization methods


    Project ID & Region ID


    Most endpoints require project_id and region_id path parameters.

    List Regions

    and

    List Projects

    to see available projects and regions.'
  version: 14.491.0
servers:
- url: https://api.___serverHost___/cloud
tags:
- name: Quotas
paths:
  /v2/client_quotas:
    get:
      operationId: ClientQuotasHandler.get
      summary: Get all quotas
      description: Get combined client quotas, including both regional and global quotas.
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllClientQuotasSerializer'
      tags:
      - Quotas
  /v2/client_quotas/{client_id}/notification_threshold:
    get:
      operationId: QuotaNotificationThresholdByClientIdHandler.get
      summary: Get quota notification threshold
      description: 'Get a client''s quota notification threshold. This threshold is used to send warning notifications to the client

        when their quota usage reaches the specified percentage. Defaults to 80% if not set.'
      parameters:
      - in: path
        name: client_id
        required: true
        description: Client ID
        schema:
          description: Client ID
          examples:
          - 3
          title: Client Id
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaNotificationThresholdSerializer'
      tags:
      - Quotas
    put:
      operationId: QuotaNotificationThresholdByClientIdHandler.put
      summary: Update quota notification threshold
      description: 'Update or create a client''s quota notification threshold. This threshold is used to send warning notifications

        to the client when their quota usage reaches the specified percentage. Defaults to 80%.'
      parameters:
      - in: path
        name: client_id
        required: true
        description: Client ID
        schema:
          description: Client ID
          examples:
          - 3
          title: Client Id
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaNotificationThresholdSerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuotaThresholdSerializer'
      tags:
      - Quotas
    delete:
      operationId: QuotaNotificationThresholdByClientIdHandler.delete
      summary: Delete quota notification threshold
      description: Delete a client's quota notification threshold. After deletion, the default threshold of 80% will be used.
      parameters:
      - in: path
        name: client_id
        required: true
        description: Client ID
        schema:
          description: Client ID
          examples:
          - 3
          title: Client Id
          type: integer
      responses:
        '204':
          description: No Content
      tags:
      - Quotas
  /v2/global_quotas/{client_id}:
    get:
      operationId: GlobalClientQuotasViewSet.get
      summary: Get global quotas
      description: Get global quotas for a specific client.
      parameters:
      - in: path
        name: client_id
        required: true
        description: Client ID
        schema:
          description: Client ID
          examples:
          - 3
          title: Client Id
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalQuotasSerializer'
      tags:
      - Quotas
  /v2/limits_request:
    post:
      operationId: CreateQuotaLimitsRequestViewSet.post
      summary: Create quota limit request
      description: Create a request to change current quotas.
      parameters: []
      responses:
        '201':
          description: Created
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LimitsRequestCreateSerializer'
      tags:
      - Quotas
    get:
      operationId: CreateQuotaLimitsRequestViewSet.get
      summary: List quota limit requests
      description: Get a list of sent requests to change current quotas and their statuses.
      parameters:
      - in: query
        name: created_from
        required: false
        description: Filter limit requests created at or after this datetime (inclusive)
        schema:
          description: Filter limit requests created at or after this datetime (inclusive)
          examples:
          - '2024-01-01T00:00:00Z'
          format: date-time
          title: Created From
          type: string
      - in: query
        name: created_to
        required: false
        description: Filter limit requests created at or before this datetime (inclusive)
        schema:
          description: Filter limit requests created at or before this datetime (inclusive)
          examples:
          - '2024-12-31T23:59:59Z'
          format: date-time
          title: Created To
          type: string
      - in: query
        name: limit
        required: false
        description: Optional. Limit the number of returned items
        schema:
          default: 1000
          description: Optional. Limit the number of returned items
          examples:
          - 1000
          exclusiveMinimum: 0
          maximum: 1000
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        description: Optional. Offset value is used to exclude the first set of records from the result
        schema:
          default: 0
          description: Optional. Offset value is used to exclude the first set of records from the result
          examples:
          - 0
          minimum: 0
          title: Offset
          type: integer
      - in: query
        name: request_ids
        required: false
        description: List of limit request IDs for filtering
        schema:
          description: List of limit request IDs for filtering
          examples:
          - - 1
            - 2
            - 3
          items:
            format: int64
            type: integer
          title: Request Ids
          type: array
      - in: query
        name: status
        required: false
        description: List of limit requests statuses for filtering
        schema:
          description: List of limit requests statuses for filtering
          examples:
          - - done
            - in progress
          items:
            $ref: '#/components/schemas/LimitsRequestStatus'
          title: Status
          type: array
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitsRequestCollectionSerializer'
      tags:
      - Quotas
  /v2/limits_request/{request_id}:
    get:
      operationId: ShowQuotaLimitsRequestViewSet.get
      summary: Get quota limit request
      description: Get detailed information about a specific quota limit request.
      parameters:
      - in: path
        name: request_id
        required: true
        description: LimitRequest ID
        schema:
          description: LimitRequest ID
          examples:
          - 3
          format: int64
          title: Request Id
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitsRequestSerializer'
      tags:
      - Quotas
    delete:
      operationId: ShowQuotaLimitsRequestViewSet.delete
      summary: Delete quota limit request
      description: Delete a specific quota limit request.
      parameters:
      - in: path
        name: request_id
        required: true
        description: LimitRequest ID
        schema:
          description: LimitRequest ID
          examples:
          - 3
          format: int64
          title: Request Id
          type: integer
      responses:
        '204':
          description: No Content
      tags:
      - Quotas
  /v2/regional_quotas/{client_id}/{region_id}:
    get:
      operationId: ClientUpdateRegionalQuotasViewSet.get
      summary: Get regional quotas
      description: Get quotas for a specific region and client.
      parameters:
      - in: path
        name: client_id
        required: true
        description: Client ID
        schema:
          description: Client ID
          examples:
          - 3
          title: Client Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegionalQuotasSerializer'
      tags:
      - Quotas
components:
  schemas:
    QuotaThresholdSerializer:
      properties:
        last_message:
          anyOf:
          - $ref: '#/components/schemas/QuotasThresholdSerializer'
          - type: 'null'
          description: A message data
        last_sending:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: Time of last successful email sending
          examples:
          - null
          title: Last Sending
        threshold:
          description: Quota notification threshold in percentage
          examples:
          - 95
          maximum: 100
          minimum: 60
          title: Threshold
          type: integer
      required:
      - threshold
      title: QuotaThresholdSerializer
      type: object
    QuotasThresholdSerializer:
      properties:
        global_quotas:
          $ref: '#/components/schemas/GlobalQuotasThresholdSerializer'
          description: Global quota that exceed the threshold
        regional_quotas:
          description: Regional quota that exceed the threshold
          items:
            $ref: '#/components/schemas/RegionalQuotasThresholdSerializer'
          title: Regional Quotas
          type: array
      required:
