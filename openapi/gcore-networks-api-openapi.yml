components:
  schemas:
    TaskIDsSerializer:
      properties:
        tasks:
          description: "List of task IDs representing asynchronous operations. Use these IDs to monitor operation progress:\n  * `GET /v1/tasks/{task_id}` - Check individual task status and details\n  Poll task status until completion (`FINISHED`/`ERROR`) before proceeding with dependent operations."
          examples:
          - - d478ae29-dedc-4869-82f0-96104425f565
          items:
            type: string
          title: Tasks
          type: array
      required:
      - tasks
      title: TaskIDsSerializer
      type: object
    NetworkOwnedBy:
      enum:
      - any
      - project
      title: NetworkOwnedBy
      type: string
    SubnetSerializer:
      properties:
        available_ips:
          anyOf:
          - type: integer
          - type: 'null'
          description: Number of available ips in subnet. Null when this data isn't available.
          examples:
          - 250
          title: Available Ips
        cidr:
          description: CIDR
          examples:
          - 192.168.13.0/24
          format: ipvanynetwork
          title: Cidr
          type: string
        created_at:
          description: Datetime when the subnet was created
          examples:
          - 2019-06-13T13:58:12+0000
          format: date-time
          title: Created At
          type: string
        creator_task_id:
          anyOf:
          - format: uuid4
            type: string
          - type: 'null'
          description: Task that created this entity. Null when the subnet wasn't created via a tracked task.
          examples:
          - 5cc890da-d031-4a23-ac31-625edfa22812
          title: Creator Task Id
        dns_nameservers:
          description: List IP addresses of a DNS resolver reachable from the network
          examples:
          - - 8.8.8.8
            - 8.8.4.4
          items:
            format: ipvanyaddress
            type: string
          title: Dns Nameservers
          type: array
        enable_dhcp:
          description: True if DHCP should be enabled
          examples:
          - true
          title: Enable Dhcp
          type: boolean
        gateway_ip:
          anyOf:
          - format: ipvanyaddress
            type: string
          - type: 'null'
          description: Default GW IPv4 address, advertised in DHCP routes of this subnet. If null, no gateway is advertised by this subnet.
          examples:
          - 192.168.13.1
          title: Gateway Ip
        has_router:
          deprecated: true
          description: Deprecated. Always returns `false`.
          examples:
          - false
          readOnly: true
          title: Has Router
          type: boolean
        host_routes:
          description: List of custom static routes to advertise via DHCP.
          examples:
          - []
          items:
            $ref: '#/components/schemas/RouteOutSerializer'
          title: Host Routes
          type: array
        id:
          description: Subnet id.
          examples:
          - b39792c3-3160-4356-912e-ba396c95cdcf
          format: uuid4
          title: Id
          type: string
        ip_version:
          $ref: '#/components/schemas/IPVersion'
          description: IP version
          examples:
          - 4
        name:
          description: Subnet name
          examples:
          - subnet_3
          pattern: ^[a-zA-Z0-9][a-zA-Z 0-9._\-]{1,61}[a-zA-Z0-9._]$
          title: Name
          type: string
        network_id:
          description: Network ID
          examples:
          - b30d0de7-bca2-4c83-9c57-9e645bd2cc92
          format: uuid4
          title: Network Id
          type: string
        project_id:
          description: Project ID
          examples:
          - 1337
          title: Project Id
          type: integer
        region:
          description: Region name
          examples:
          - Luxembourg 1
          title: Region
          type: string
        region_id:
          description: Region ID
          examples:
          - 7
          title: Region Id
          type: integer
        tags:
          description: List of key-value tags associated with the resource. A tag is a key-value pair that can be associated with a resource, enabling efficient filtering and grouping for better organization and management. Some tags are read-only and cannot be modified by the user. Tags are also integrated with cost reports, allowing cost data to be filtered based on tag keys or values.
          examples:
          - - key: my-tag
              read_only: false
              value: my-tag-value
          items:
            $ref: '#/components/schemas/TagSerializer'
          title: Tags
          type: array
        task_id:
          anyOf:
          - format: uuid4
            type: string
          - type: 'null'
          description: The UUID of the active task that currently holds a lock on the resource. This lock prevents concurrent modifications to ensure consistency. If `null`, the resource is not locked.
          examples:
          - null
          title: Task Id
        total_ips:
          anyOf:
          - type: integer
          - type: 'null'
          description: Total number of ips in subnet. Null when this data isn't available.
          examples:
          - 253
          title: Total Ips
        updated_at:
          description: Datetime when the subnet was last updated
          examples:
          - 2019-06-13T13:58:12+0000
          format: date-time
          title: Updated At
          type: string
      required:
      - project_id
      - region_id
      - region
      - name
      - id
      - network_id
      - ip_version
      - enable_dhcp
      - cidr
      - creator_task_id
      - task_id
      - available_ips
      - total_ips
      - dns_nameservers
      - host_routes
      - gateway_ip
      - tags
      - created_at
      - updated_at
      - has_router
      title: SubnetSerializer
      type: object
    PatchSubnetSerializer:
      properties:
        dns_nameservers:
          anyOf:
          - items:
              format: ipvanyaddress
              type: string
            type: array
          - type: 'null'
          default: null
          description: List IP addresses of DNS servers to advertise via DHCP.
          examples:
          - - 8.8.4.4
            - 1.1.1.1
          title: Dns Nameservers
        enable_dhcp:
          description: True if DHCP should be enabled
          examples:
          - true
          title: Enable Dhcp
          type: boolean
        gateway_ip:
          anyOf:
          - format: ipvanyaddress
            type: string
          - type: 'null'
          description: Default GW IPv4 address to advertise in DHCP routes in this subnet. Omit this field to let the cloud backend allocate it automatically. Set to null if no gateway must be advertised by this subnet's DHCP (useful when attaching instances to multiple subnets in order to prevent default route conflicts).
          examples:
          - 192.168.10.1
          title: Gateway Ip
        host_routes:
          anyOf:
          - items:
              $ref: '#/components/schemas/RouteInSerializer'
            type: array
          - type: 'null'
          default: null
          description: List of custom static routes to advertise via DHCP.
          examples:
          - - destination: 10.0.3.0/24
              nexthop: 10.0.0.13
          title: Host Routes
        name:
          anyOf:
          - pattern: ^[a-zA-Z0-9][a-zA-Z 0-9._\-]{1,61}[a-zA-Z0-9._]$
            type: string
          - type: 'null'
          default: null
          description: Name
          examples:
          - some_name
          title: Name
        tags:
          anyOf:
          - $ref: '#/components/schemas/UpdateTagsSerializer'
          - type: 'null'
          description: 'Update key-value tags using JSON Merge Patch semantics (RFC 7386). Provide key-value pairs to add or update tags. Set tag values to `null` to remove tags. Unspecified tags remain unchanged. Read-only tags are always preserved and cannot be modified.


            **Examples:**


            * **Add/update tags:** `{''tags'': {''environment'': ''production'', ''team'': ''backend''}}` adds new tags or updates existing ones.


            * **Delete tags:** `{''tags'': {''old_tag'': null}}` removes specific tags.


            * **Remove all tags:** `{''tags'': null}` removes all user-managed tags (read-only tags are preserved).


            * **Partial update:** `{''tags'': {''environment'': ''staging''}}` only updates specified tags.


            * **Mixed operations:** `{''tags'': {''environment'': ''production'', ''cost_center'': ''engineering'', ''deprecated_tag'': null}}` adds/updates ''environment'' and ''cost_center'' while removing ''deprecated_tag'', preserving other existing tags.


            * **Replace all:** first delete existing tags with null values, then add new ones in the same request.'
          examples:
          - my-tag: my-tag-value
            my-tag-to-remove: null
      title: PatchSubnetSerializer
      type: object
    NetworkType:
      enum:
      - vlan
      - vxlan
      title: NetworkType
      type: string
    CreateTagsSerializer:
      description: 'A tag is a key-value pair that can be associated with a resource,

        enabling efficient filtering and grouping for better organization and management.

        Some tags are read-only and cannot be modified by the user.

        Tags are also integrated with cost reports, allowing cost data to be filtered based on tag keys or values.'
      propertyNames:
        description: 'Tag key. Maximum 255 characters. Cannot contain spaces, tabs, newlines, empty string or ''='' character. Trailing or leading whitespaces will be stripped. '
        examples:
        - my-tag
        maxLength: 255
        minLength: 1
        pattern: ^[^\s=]+$
      title: CreateTagsSerializer
      type: object
      additionalProperties:
        description: 'Tag value. Maximum 255 characters. Cannot contain tabs, newlines, or empty strings. Trailing or leading whitespaces will be stripped. '
        examples:
        - my-tag-value
        maxLength: 255
        minLength: 1
        pattern: ^[^ \t\n\r\f\v]([^\t\n\r\f\v]*[^ \t\n\r\f\v])?$
        type: string
    SubnetSerializerList:
      properties:
        count:
          description: Number of objects
          examples:
          - 1
          minimum: 0
          title: Count
          type: integer
        results:
          description: Objects
          items:
            $ref: '#/components/schemas/SubnetSerializer'
          title: Results
          type: array
      required:
      - count
      - results
      title: SubnetSerializerList
      type: object
    UpdateTagsSerializer:
      propertyNames:
        description: 'Tag key. Maximum 255 characters. Cannot contain spaces, tabs, newlines, empty string or ''='' character. Trailing or leading whitespaces will be stripped. '
        examples:
        - my-tag
        maxLength: 255
        minLength: 1
        pattern: ^[^\s=]+$
      title: UpdateTagsSerializer
      type: object
      additionalProperties:
        anyOf:
        - maxLength: 255
          minLength: 1
          pattern: ^[^ \t\n\r\f\v]([^\t\n\r\f\v]*[^ \t\n\r\f\v])?$
          type: string
        - type: 'null'
        description: Tag value. Maximum 255 characters. Cannot contain tabs, newlines, empty string or start/end with whitespace. Trailing or leading whitespaces will be stripped. Set to `null` in order to delete this tag.
        examples:
        - my-tag-value
    PortAndInstanceCollectionSerializer:
      properties:
        count:
          description: Number of objects
          examples:
          - 1
          minimum: 0
          title: Count
          type: integer
        results:
          description: Objects
          items:
            $ref: '#/components/schemas/PortAndInstanceSerializer'
          title: Results
          type: array
      required:
      - count
      - results
      title: PortAndInstanceCollectionSerializer
      type: object
    NetworkSerializer:
      properties:
        created_at:
          description: Datetime when the network was created
          examples:
          - 2019-06-18T11:56:16+0000
          format: date-time
          title: Created At
          type: string
        creator_task_id:
          anyOf:
          - format: uuid4
            type: string
          - type: 'null'
          description: Task that created this entity
          examples:
          - fd50fdd1-0482-4c9b-b847-fc9924665af6
          title: Creator Task Id
        default:
          anyOf:
          - type: boolean
          - type: 'null'
          description: True if network has is_default attribute
          examples:
          - true
          title: Default
        external:
          description: True if the network `router:external` attribute
          examples:
          - true
          title: External
          type: boolean
        id:
          description: Network ID
          examples:
          - eed97610-708d-43a5-a9a5-caebd2b7b4ee
          format: uuid4
          title: Id
          type: string
        mtu:
          description: MTU (maximum transmission unit). Default value is 1450
          examples:
          - 1500
          title: Mtu
          type: integer
        name:
          description: Network name
          examples:
          - public
