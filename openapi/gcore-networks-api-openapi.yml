openapi: 3.2.0
info:
  title: Cloud Networks API
  description: '___brandName___ Cloud API provides an API to manage Cloud resources and services.

    API address is: https://api.___serverHost___/cloud


    # Authentication

    You can find the available authorization methods in this section:

    Authorization methods


    Project ID & Region ID


    Most endpoints require project_id and region_id path parameters.

    List Regions

    and

    List Projects

    to see available projects and regions.'
  version: 14.491.0
servers:
- url: https://api.___serverHost___/cloud
tags:
- name: Networks
paths:
  /v1/networks/{project_id}/{region_id}:
    post:
      operationId: NetworkViewSet.post
      summary: Create network
      description: ''
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      responses:
        '200':
          description: Task IDs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskIDsSerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNetworkSerializer'
      tags:
      - Networks
    get:
      operationId: NetworkViewSet.get
      summary: List networks
      description: 'Returns a list of networks. Use the `owned_by` query parameter to control which networks are returned:

        `project` (default) returns only networks owned by the project,

        `any` returns all networks the project can use, including shared networks.'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      - in: query
        name: external
        required: false
        description: Filter by external network status
        schema:
          description: Filter by external network status
          examples:
          - true
          title: External
          type: boolean
      - in: query
        name: limit
        required: false
        description: Optional. Limit the number of returned items
        schema:
          default: 1000
          description: Optional. Limit the number of returned items
          examples:
          - 1000
          exclusiveMinimum: 0
          maximum: 1000
          title: Limit
          type: integer
      - in: query
        name: name
        required: false
        description: Filter networks by name
        schema:
          description: Filter networks by name
          examples:
          - my-network
          maxLength: 61
          title: Name
          type: string
      - in: query
        name: network_type
        required: false
        description: Filter by network type (vlan or vxlan)
        schema:
          $ref: '#/components/schemas/NetworkType'
          description: Filter by network type (vlan or vxlan)
          examples:
          - vlan
      - in: query
        name: offset
        required: false
        description: Optional. Offset value is used to exclude the first set of records from the result
        schema:
          default: 0
          description: Optional. Offset value is used to exclude the first set of records from the result
          examples:
          - 0
          minimum: 0
          title: Offset
          type: integer
      - in: query
        name: order_by
        required: false
        description: Ordering networks list result by `name`, `created_at` or `priority` fields and directions (e.g. `created_at.desc`). Default is `created_at.desc`. Use `priority.desc` to sort by shared network priority (relevant when `owned_by=any`).
        schema:
          $ref: '#/components/schemas/NetworkListOrderByChoices'
          default: created_at.desc
          description: Ordering networks list result by `name`, `created_at` or `priority` fields and directions (e.g. `created_at.desc`). Default is `created_at.desc`. Use `priority.desc` to sort by shared network priority (relevant when `owned_by=any`).
          examples:
          - created_at.desc
      - in: query
        name: owned_by
        required: false
        description: Controls which networks are returned. 'project' (default) returns only networks owned by the project. 'any' returns all networks that the project can use, including shared networks from other projects.
        schema:
          $ref: '#/components/schemas/NetworkOwnedBy'
          default: project
          description: Controls which networks are returned. 'project' (default) returns only networks owned by the project. 'any' returns all networks that the project can use, including shared networks from other projects.
          examples:
          - project
      - in: query
        name: tag_key
        required: false
        description: Optional. Filter by tag keys. ?tag_key=key1&tag_key=key2
        schema:
          description: Optional. Filter by tag keys. ?tag_key=key1&tag_key=key2
          examples:
          - - key1
            - key2
          items:
            description: 'Tag key. Maximum 255 characters. Cannot contain spaces, tabs, newlines, empty string or ''='' character. Trailing or leading whitespaces will be stripped. '
            examples:
            - my-tag
            maxLength: 255
            minLength: 1
            pattern: ^[^\s=]+$
            type: string
          title: Tag Key
          type: array
      - in: query
        name: tag_key_value
        required: false
        description: Optional. Filter by tag key-value pairs.
        schema:
          contentMediaType: application/json
          contentSchema:
            propertyNames:
              description: 'Tag key. Maximum 255 characters. Cannot contain spaces, tabs, newlines, empty string or ''='' character. Trailing or leading whitespaces will be stripped. '
              examples:
              - my-tag
              maxLength: 255
              minLength: 1
              pattern: ^[^\s=]+$
            type: object
            additionalProperties:
              description: 'Tag value. Maximum 255 characters. Cannot contain tabs, newlines, or empty strings. Trailing or leading whitespaces will be stripped. '
              examples:
              - my-tag-value
              maxLength: 255
              minLength: 1
              pattern: ^[^ \t\n\r\f\v]([^\t\n\r\f\v]*[^ \t\n\r\f\v])?$
              type: string
          description: Optional. Filter by tag key-value pairs.
          examples:
          - key: value
          title: Tag Key Value
          type: string
      responses:
        '200':
          description: Networks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkCollectionSerializer'
      tags:
      - Networks
  /v2/networks/{project_id}/{region_id}/{network_id}:
    patch:
      operationId: NetworkInstanceViewSetV2.patch
      summary: Update network
      description: 'Rename network and/or update network tags in a background task.

        Returns a task ID and uses a network task lock, so concurrent update/delete task creation fails with conflict.

        The request will only process the fields that are provided in the request body.

        Any fields that are not included will remain unchanged.

        If a provided field already matches the current network state it is skipped, and when no field

        changes anything no task is created and an empty task list is returned.'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      - in: path
        name: network_id
        required: true
        description: Network ID
        schema:
          description: Network ID
          examples:
          - b39792c3-3160-4356-912e-ba396c95cdcf
          format: uuid4
          title: Network Id
          type: string
      responses:
        '200':
          description: Task IDs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskIDsSerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchNetworkSerializer'
      tags:
      - Networks
