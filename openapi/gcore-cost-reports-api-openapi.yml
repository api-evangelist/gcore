          type: number
        billing_value_unit:
          const: minutes
          description: Unit of billing value
          examples:
          - minutes
          title: Billing Value Unit
          type: string
        region:
          description: Region ID
          examples:
          - 76
          title: Region
          type: integer
        region_id:
          description: Region ID
          examples:
          - 76
          title: Region Id
          type: integer
        type:
          const: external_ip
          title: Type
          type: string
      required:
      - type
      - billing_value
      - billing_value_unit
      - billing_metric_name
      - region
      - region_id
      title: TotalExternalIpReportItemSerializer
      type: object
    SchemaFilterSnapshotEnum:
      enum:
      - last_name
      - last_size
      - source_volume_uuid
      - type
      - uuid
      - volume_type
      title: SchemaFilterSnapshotEnum
      type: string
    ReservationCostReportTotalsRequestSerializer:
      additionalProperties: false
      examples:
      - regions:
        - 4
        - 5
        response_format: json
        schema_filter:
          field: flavor
          type: instance
          values:
          - g1-standard-1-2
        tags:
          condition_type: OR
          conditions:
          - key: os_version
            strict: true
            value: '22.04'
          - key: os_version
            strict: true
            value: '23.04'
        time_from: 2024-08
        time_to: 2024-08
        types:
        - egress_traffic
        - instance
      properties:
        regions:
          description: List of region IDs.
          examples:
          - - 1
            - 2
            - 3
          items:
            type: integer
          title: Regions
          type: array
        response_format:
          $ref: '#/components/schemas/ReservationCostReportResponseFormat'
          default: json
          description: 'Format of the response (csv_totals or json). '
          examples:
          - csv_totals
          - json
        rounding:
          default: true
          description: Round cost values to 5 decimal places. When false, returns full precision.
          title: Rounding
          type: boolean
        schema_filter:
          description: Extended filter for field filtering.
          discriminator:
