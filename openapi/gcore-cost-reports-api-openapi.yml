              dbaas_postgresql_public_network: '#/components/schemas/SchemaFilterDBAASPostgreSQLPublicNetworkSerializer'
              dbaas_postgresql_volume: '#/components/schemas/SchemaFilterDBAASPostgreSQLVolumeSerializer'
              egress_traffic: '#/components/schemas/SchemaFilterEgressTrafficSerializer'
              external_ip: '#/components/schemas/SchemaFilterExternalIpSerializer'
              file_share: '#/components/schemas/SchemaFilterFileShareSerializer'
              floatingip: '#/components/schemas/SchemaFilterFloatingIpSerializer'
              functions: '#/components/schemas/SchemaFilterFunctionsSerializer'
              functions_calls: '#/components/schemas/SchemaFilterFunctionsCallsSerializer'
              functions_traffic: '#/components/schemas/SchemaFilterFunctionsTrafficSerializer'
              image: '#/components/schemas/SchemaFilterImageSerializer'
              inference: '#/components/schemas/SchemaFilterInferenceSerializer'
              instance: '#/components/schemas/SchemaFilterInstanceSerializer'
