openapi: 3.2.0
info:
  title: Cloud Cost Reports API
  description: '___brandName___ Cloud API provides an API to manage Cloud resources and services.

    API address is: https://api.___serverHost___/cloud


    # Authentication

    You can find the available authorization methods in this section:

    Authorization methods


    Project ID & Region ID


    Most endpoints require project_id and region_id path parameters.

    List Regions

    and

    List Projects

    to see available projects and regions.'
  version: 14.491.0
servers:
- url: https://api.___serverHost___/cloud
tags:
- name: Cost Reports
paths:
  /v2/cost_report/breakdown:
    post:
      operationId: CostReportBreakdownHandler.post
      summary: Get daily cost breakdown (pay-as-you-go only)
      description: 'Get daily costs for a given period, summed down to one dimension: region (default),

        project, resource type or flavor. Requested period should not exceed 31 days.

        Costs and usages are returned at full precision.


        The response can have more than one row for one day and one `group_by` value (for example, one region

        on one day). Usage with a different unit (`usage.unit`, for example `minutes` or `bytes`) is in a

        different row. Usage without a price (`error` is not null) is also in a different row.


        Note: This report assumes there are no active commit features in the billing plan.

        If there are active commit features (pre-paid resources) in your plan, use /v1/reservation_cost_report/totals,

        as the results from this report will not be accurate.


        Data from the past hour may not reflect the full set of statistics.

        For the most complete and accurate results, we recommend accessing the data at least one hour after the

        relevant time period. Updates are generally available within a 24-hour window, though timing can vary.

        Scheduled maintenance or other exceptions may occasionally cause delays beyond 24 hours.'
      parameters: []
      responses:
        '200':
          description: Daily cost breakdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostReportBreakdownResponseSerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CostReportBreakdownRequestSerializer'
      tags:
      - Cost Reports
  /v2/cost_report/resources:
    post:
      operationId: CostReportResourcesV2Handler.post
      summary: Get cost report resources sorted by cost (pay-as-you-go only)
      description: 'Get a detailed cost report for a given period and specific resources, sorted by cost by default.

        Requested period should not exceed 31 days. Costs and usages are always returned at full precision.


        Note: This report assumes there are no active commit features in the billing plan.

        If there are active commit features (pre-paid resources) in your plan, use /v1/reservation_cost_report/totals,

        as the results from this report will not be accurate.


        Data from the past hour may not reflect the full set of statistics.

        For the most complete and accurate results, we recommend accessing the data at least one hour after the

        relevant time period. Updates are generally available within a 24-hour window, though timing can vary.

        Scheduled maintenance or other exceptions may occasionally cause delays beyond 24 hours.'
      parameters: []
      responses:
        '200':
          description: Cost report resources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostReportResourcesV2ResponseSerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CostReportResourcesV2RequestSerializer'
      tags:
      - Cost Reports
  /v1/reservation_cost_report/totals:
    post:
      operationId: ReservationCostReportTotalsHandler.post
      summary: Get monthly cost report totals (commits and pay-as-you-go)
      description: 'Retrieve a detailed cost report totals for a specified month, which includes

        both commit and pay-as-you-go (overcommit) prices.

        Additionally, it provides the spent billing units (e.g., hours or GB) for resources.

        The "time_to" parameter represents all days in the specified month.


        Data from the past hour may not reflect the full set of statistics.

        For the most complete and accurate results, we recommend accessing the data at least one hour after the

        relevant time period. Updates are generally available within a 24-hour window, though timing can vary.

        Scheduled maintenance or other exceptions may occasionally cause delays beyond 24 hours.'
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationCostReportTotalsResponseSerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationCostReportTotalsRequestSerializer'
      tags:
      - Cost Reports
  /v1/usage_report:
    post:
      operationId: UsageReportHandler.post
      summary: Get usage statistics report
      description: 'Data from the past hour may not reflect the full set of statistics.

        For the most complete and accurate results, we recommend accessing the data at least one hour after the

        relevant time period. Updates are generally available within a 24-hour window, though timing can vary.

        Scheduled maintenance or other exceptions may occasionally cause delays beyond 24 hours.'
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageReportResponseSerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsageReportRequestSerializer'
      tags:
      - Cost Reports
  /v1/cost_report/resources:
    post:
      operationId: CostReportResourcesHandler.post
      summary: Get cost report resources (pay-as-you-go only)
      description: '**Deprecated** Use `/v2/cost_report/resources` instead.


        Get a detailed cost report for a given period and specific resources.

        Requested period should not exceed 31 days.


        Note: This report assumes there are no active commit features in the billing plan.

        If there are active commit features (pre-paid resources) in your plan, use /v1/reservation_cost_report/totals,

        as the results from this report will not be accurate.


        Data from the past hour may not reflect the full set of statistics.

        For the most complete and accurate results, we recommend accessing the data at least one hour after the

        relevant time period. Updates are generally available within a 24-hour window, though timing can vary.

        Scheduled maintenance or other exceptions may occasionally cause delays beyond 24 hours.'
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostReportResourcesResponseSerializer'
      deprecated: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CostReportResourcesRequestSerializer'
      tags:
      - Cost Reports
  /v1/cost_report/totals:
    post:
      operationId: CostReportTotalsHandler.post
      summary: Get cost report totals (pay-as-you-go only)
      description: '**Deprecated** Use `/v2/cost_report/breakdown` instead.


        The v2 report is different from this report:


        - This report returns one row for each billing metric and region for the full period. The v2 report

        returns one row for each day and one `group_by` value.

        - The v2 report moves `billing_value`, `billing_value_unit`, `cost` and `currency` to `usage.value`,

        `usage.unit`, `usage.cost` and `usage.currency`. The `err` field is `error`.

        - The v2 `flavor` field also contains the `volume_type`, `file_share_type` and `instance_type` values.

        - The v2 report has no `billing_metric_name` and `billing_feature_name` fields.

        - The v2 request uses `region_ids` and `project_ids`. It has no `schema_filter` and `rounding` fields.


        Get cost report totals (aggregated costs) for a given period. Requested period should not exceed 31 days.


        Note: This report assumes there are no active commit features in the billing plan.

        If there are active commit features (pre-paid resources) in your plan, use /v1/reservation_cost_report/totals,

        as the results from this report will not be accurate.


        Data from the past hour may not reflect the full set of statistics.

        For the most complete and accurate results, we recommend accessing the data at least one hour after the

        relevant time period. Updates are generally available within a 24-hour window, though timing can vary.

        Scheduled maintenance or other exceptions may occasionally cause delays beyond 24 hours.'
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostReportTotalsResponseSerializer'
      deprecated: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CostReportTotalsRequestSerializer'
      tags:
      - Cost Reports
