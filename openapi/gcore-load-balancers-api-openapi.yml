          description: Administrative state of the resource. When set to true, the resource is enabled and operational. When set to false, the resource is disabled and will not process traffic. Defaults to true.
          examples:
          - true
          - false
          title: Admin State Up
          type: boolean
        delay:
          description: The time, in seconds, between sending probes to members
          examples:
          - 10
          maximum: 2147483647
          minimum: 1
          title: Delay
          type: integer
        domain_name:
          anyOf:
          - pattern: ^[A-Za-z0-9._-]{1,253}$
            type: string
          - type: 'null'
          default: null
          description: Domain name for HTTP host header. Can only be used together with `HTTP` or `HTTPS` health monitor type.
          examples:
          - example.com
          title: Domain Name
        expected_codes:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Expected HTTP response codes. Can be a single code, a comma-separated list of codes, or a single range of codes. Can only be used together with `HTTP` or `HTTPS` health monitor type. For example, 200, 200,202,401,403,404, or 200-204. If not specified, the default is 200.
          examples:
          - 200,301,302
          title: Expected Codes
        http_method:
          anyOf:
          - $ref: '#/components/schemas/HttpMethodEnum'
          - type: 'null'
          default: null
          description: HTTP method. Can only be used together with `HTTP` or `HTTPS` health monitor type.
          examples:
          - CONNECT
          - DELETE
          - GET
          - HEAD
          - OPTIONS
          - PATCH
          - POST
          - PUT
          - TRACE
        http_version:
          anyOf:
          - enum:
            - '1.0'
            - '1.1'
            type: string
          - type: 'null'
          default: null
          description: 'HTTP version. Can only be used together with `HTTP` or `HTTPS` health monitor type. Supported values: 1.0, 1.1.'
          examples:
          - '1.1'
          - '1.0'
          title: Http Version
        max_retries:
          description: Number of successes before the member is switched to ONLINE state
          examples:
          - 2
          maximum: 10
          minimum: 1
          title: Max Retries
          type: integer
        max_retries_down:
          default: 3
          description: 'Number of failures before the member is switched to ERROR state. '
          examples:
          - 2
          maximum: 10
          minimum: 1
          title: Max Retries Down
          type: integer
        timeout:
          description: The maximum time to connect. Must be less than the delay value
          examples:
          - 5
          maximum: 2147483
          minimum: 0
          title: Timeout
          type: integer
        type:
          $ref: '#/components/schemas/HealthMonitorTypeEnum'
          description: Health monitor type. Once health monitor is created, cannot be changed.
          examples:
          - HTTP
          - HTTPS
          - PING
          - TCP
          - TLS_HELLO
          - UDP_CONNECT
          - K8S
        url_path:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: 'The HTTP path the health monitor requests on each member. Defaults to `/` if not set. Can only be used with `HTTP` or `HTTPS` health monitor type.


            Must start with `/` and contain only plain path segments. Query strings (`?`), fragments (`#`), percent-encoding (`%`), and consecutive slashes (`//`) are not allowed.


            Examples of valid paths:

            * `/` — check the root (most common, default)

            * `/healthz` — a dedicated health endpoint'
          examples:
          - /
          - /healthz
          title: Url Path
