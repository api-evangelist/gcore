components:
  schemas:
    LoadBalancerPricingPreviewV2RequestSerializer:
      description: Price preview loadbalancer schema
      examples:
      - flavor: lb1-1-2
        floating_ip:
          existing_floating_id: c64e5db1-5f1f-43ec-a8d9-5090df85b82d
          source: existing
      properties:
        flavor:
          description: Load balancer flavor name
          examples:
          - lb1-1-2
          title: Flavor
          type: string
        floating_ip:
          description: Allows the instance to have a public IP that can be reached from the internet.
          discriminator:
            mapping:
              existing: '#/components/schemas/ExistingInstanceFloatingIpInterfaceSerializer'
              new: '#/components/schemas/NewInstanceFloatingIpInterfaceSerializer'
            propertyName: source
          oneOf:
          - $ref: '#/components/schemas/NewInstanceFloatingIpInterfaceSerializer'
          - $ref: '#/components/schemas/ExistingInstanceFloatingIpInterfaceSerializer'
          title: Floating Ip
        vip_ip_family:
          anyOf:
          - $ref: '#/components/schemas/InterfaceIPFamily'
          - type: 'null'
          default: null
          description: 'Which subnet should be selected if not specified: IPv4, IPv6 or use dual stack.'
          examples:
          - ipv4
        vip_network_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Network ID for load balancer. If not specified, default external network will be used. Mutually exclusive with vip_port_id
          examples:
          - ddc28e44-2acb-499b-985b-831f29432e1c
          title: Vip Network Id
        vip_port_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Existing Reserved Fixed IP port ID for load balancer. Mutually exclusive with vip_network_id
          examples:
          - 57be69f6-6f6a-4f03-a4ad-8eb86c69ec0a
          title: Vip Port Id
        vip_subnet_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Subnet ID for load balancer. If not specified, any subnet from vip_network_id will be selected. Ignored when vip_network_id is not specified.
          examples:
          - 2731a56e-a5c9-44be-80c2-02c57c594573
          title: Vip Subnet Id
      required:
      - flavor
      title: LoadBalancerPricingPreviewV2RequestSerializer
      type: object
