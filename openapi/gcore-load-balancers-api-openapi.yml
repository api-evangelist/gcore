    PatchLbHealthMonitorSerializerV2:
      properties:
        admin_state_up:
          description: Administrative state of the resource. Omit to leave unchanged; `false` disables the resource so it will not process traffic.
          examples:
          - true
          - false
          title: Admin State Up
          type: boolean
        delay:
          description: The time, in seconds, between sending probes to members. Omit to leave unchanged.
          examples:
          - 10
          maximum: 2147483647
          minimum: 1
          title: Delay
          type: integer
        domain_name:
          anyOf:
          - pattern: ^[A-Za-z0-9._-]{1,253}$
            type: string
          - type: 'null'
          description: Domain name for HTTP host header. Can only be used together with `HTTP` or `HTTPS` health monitor type. Omit to leave unchanged. Set to `null` to clear the current value.
          examples:
          - example.com
          title: Domain Name
        expected_codes:
          anyOf:
          - pattern: ^(\d{3}(\s*,\s*\d{3})*)$|^(\d{3}-\d{3})$
            type: string
          - type: 'null'
          description: Expected HTTP response codes. Can be a single code, a comma-separated list of codes, or a single range of codes. Can only be used together with `HTTP` or `HTTPS` health monitor type. For example, 200, 200,202,401,403,404, or 200-204. Omit to leave unchanged. Set to `null` to clear the current value.
          examples:
          - 200,301,302
          title: Expected Codes
        http_method:
          anyOf:
          - $ref: '#/components/schemas/HttpMethodEnum'
          - type: 'null'
          description: HTTP method. Can only be used together with `HTTP` or `HTTPS` health monitor type. Omit to leave unchanged. Set to `null` to clear the current value.
          examples:
          - CONNECT
          - DELETE
          - GET
          - HEAD
          - OPTIONS
          - PATCH
          - POST
          - PUT
          - TRACE
        http_version:
          anyOf:
          - enum:
            - '1.0'
            - '1.1'
            type: string
          - type: 'null'
          description: 'HTTP version. Can only be used together with `HTTP` or `HTTPS` health monitor type. Supported values: 1.0, 1.1. Omit to leave unchanged. Set to `null` to clear the current value.'
          examples:
          - '1.1'
          - '1.0'
          title: Http Version
        max_retries:
          description: Number of successes before the member is switched to ONLINE state. Omit to leave unchanged.
          examples:
          - 2
          maximum: 10
          minimum: 1
          title: Max Retries
          type: integer
        max_retries_down:
          description: Number of failures before the member is switched to ERROR state. Omit to leave unchanged.
          examples:
          - 2
          maximum: 10
          minimum: 1
          title: Max Retries Down
          type: integer
        timeout:
          description: The maximum time to connect. Must be less than the delay value. Omit to leave unchanged.
          examples:
          - 5
          maximum: 2147483
          minimum: 0
          title: Timeout
          type: integer
        url_path:
          anyOf:
          - pattern: ^/([^/?#%]+(/[^/?#%]+)*/?)?$
            type: string
          - type: 'null'
          description: 'The HTTP path the health monitor requests on each member. Can only be used with `HTTP` or `HTTPS` health monitor type.


            Must start with `/` and contain only plain path segments. Query strings (`?`), fragments (`#`), percent-encoding (`%`), and consecutive slashes (`//`) are not allowed.


            Examples of valid paths:

            * `/` — check the root (most common)

            * `/healthz` — a dedicated health endpoint


            Omit to leave unchanged. Set to `null` to clear the current value.'
          examples:
          - /
          - /healthz
          title: Url Path
      title: PatchLbHealthMonitorSerializerV2
      type: object
