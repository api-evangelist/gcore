    PatchLbPoolMemberSerializer:
      properties:
        admin_state_up:
          description: Administrative state of the member. Omit to leave unchanged; `false` disables the member so it receives no traffic.
          examples:
          - true
          - false
          title: Admin State Up
          type: boolean
        backup:
          description: Set to true if the member is a backup member, to which traffic will be sent exclusively when all non-backup members will be unreachable. Omit to leave unchanged.
          examples:
          - true
          - false
          title: Backup
          type: boolean
        monitor_address:
          anyOf:
          - format: ipvanyaddress
            type: string
          - type: 'null'
          description: Alternate IP address used for health monitoring of a backend member. Set to `null` to clear it and fall back to the member address; omit to leave unchanged.
          title: Monitor Address
        monitor_port:
          anyOf:
          - maximum: 65535
            minimum: 1
            type: integer
          - type: 'null'
          description: Alternate protocol port used for health monitoring of a backend member. Set to `null` to clear it and fall back to the member `protocol_port`; omit to leave unchanged.
          title: Monitor Port
        weight:
          description: "Member weight. Valid values are 0 < `weight` <= 256. Omit to leave unchanged. Controls traffic distribution based on the pool's load balancing algorithm:\n  * `ROUND_ROBIN`: Distributes connections to each member in turn according to weights. Higher weight = more turns in the cycle. Example: weights 3 vs 1 = ~75% vs ~25% of requests.\n  * `LEAST_CONNECTIONS`: Sends new connections to the member with fewest active connections, performing round-robin within groups of the same normalized load. Higher weight = allowed to hold more simultaneous connections before being considered 'more loaded'. Example: weights 2 vs 1 means 20 vs 10 active connections is treated as balanced.\n  * `SOURCE_IP`: Routes clients consistently to the same member by hashing client source IP; hash result is modulo total weight of running members. Higher weight = more hash buckets, so more client IPs map to that member. Example: weights 2 vs 1 = roughly two-thirds of distinct client IPs map to the higher-weight member."
          examples:
          - 1
          exclusiveMinimum: 0
