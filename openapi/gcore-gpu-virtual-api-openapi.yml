openapi: 3.2.0
info:
  title: Cloud GPU Virtual API
  description: '___brandName___ Cloud API provides an API to manage Cloud resources and services.

    API address is: https://api.___serverHost___/cloud


    # Authentication

    You can find the available authorization methods in this section:

    Authorization methods


    Project ID & Region ID


    Most endpoints require project_id and region_id path parameters.

    List Regions

    and

    List Projects

    to see available projects and regions.'
  version: 14.491.0
servers:
- url: https://api.___serverHost___/cloud
tags:
- name: GPU Virtual
paths:
  /v3/gpu/virtual/{project_id}/{region_id}/check_limits:
    post:
      operationId: CheckVirtualGpuLimits.post
      summary: Check virtual GPU cluster quota
      description: 'Check if regional quota is exceeded for virtual GPU cluster creation.

        If exceeded, calculate additional quotas needed.'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 7
          title: Region Id
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualGpuRequiredQuotaSerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckQuotaBeforeVirtualGpuClusterCreationSerializer'
      tags:
      - GPU Virtual
  /v3/gpu/virtual/{project_id}/{region_id}/clusters:
    post:
      operationId: VirtualClusterCollection.post
      summary: Create virtual GPU cluster
      description: Create a new virtual GPU cluster with the specified configuration.
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 7
          title: Region Id
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskIDsSerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterCreateSerializer'
      tags:
      - GPU Virtual
    get:
      operationId: VirtualClusterCollection.get
      summary: List virtual GPU clusters
      description: List all virtual GPU clusters in the specified project and region.
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 7
          title: Region Id
          type: integer
      - in: query
        name: created_at
        required: false
        description: Filter by creation time (UTC), e.g. `created_at[gte]=2026-01-01T00:00:00Z`.
        schema:
          $ref: '#/components/schemas/DateTimeRangeFilter'
          description: Filter by creation time (UTC), e.g. `created_at[gte]=2026-01-01T00:00:00Z`.
        style: deepObject
        explode: true
      - in: query
        name: flavor
        required: false
        description: Filter by flavor (case-insensitive), e.g. `flavor[prefix]=g3-`, `flavor[exact]=g3-ai-32-192-1500-l40s-48-1`.
        schema:
          $ref: '#/components/schemas/StringFilter'
          description: Filter by flavor (case-insensitive), e.g. `flavor[prefix]=g3-`, `flavor[exact]=g3-ai-32-192-1500-l40s-48-1`.
        style: deepObject
        explode: true
      - in: query
        name: ids
        required: false
        description: Return only clusters with these IDs, e.g. `ids=<id1>&ids=<id2>`.
        schema:
          description: Return only clusters with these IDs, e.g. `ids=<id1>&ids=<id2>`.
          examples:
          - - 1aaaab48-10d0-46d9-80cc-85209284ceb4
          items:
            format: uuid4
            type: string
          title: Ids
          type: array
      - in: query
        name: limit
        required: false
        description: Limit of items on a single page
        schema:
          default: 10
          description: Limit of items on a single page
          examples:
          - 10
          exclusiveMinimum: 0
          maximum: 1000
          title: Limit
          type: integer
      - in: query
        name: managed_by
        required: false
        description: 'Filter by who manages the cluster: `user` (default) or `k8s` (Managed Kubernetes). Pass both to include all, e.g. `managed_by=user&managed_by=k8s`.'
        schema:
          default:
          - user
          description: 'Filter by who manages the cluster: `user` (default) or `k8s` (Managed Kubernetes). Pass both to include all, e.g. `managed_by=user&managed_by=k8s`.'
          examples:
          - - user
          items:
            $ref: '#/components/schemas/ClusterManagedBy'
          title: Managed By
          type: array
      - in: query
        name: name
        required: false
        description: Filter by name (case-insensitive), e.g. `name[contains]=gpu`, `name[prefix]=prod-`.
        schema:
          $ref: '#/components/schemas/StringFilter'
          description: Filter by name (case-insensitive), e.g. `name[contains]=gpu`, `name[prefix]=prod-`.
        style: deepObject
        explode: true
      - in: query
        name: offset
        required: false
        description: Offset in results list
        schema:
          default: 0
          description: Offset in results list
          examples:
          - 0
          minimum: 0
          title: Offset
          type: integer
      - in: query
        name: servers_count
        required: false
        description: Filter by node count, e.g. `servers_count[gte]=2`, `servers_count[gte]=2&servers_count[lt]=8`.
        schema:
          $ref: '#/components/schemas/IntRangeFilter'
          description: Filter by node count, e.g. `servers_count[gte]=2`, `servers_count[gte]=2&servers_count[lt]=8`.
        style: deepObject
        explode: true
      - in: query
        name: tag_key
        required: false
        description: Filter by tag key regardless of value, e.g. `tag_key[contains]=team`.
        schema:
          $ref: '#/components/schemas/StringFilter'
          description: Filter by tag key regardless of value, e.g. `tag_key[contains]=team`.
        style: deepObject
        explode: true
      - in: query
        name: tag_value
        required: false
        description: Filter by tag value regardless of key, e.g. `tag_value[prefix]=prod`.
        schema:
          $ref: '#/components/schemas/StringFilter'
          description: Filter by tag value regardless of key, e.g. `tag_value[prefix]=prod`.
        style: deepObject
        explode: true
      - in: query
        name: tags
        required: false
        description: Filter by exact tag key-value pairs, e.g. `tags[env]=prod&tags[team]=core`. Repeat a key to match any of several values for it, e.g. `tags[env]=prod&tags[env]=dev`. Values for one key are ORed, different keys are ANDed; values match case-insensitively.
        schema:
          $ref: '#/components/schemas/TagFilter'
          description: Filter by exact tag key-value pairs, e.g. `tags[env]=prod&tags[team]=core`. Repeat a key to match any of several values for it, e.g. `tags[env]=prod&tags[env]=dev`. Values for one key are ORed, different keys are ANDed; values match case-insensitively.
          examples:
          - env:
            - prod
        style: deepObject
        explode: true
      - in: query
        name: updated_at
        required: false
        description: Filter by last-change time (UTC), e.g. `updated_at[gte]=2026-06-01T00:00:00Z`.
        schema:
          $ref: '#/components/schemas/DateTimeRangeFilter'
          description: Filter by last-change time (UTC), e.g. `updated_at[gte]=2026-06-01T00:00:00Z`.
        style: deepObject
        explode: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualClusterListSerializer'
      tags:
      - GPU Virtual
  /v3/gpu/virtual/{project_id}/{region_id}/clusters/{cluster_id}:
    get:
      operationId: VirtualClusterInstance.get
      summary: Get virtual GPU cluster
      description: Get detailed information about a specific virtual GPU cluster.
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 7
          title: Region Id
          type: integer
      - in: path
        name: cluster_id
        required: true
        description: Cluster unique identifier
        schema:
          description: Cluster unique identifier
          examples:
          - 1aaaab48-10d0-46d9-80cc-85209284ceb4
          format: uuid4
          title: Cluster Id
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualClusterSerializer'
      tags:
      - GPU Virtual
    patch:
      operationId: VirtualClusterInstance.patch
      summary: Update virtual GPU cluster
      description: 'Update the name, tags, and/or server settings of an existing virtual GPU cluster.


        Update tags using JSON Merge Patch semantics (RFC 7396).

        To add or update tags, provide key-value pairs.

        To remove a tag, set its value to null.


        Updating server settings (servers_settings) only modifies the cluster template.

        **It does NOT modify or rebuild any existing servers in the cluster.**'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 7
          title: Region Id
          type: integer
      - in: path
        name: cluster_id
        required: true
        description: Cluster unique identifier
        schema:
          description: Cluster unique identifier
          examples:
          - 1aaaab48-10d0-46d9-80cc-85209284ceb4
          format: uuid4
          title: Cluster Id
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualClusterSerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClusterSerializer'
      tags:
      - GPU Virtual
    delete:
      operationId: VirtualClusterInstance.delete
      summary: Delete virtual GPU cluster
      description: Delete a virtual GPU cluster and all its associated resources.
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 7
          title: Region Id
          type: integer
      - in: path
        name: cluster_id
        required: true
        description: Cluster unique identifier
        schema:
          description: Cluster unique identifier
          examples:
          - 1aaaab48-10d0-46d9-80cc-85209284ceb4
          format: uuid4
          title: Cluster Id
          type: string
      - in: query
        name: all_floating_ips
        required: false
        description: Flag indicating whether the floating ips associated with server / cluster are deleted
        schema:
          default: false
          description: Flag indicating whether the floating ips associated with server / cluster are deleted
          examples:
          - true
          title: All Floating Ips
          type: boolean
      - in: query
        name: all_reserved_fixed_ips
        required: false
        description: Flag indicating whether the reserved fixed ips associated with server / cluster are deleted
        schema:
          default: false
          description: Flag indicating whether the reserved fixed ips associated with server / cluster are deleted
          examples:
          - true
          title: All Reserved Fixed Ips
          type: boolean
      - in: query
        name: all_volumes
        required: false
        description: Flag indicating whether all attached volumes are deleted
        schema:
          default: false
          description: Flag indicating whether all attached volumes are deleted
          examples:
          - true
          title: All Volumes
          type: boolean
      - in: query
        name: floating_ip_ids
        required: false
        description: Optional list of floating ips to be deleted
        schema:
          description: Optional list of floating ips to be deleted
          examples:
          - - e4a01208-d6ac-4304-bf86-3028154b070a
          items:
            format: uuid4
            type: string
          title: Floating Ip Ids
          type: array
      - in: query
        name: reserved_fixed_ip_ids
        required: false
        description: Optional list of reserved fixed ips to be deleted
        schema:
          description: Optional list of reserved fixed ips to be deleted
          examples:
          - - a29b8e1e-08d3-4cec-91fb-06e81e5f46d5
          items:
            format: uuid4
            type: string
          title: Reserved Fixed Ip Ids
          type: array
      - in: query
        name: volume_ids
        required: false
        description: Optional list of volumes to be deleted
        schema:
          description: Optional list of volumes to be deleted
          examples:
          - - 1333c684-c3da-4b91-ac9e-a92706aa2824
          items:
            format: uuid4
            type: string
          title: Volume Ids
          type: array
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskIDsSerializer'
      tags:
      - GPU Virtual
