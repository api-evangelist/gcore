components:
  schemas:
    InstanceStatusQuery:
      enum:
      - ACTIVE
      - BUILD
      - ERROR
      - HARD_REBOOT
      - MIGRATING
      - PAUSED
      - REBOOT
      - REBUILD
      - RESIZE
      - REVERT_RESIZE
      - SHELVED
      - SHELVED_OFFLOADED
      - SHUTOFF
      - SOFT_DELETED
      - SUSPENDED
      - VERIFY_RESIZE
      title: InstanceStatusQuery
      type: string
    VirtualGpuServerSettingsQuotaSerializer:
      properties:
        interfaces:
          description: List of interfaces
          items:
            discriminator:
              mapping:
                any_subnet: '#/components/schemas/AnySubnetInterfaceInputSerializer'
                external: '#/components/schemas/ExternalInterfaceInputSerializer'
                subnet: '#/components/schemas/SubnetInterfaceInputSerializer'
              propertyName: type
            oneOf:
            - $ref: '#/components/schemas/ExternalInterfaceInputSerializer'
            - $ref: '#/components/schemas/SubnetInterfaceInputSerializer'
            - $ref: '#/components/schemas/AnySubnetInterfaceInputSerializer'
          title: Interfaces
          type: array
        volumes:
          description: List of volumes
          items:
            discriminator:
              mapping:
                image: '#/components/schemas/CreateVirtualGpuClusterImageVolumeCheckLimitsSerializer'
                new: '#/components/schemas/CreateVirtualGpuClusterNewVolumeCheckLimitsSerializer'
              propertyName: source
            oneOf:
            - $ref: '#/components/schemas/CreateVirtualGpuClusterNewVolumeCheckLimitsSerializer'
            - $ref: '#/components/schemas/CreateVirtualGpuClusterImageVolumeCheckLimitsSerializer'
          title: Volumes
          type: array
      title: VirtualGpuServerSettingsQuotaSerializer
      type: object
    TaskIDsSerializer:
      properties:
        tasks:
          description: "List of task IDs representing asynchronous operations. Use these IDs to monitor operation progress:\n  * `GET /v1/tasks/{task_id}` - Check individual task status and details\n  Poll task status until completion (`FINISHED`/`ERROR`) before proceeding with dependent operations."
          examples:
          - - d478ae29-dedc-4869-82f0-96104425f565
          items:
            type: string
          title: Tasks
          type: array
      required:
      - tasks
      title: TaskIDsSerializer
      type: object
    GroupSecurityGroupSerializer:
      properties:
        id:
          description: Security group ID
          examples:
          - ae74714c-c380-48b4-87f8-758d656cdad6
          title: Id
          type: string
        name:
          description: Security group name
          examples:
          - default
          title: Name
          type: string
      required:
      - id
      - name
      title: GroupSecurityGroupSerializer
      type: object
    ImageVolumeInputSerializer:
      properties:
        boot_index:
          description: Boot index of the volume
          examples:
          - 1
          minimum: 0
          title: Boot Index
          type: integer
        delete_on_termination:
          default: false
          description: Flag indicating whether the volume is deleted on instance termination
          examples:
          - true
          title: Delete On Termination
          type: boolean
        image_id:
          description: Image ID for the volume
          examples:
          - 3793c250-0b3b-4678-bab3-e11afbc29657
          format: uuid4
          title: Image Id
          type: string
        name:
          description: Volume name
          examples:
          - my-data-disk
          pattern: ^[a-zA-Z0-9][a-zA-Z 0-9._\-]{1,61}[a-zA-Z0-9._]$
          title: Name
          type: string
        size:
          description: Volume size in GiB
          examples:
          - 100
          exclusiveMaximum: 102400
          exclusiveMinimum: 0
          title: Size
          type: integer
        source:
          const: image
          title: Source
          type: string
        tags:
          additionalProperties:
            type: string
          description: Tags associated with the volume
          examples:
          - key1: value1
          title: Tags
          type: object
        type:
          $ref: '#/components/schemas/AllVolumeTypeEnum'
          description: Volume type
          examples:
          - ssd
      required:
      - size
      - type
      - name
      - boot_index
      - source
      - image_id
      title: ImageVolumeInputSerializer
      type: object
    SubnetDetailsSerializer:
      properties:
        available_ips:
          anyOf:
          - type: integer
          - type: 'null'
          description: Number of available ips in subnet
          examples:
          - 250
          title: Available Ips
        cidr:
          description: CIDR
          examples:
          - 192.168.13.0/24
          format: ipvanynetwork
          title: Cidr
          type: string
        created_at:
          description: Datetime when the subnet was created
          examples:
          - '2025-04-04T13:55:31Z'
          format: date-time
          title: Created At
          type: string
        dns_nameservers:
          anyOf:
          - items:
              format: ipvanyaddress
              type: string
            type: array
          - type: 'null'
          description: List IP addresses of a DNS resolver reachable from the network
          examples:
          - - 8.8.8.8
            - 8.8.4.4
          title: Dns Nameservers
        enable_dhcp:
          description: Indicates whether DHCP is enabled for this subnet. If true, IP addresses will be assigned automatically
          examples:
          - true
          title: Enable Dhcp
          type: boolean
        gateway_ip:
          anyOf:
          - format: ipvanyaddress
            type: string
          - type: 'null'
          description: Default GW IPv4 address, advertised in DHCP routes of this subnet. If null, no gateway is advertised by this subnet.
          examples:
          - 192.168.13.1
          title: Gateway Ip
        has_router:
          deprecated: true
          description: Deprecated. Always returns `false`.
          examples:
          - false
          title: Has Router
          type: boolean
        host_routes:
          anyOf:
          - items:
              $ref: '#/components/schemas/RouteOutSerializer'
            type: array
          - type: 'null'
          description: List of custom static routes to advertise via DHCP.
          examples:
          - []
          title: Host Routes
        id:
          description: Subnet id.
          examples:
          - b39792c3-3160-4356-912e-ba396c95cdcf
          format: uuid4
          title: Id
          type: string
        ip_version:
          $ref: '#/components/schemas/IPVersion'
          description: IP version used by the subnet (IPv4 or IPv6)
          examples:
          - 4
        name:
          description: Subnet name
          examples:
          - subnet_3
          pattern: ^[a-zA-Z0-9][a-zA-Z 0-9._\-]{1,61}[a-zA-Z0-9._]$
          title: Name
          type: string
        network_id:
          description: Network ID
          examples:
          - b30d0de7-bca2-4c83-9c57-9e645bd2cc92
          format: uuid4
          title: Network Id
          type: string
        tags:
          description: List of key-value tags associated with the resource. A tag is a key-value pair that can be associated with a resource, enabling efficient filtering and grouping for better organization and management. Some tags are read-only and cannot be modified by the user. Tags are also integrated with cost reports, allowing cost data to be filtered based on tag keys or values.
          examples:
          - - key: my-tag
              read_only: false
              value: my-tag-value
          items:
            $ref: '#/components/schemas/TagSerializer'
          title: Tags
          type: array
        total_ips:
          anyOf:
          - type: integer
          - type: 'null'
          description: Total number of ips in subnet
          examples:
          - 253
          title: Total Ips
        updated_at:
          description: Datetime when the subnet was last updated
          examples:
          - '2025-04-04T13:56:31Z'
          format: date-time
          title: Updated At
          type: string
      required:
      - name
      - id
      - network_id
      - ip_version
      - enable_dhcp
      - cidr
      - available_ips
      - total_ips
      - has_router
      - dns_nameservers
      - host_routes
      - gateway_ip
      - tags
      - created_at
      - updated_at
      title: SubnetDetailsSerializer
      type: object
    AnySubnetInterfaceInputSerializer:
      properties:
        floating_ip:
          $ref: '#/components/schemas/NewFloatingIpInterfaceSerializer'
          description: Floating IP config for this subnet attachment
        ip_family:
          default: ipv4
          description: 'Which subnets should be selected: IPv4, IPv6, or use dual stack'
          enum:
          - dual
          - ipv4
          - ipv6
          examples:
          - ipv4
          title: Ip Family
          type: string
        name:
          description: Interface name
          maxLength: 37
          title: Name
          type: string
        network_id:
          description: Network ID the subnet belongs to. Port will be plugged in this network
          examples:
          - 59905c8e-2619-420a-b046-536096473370
          format: uuid4
          title: Network Id
          type: string
        port_security_enabled:
          description: Controls port security for this interface. When omitted, the default applies (port security enabled, default security group attached). When false, the port is created with port security off and no security group attached; `security_groups` must not be set in that case. Not allowed for interfaces on a public network, nor for bare metal servers without a DPU (their ports cannot enforce port security).
          examples:
          - true
          title: Port Security Enabled
          type: boolean
        security_groups:
          description: Security group UUIDs applied to this interface. If omitted (or empty), the top-level `security_groups` value applies; if both are omitted, the project's default security group is applied.
          examples:
          - - id: b4849ffa-89f2-45a1-951f-0ae5b7809d98
          items:
            $ref: '#/components/schemas/MandatoryIdSerializerPydantic'
          title: Security Groups
          type: array
        type:
          const: any_subnet
          title: Type
          type: string
      required:
      - network_id
      - type
      title: AnySubnetInterfaceInputSerializer
      type: object
    SubnetInterfaceOutputSerializer:
      properties:
        floating_ip:
          anyOf:
          - $ref: '#/components/schemas/NewFloatingIpInterfaceSerializer'
          - type: 'null'
          description: Floating IP config for this subnet attachment
        name:
          anyOf:
          - maxLength: 37
            type: string
          - type: 'null'
          description: Interface name
          title: Name
        network_id:
          description: Network ID the subnet belongs to. Port will be plugged in this network
          examples:
          - 59905c8e-2619-420a-b046-536096473370
          title: Network Id
          type: string
        port_security_enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Shows the port security state of this interface. A `null` value means port security is on, with the default security group attached. A `true` or `false` value shows the state set at creation.
          examples:
          - true
          title: Port Security Enabled
        security_groups:
          description: Resolved security groups applied to this interface.
          items:
            $ref: '#/components/schemas/GroupSecurityGroupSerializer'
          title: Security Groups
          type: array
        subnet_id:
          description: Port is assigned an IP address from this subnet
          examples:
          - e3c6ee77-48cb-416b-b204-11b492cc776e3
          format: uuid4
          title: Subnet Id
          type: string
        type:
          const: subnet
          title: Type
          type: string
      required:
      - network_id
      - name
      - security_groups
      - port_security_enabled
      - type
      - subnet_id
      - floating_ip
      title: SubnetInterfaceOutputSerializer
      type: object
    StringFilter:
      additionalProperties: false
      description: 'Filter a string field by one or more operators.


        Use `exact`, `prefix`, `contains` or `suffix`; all match case-insensitively.

        Repeat one operator to match any of several values; combine different operators

        to narrow the result.


        Examples:


        * `name[contains]=web` - name contains "web".

        * `name[prefix]=prod-` - name starts with "prod-".

        * `name[prefix]=prod-&name[contains]=web` - both must hold.


        Unsupported operators return a 400.'
      properties:
        contains:
          description: Case-insensitive substring, e.g. `[contains]=web`. Repeat the key to match any substring.
          items:
            type: string
          maxItems: 5
          title: Contains
          type: array
        exact:
          description: Case-insensitive exact match, e.g. `[exact]=web-1`. Repeat the key to match any of several.
          items:
            type: string
          maxItems: 20
          title: Exact
          type: array
        prefix:
          description: Case-insensitive starts-with, e.g. `[prefix]=prod-`. Repeat the key to match any prefix.
          items:
            type: string
          maxItems: 5
          title: Prefix
          type: array
        suffix:
          description: Case-insensitive ends-with, e.g. `[suffix]=-db`. Repeat the key to match any suffix.
          items:
            type: string
          maxItems: 5
          title: Suffix
          type: array
      title: StringFilter
      type: object
    ClusterCreateSerializer:
