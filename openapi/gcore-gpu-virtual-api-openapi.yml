        required: false
        description: Limit of items on a single page
        schema:
          default: 10
          description: Limit of items on a single page
          examples:
          - 10
          exclusiveMinimum: 0
          maximum: 1000
          title: Limit
          type: integer
      - in: query
        name: name
        required: false
        description: Filter servers by name. You can provide a full or partial name, servers with matching names will be returned. For example, entering 'test' will return all servers that contain 'test' in their name.
        schema:
