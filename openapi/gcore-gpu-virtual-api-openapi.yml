          format: uuid4
          title: Network Id
          type: string
        port_security_enabled:
          description: Controls port security for this interface. When omitted, the default applies (port security enabled, default security group attached). When false, the port is created with port security off and no security group attached; `security_groups` must not be set in that case. Not allowed for interfaces on a public network, nor for bare metal servers without a DPU (their ports cannot enforce port security).
          examples:
          - true
          title: Port Security Enabled
          type: boolean
        security_groups:
          description: Security group UUIDs applied to this interface. If omitted (or empty), the top-level `security_groups` value applies; if both are omitted, the project's default security group is applied.
          examples:
          - - id: b4849ffa-89f2-45a1-951f-0ae5b7809d98
          items:
            $ref: '#/components/schemas/MandatoryIdSerializerPydantic'
          title: Security Groups
          type: array
        subnet_id:
          description: Port is assigned an IP address from this subnet
          examples:
          - e3c6ee77-48cb-416b-b204-11b492cc776e3
          format: uuid4
          title: Subnet Id
          type: string
        type:
          const: subnet
          title: Type
          type: string
      required:
      - network_id
      - type
      - subnet_id
      title: SubnetInterfaceInputSerializer
      type: object
    TagFilter:
      description: 'Exact tag key-value pair filter, e.g. `tags[env]=prod&tags[team]=core`.


        Repeat a key to match any of several values for it

        (`tags[env]=prod&tags[env]=dev` -> the `env` tag is prod OR dev); different

        keys are ANDed. Values match case-insensitively.'
      propertyNames:
        description: 'Tag key. Maximum 255 characters. Cannot contain spaces, tabs, newlines, empty string or ''='' character. Trailing or leading whitespaces will be stripped. '
        examples:
        - my-tag
        maxLength: 255
        minLength: 1
        pattern: ^[^\s=]+$
      title: TagFilter
      type: object
      additionalProperties:
        items:
          description: 'Tag value. Maximum 255 characters. Cannot contain tabs, newlines, or empty strings. Trailing or leading whitespaces will be stripped. '
          examples:
          - my-tag-value
          maxLength: 255
          minLength: 1
          pattern: ^[^ \t\n\r\f\v]([^\t\n\r\f\v]*[^ \t\n\r\f\v])?$
          type: string
        maxItems: 20
        minItems: 1
        type: array
