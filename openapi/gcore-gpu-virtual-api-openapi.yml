    DateTimeRangeFilter:
      additionalProperties: false
      description: "Filter a timestamp field by a date/time range.\n\nSet a lower bound with `gt` (after) or `gte` (at or after), and an upper bound\nwith `lt` (before) or `lte` (at or before). Use one or both; together they form\na range. Values are in `2026-01-01T00:00:00Z` format, UTC.\n\nExamples:\n\n* `created_at[gte]=2026-01-01T00:00:00Z` - created on or after Jan 1.\n* `created_at[gte]=2026-01-01T00:00:00Z&created_at[lt]=2026-02-01T00:00:00Z`\n  - created during January.\n\nPass at most one lower and one upper bound; two lower or two upper bounds is a\n400."
      properties:
        gt:
          description: Strictly after this timestamp, e.g. `[gt]=2026-01-01T00:00:00Z`.
          format: date-time
          title: Gt
          type: string
        gte:
          description: At or after this timestamp (inclusive), e.g. `[gte]=2026-01-01T00:00:00Z`.
          format: date-time
          title: Gte
          type: string
        lt:
          description: Strictly before this timestamp, e.g. `[lt]=2026-02-01T00:00:00Z`.
          format: date-time
          title: Lt
          type: string
        lte:
          description: At or before this timestamp (inclusive), e.g. `[lte]=2026-02-01T00:00:00Z`.
          format: date-time
          title: Lte
          type: string
      title: DateTimeRangeFilter
      type: object
    ImageHwFirmwareTypeEnum:
      enum:
