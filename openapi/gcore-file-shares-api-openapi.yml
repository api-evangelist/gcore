        required: true
        description: File Share ID
        schema:
          description: File Share ID
          examples:
          - bd8c47ee-e565-4e26-8840-b537e6827b08
          format: uuid4
          title: File Share Id
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskIDsSerializer'
      requestBody:
        content:
          application/json:
            schema:
