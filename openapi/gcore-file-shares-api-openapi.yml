  /v1/file_shares/{project_id}/{region_id}/{file_share_id}/metadata:
    post:
      operationId: SfsMetadataHandler.post
      summary: Update file share tags
      description: 'Create or update one or more tag for a file share.

        If an item does not exist, it gets created.

        If an item already exists, it''s value is overwritten


        Use PATCH /v1/file_shares/{project_id}/{region_id}/{file_share_id} instead'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      - in: path
        name: file_share_id
        required: true
        description: File Share ID
        schema:
          description: File Share ID
          examples:
          - bd8c47ee-e565-4e26-8840-b537e6827b08
          format: uuid4
          title: File Share Id
          type: string
      responses:
        '204':
          description: No Content
      deprecated: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTagsSerializer'
      tags:
      - File Shares
    get:
      operationId: SfsMetadataHandler.get
