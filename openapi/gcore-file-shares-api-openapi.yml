openapi: 3.2.0
info:
  title: Cloud File Shares API
  description: '___brandName___ Cloud API provides an API to manage Cloud resources and services.

    API address is: https://api.___serverHost___/cloud


    # Authentication

    You can find the available authorization methods in this section:

    Authorization methods


    Project ID & Region ID


    Most endpoints require project_id and region_id path parameters.

    List Regions

    and

    List Projects

    to see available projects and regions.'
  version: 14.491.0
servers:
- url: https://api.___serverHost___/cloud
tags:
- name: File Shares
paths:
  /v1/file_shares/{project_id}/{region_id}:
    post:
      operationId: SfsViewSet.post
      summary: Create file share
      description: ''
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskIDsSerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFileShareSerializer'
      tags:
      - File Shares
    get:
      operationId: SfsViewSet.get
      summary: List file shares
      description: ''
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      - in: query
        name: limit
        required: false
        description: Optional. Limit the number of returned items
        schema:
          default: 1000
          description: Optional. Limit the number of returned items
          examples:
          - 1000
          exclusiveMinimum: 0
          maximum: 1000
          title: Limit
          type: integer
      - in: query
        name: name
        required: false
        description: File share name. Uses partial match.
        schema:
          description: File share name. Uses partial match.
          examples:
          - test-sfs
          title: Name
          type: string
      - in: query
        name: offset
        required: false
        description: Optional. Offset value is used to exclude the first set of records from the result
        schema:
          default: 0
          description: Optional. Offset value is used to exclude the first set of records from the result
          examples:
          - 0
          minimum: 0
          title: Offset
          type: integer
      - in: query
        name: type_name
        required: false
        description: File share type name
        schema:
          $ref: '#/components/schemas/FileShareTypeName'
          description: File share type name
          examples:
          - standard
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileShareCollectionSerializer'
      tags:
      - File Shares
  /v3/file_shares/{project_id}/{region_id}/{file_share_id}:
    patch:
      operationId: SfsShareViewSet.patch
      summary: Update file share
      description: Rename file share, update tags or set share specific properties
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
