    TagSerializer:
      description: 'A tag is a key-value pair that can be associated with a resource,

        enabling efficient filtering and grouping for better organization and management.

        Some tags are read-only and cannot be modified by the user.

        Tags are also integrated with cost reports, allowing cost data to be filtered based on tag keys or values.'
      properties:
        key:
          description: Tag key. Maximum 255 characters. Cannot contain spaces, tabs, newlines, empty string or '=' character.
          examples:
          - my-tag
          title: Key
          type: string
        read_only:
          description: If true, the tag is read-only and cannot be modified by the user
          examples:
          - false
          title: Read Only
          type: boolean
        value:
          description: Tag value. Maximum 255 characters. Cannot contain spaces, tabs, newlines, empty string or '=' character.
          examples:
          - my-tag-value
          title: Value
          type: string
      required:
      - key
      - value
      - read_only
      title: TagSerializer
      type: object
