    UpdateVastFileShareSettingsSerializer:
      additionalProperties: false
      properties:
        allowed_characters:
          description: "Determines which characters are allowed in file names. Choose between:\n  - Lowest Common Denominator (LCD), allows only characters allowed by all VAST Cluster-supported protocols\n  - Native Protocol Limit (NPL), imposes no limitation beyond that of the client protocol.\n\nOmit this field to keep the current setting."
          enum:
          - LCD
          - NPL
          examples:
          - LCD
          title: Allowed Characters
          type: string
        path_length:
          description: "Affects the maximum limit of file path component name length. Choose between:\n  - Lowest Common Denominator (LCD), imposes the lowest common denominator file length limit of all VAST Cluster-supported protocols. With this option, the limitation on the length of a single component of the path is 255 characters\n  - Native Protocol Limit (NPL), imposes no limitation beyond that of the client protocol.\n\nOmit this field to keep the current setting."
          enum:
          - LCD
          - NPL
          examples:
          - LCD
          title: Path Length
          type: string
        root_squash:
          description: "Enables or disables root squash for NFS clients.\n  - If `true`, root squash is enabled: the root user is mapped to nobody for all file and folder management operations on the export.\n  - If `false`, root squash is disabled: the NFS client `root` user retains root privileges. Use this option if you trust the root user not to perform operations that will corrupt data.\n\nOmit this field to keep the current setting."
          examples:
          - true
          title: Root Squash
          type: boolean
        trash_access:
          description: "Enables or disables access to the hidden `.vast_trash` folder of the share.\n  - If `false`, the folder is not accessible.\n  - If `true`, clients within the share's access range can move files and folders to `.vast_trash` for asynchronous deletion, which is much faster than deleting large directory trees in place.\n\nRequires `root_squash` to be disabled, because VAST ignores trash folder access for hosts that are under root squash.\n\nOmit this field to keep the current setting."
          examples:
          - false
          title: Trash Access
          type: boolean
