components:
  schemas:
    CheckQuotaBeforeSfsCreationSerializer:
      properties:
        size:
          description: File Share size in GiB
          examples:
          - 5
          minimum: 1
          title: Size
          type: integer
      required:
      - size
      title: CheckQuotaBeforeSfsCreationSerializer
      type: object
    FileShareCollectionSerializer:
      properties:
        count:
          description: Number of objects
          examples:
          - 1
          minimum: 0
          title: Count
          type: integer
        results:
          description: Objects
          items:
            $ref: '#/components/schemas/FileShareSerializer'
          title: Results
          type: array
      required:
      - count
      - results
      title: FileShareCollectionSerializer
      type: object
    ShareSettingsSerializer:
      discriminator:
        mapping:
          ddn: '#/components/schemas/DdnShareSettingsOutputSerializer'
          standard: '#/components/schemas/StandardShareSettingsOutputSerializer'
          vast: '#/components/schemas/VastShareSettingsOutputSerializer'
        propertyName: type_name
      oneOf:
      - $ref: '#/components/schemas/StandardShareSettingsOutputSerializer'
      - $ref: '#/components/schemas/DdnShareSettingsOutputSerializer'
      - $ref: '#/components/schemas/VastShareSettingsOutputSerializer'
      title: ShareSettingsSerializer
    TaskIDsSerializer:
      properties:
        tasks:
          description: "List of task IDs representing asynchronous operations. Use these IDs to monitor operation progress:\n  * `GET /v1/tasks/{task_id}` - Check individual task status and details\n  Poll task status until completion (`FINISHED`/`ERROR`) before proceeding with dependent operations."
          examples:
          - - d478ae29-dedc-4869-82f0-96104425f565
          items:
            type: string
          title: Tasks
          type: array
      required:
      - tasks
      title: TaskIDsSerializer
      type: object
    PriceDisplayStatus:
      enum:
      - error
      - hide
      - show
      title: PriceDisplayStatus
      type: string
    FileShareStatusChoices:
      enum:
      - available
      - awaiting_transfer
      - backup_creating
      - backup_restoring
      - backup_restoring_error
      - creating
      - creating_from_snapshot
      - deleted
      - deleting
      - ensuring
      - error
      - error_deleting
      - extending
      - extending_error
      - inactive
      - manage_error
      - manage_starting
      - migrating
      - migrating_to
      - replication_change
      - reverting
      - reverting_error
      - shrinking
      - shrinking_error
      - shrinking_possible_data_loss_error
      - unmanage_error
      - unmanage_starting
      - unmanaged
      title: FileShareStatusChoices
      type: string
    CreateFileShareSerializer:
      oneOf:
      - $ref: '#/components/schemas/CreateStandardFileShareSerializer'
      - $ref: '#/components/schemas/CreateDdnFileShareSerializer'
      - $ref: '#/components/schemas/CreateVastFileShareSerializer'
      title: CreateFileShareSerializer
    FileSharePricingRequestSerializer:
      examples:
      - size: 1000
        source: new-file-share
      properties:
        size:
          description: File share size in GiB
          title: Size
          type: integer
        source:
          $ref: '#/components/schemas/CreateFileShareSource'
          description: Only 'new-file-share'
        type_name:
          $ref: '#/components/schemas/FileShareStorageType'
          default: standard
          description: File share type
      required:
      - source
      - size
      title: FileSharePricingRequestSerializer
      type: object
    FileShareRequiredQuotaSerializer:
      properties:
        sfs_count_limit:
          description: Shared file system Count limit
          examples:
          - 10
          title: Sfs Count Limit
          type: integer
        sfs_count_requested:
          description: Shared file system Count requested
          examples:
          - 1
          title: Sfs Count Requested
          type: integer
        sfs_count_usage:
          description: Shared file system Count usage
          examples:
          - 1
          title: Sfs Count Usage
