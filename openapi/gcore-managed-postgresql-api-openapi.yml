openapi: 3.2.0
info:
  title: Cloud Managed PostgreSQL API
  description: '___brandName___ Cloud API provides an API to manage Cloud resources and services.

    API address is: https://api.___serverHost___/cloud


    # Authentication

    You can find the available authorization methods in this section:

    Authorization methods


    Project ID & Region ID


    Most endpoints require project_id and region_id path parameters.

    List Regions

    and

    List Projects

    to see available projects and regions.'
  version: 14.491.0
servers:
- url: https://api.___serverHost___/cloud
tags:
- name: Managed PostgreSQL
paths:
  /v1/dbaas/postgres/check_limit/{project_id}/{region_id}:
    post:
      operationId: DBAASPorstresLimitsHandler.post
      summary: Check PostgreSQL cluster quota
      description: 'Check if regional quota is exceeded for PostgreSQL cluster creation.

        If exceeded, calculate additional quotas needed.'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          title: Region Id
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegionRequestedQuotasSerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PGClusterCreateSerializer'
      tags:
      - Managed PostgreSQL
  /v1/dbaas/postgres/clusters/{project_id}/{region_id}:
    post:
      operationId: PGClustersViewSet.post
      summary: Create PostgreSQL cluster
      description: Create a new PostgreSQL cluster with the specified configuration.
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          title: Region Id
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskIDsSerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PGClusterCreateSerializer'
      tags:
      - Managed PostgreSQL
    get:
      operationId: PGClustersViewSet.get
      summary: List PostgreSQL clusters
      description: 'List all PostgreSQL clusters in the specified project and region.

        Results can be filtered by search query and paginated.'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          title: Region Id
          type: integer
      - in: query
        name: limit
        required: false
        description: Maximum number of clusters to return
        schema:
          default: 10
          description: Maximum number of clusters to return
          minimum: 0
          title: Limit
          type: integer
      - in: query
        name: name
        required: false
        description: Filter clusters by name
        schema:
          description: Filter clusters by name
          title: Name
          type: string
      - in: query
        name: offset
        required: false
        description: Number of clusters to skip
        schema:
          default: 0
          description: Number of clusters to skip
          minimum: 0
          title: Offset
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PGClusterShortCollectionSerializer'
      tags:
      - Managed PostgreSQL
  /v1/dbaas/postgres/clusters/{project_id}/{region_id}/{cluster_name}:
    get:
      operationId: PGClusterViewSet.get
      summary: Get PostgreSQL cluster
      description: Get detailed information about a specific PostgreSQL cluster.
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          title: Region Id
          type: integer
      - in: path
        name: cluster_name
        required: true
        description: Cluster name
        schema:
          description: Cluster name
          title: Cluster Name
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresClusterOverviewSerializer'
      tags:
      - Managed PostgreSQL
    patch:
      operationId: PGClusterViewSet.patch
      summary: Update PostgreSQL cluster
      description: Update the configuration of an existing PostgreSQL cluster.
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          title: Region Id
          type: integer
      - in: path
        name: cluster_name
        required: true
        description: Cluster name
        schema:
          description: Cluster name
          title: Cluster Name
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskIDsSerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchPGClusterSerializer'
      tags:
      - Managed PostgreSQL
    delete:
      operationId: PGClusterViewSet.delete
      summary: Delete PostgreSQL cluster
      description: Delete a PostgreSQL cluster and all its associated resources.
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          title: Region Id
          type: integer
      - in: path
        name: cluster_name
        required: true
        description: Cluster name
        schema:
          description: Cluster name
          title: Cluster Name
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskIDsSerializer'
      tags:
      - Managed PostgreSQL
  /v1/dbaas/postgres/clusters/{project_id}/{region_id}/{cluster_name}/metrics:
    get:
      operationId: PGClusterMetricsViewSet.get
      summary: Get PostgreSQL cluster metrics
      description: Get metrics for a specific PostgreSQL cluster in Prometheus format.
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          title: Region Id
          type: integer
      - in: path
        name: cluster_name
        required: true
        description: Cluster name
        schema:
          description: Cluster name
          title: Cluster Name
          type: string
      responses:
        '200':
          description: OK
      tags:
      - Managed PostgreSQL
  /v1/dbaas/postgres/clusters/{project_id}/{region_id}/{cluster_name}/users/{username}/credentials:
    post:
      operationId: DBAASPostgresRegenerateSecretView.post
      summary: Regenerate PostgreSQL user credentials
      description: Generate new credentials for a specific user in a PostgreSQL cluster.
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          title: Region Id
          type: integer
      - in: path
        name: cluster_name
        required: true
        description: Cluster name
        schema:
          description: Cluster name
          title: Cluster Name
          type: string
      - in: path
        name: username
        required: true
        description: Username
        schema:
          description: Username
          title: Username
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCredentialsSerializer'
      tags:
      - Managed PostgreSQL
    get:
      operationId: DBAASPostgresRegenerateSecretView.get
      summary: Get PostgreSQL user credentials
      description: 'Get the credentials for a specific user in a PostgreSQL cluster.

        This endpoint can only be used once per user.'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          title: Region Id
          type: integer
      - in: path
        name: cluster_name
        required: true
        description: Cluster name
        schema:
          description: Cluster name
          title: Cluster Name
          type: string
      - in: path
        name: username
        required: true
        description: Username
        schema:
          description: Username
          title: Username
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCredentialsSerializer'
      tags:
      - Managed PostgreSQL
  /v1/dbaas/postgres/configuration/{project_id}/{region_id}:
    get:
      operationId: DBAASPostgresAwailableConfigurationView.get
      summary: Get PostgreSQL configurations
      description: Get all available PostgreSQL configurations for the specified region.
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          title: Region Id
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DBAASPGConfiguration'
      tags:
      - Managed PostgreSQL
  /v1/dbaas/postgres/validate_pg_conf/{project_id}/{region_id}:
    post:
      operationId: DBAASPostgresValidatePGConfView.post
      summary: Validate PostgreSQL configuration
      description: Validate a custom PostgreSQL configuration file.
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          title: Region Id
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PGConfValidateResponseSerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PGConfValidationRequestSerializer'
      tags:
      - Managed PostgreSQL
  /v1/dbaas/status/{project_id}/{region_id}:
    get:
      operationId: DBAASStatusView.get
      summary: Get PostgreSQL service status
      description: 'Get the current status of the PostgreSQL service for the specified project.

        The service may be initialized or not.'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          title: Region Id
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DbaasStatusSerializer'
      tags:
      - Managed PostgreSQL
    put:
      operationId: DBAASStatusView.put
      summary: Update PostgreSQL service status
      description: Activate or deactivate the PostgreSQL service for the specified project.
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          title: Region Id
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DbaasStatusSerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DbaasStatusRequestSerializer'
      tags:
      - Managed PostgreSQL
components:
  schemas:
    DbaasStatusSerializer:
      properties:
        is_initialized:
          description: DBAAS service status
          examples:
          - true
          - false
          title: Is Initialized
          type: boolean
      required:
      - is_initialized
      title: DbaasStatusSerializer
      type: object
    PatchPGClusterSerializer:
      properties:
        databases:
          default: []
          items:
            $ref: '#/components/schemas/Database'
          title: Databases
          type: array
        flavor:
          anyOf:
          - $ref: '#/components/schemas/Flavor'
          - type: 'null'
          default: null
          description: New instance RAM and CPU
        high_availability:
          anyOf:
          - $ref: '#/components/schemas/HighAvailabilityOptions'
          - type: 'null'
          default: null
          description: New High Availability settings
        network:
          anyOf:
          - $ref: '#/components/schemas/PublicNetwork'
          - type: 'null'
          default: null
          title: Network
        pg_server_configuration:
          anyOf:
          - $ref: '#/components/schemas/PatchPostgreSQLServerConfig'
          - type: 'null'
          default: null
          description: New PosgtreSQL cluster configuration
        storage:
          anyOf:
          - $ref: '#/components/schemas/StorageSize'
          - type: 'null'
          default: null
          description: New storage configuration
        users:
          default: []
          items:
            $ref: '#/components/schemas/PgUser'
          title: Users
          type: array
      title: PatchPGClusterSerializer
      type: object
    TaskIDsSerializer:
      properties:
        tasks:
          description: "List of task IDs representing asynchronous operations. Use these IDs to monitor operation progress:\n  * `GET /v1/tasks/{task_id}` - Check individual task status and details\n  Poll task status until completion (`FINISHED`/`ERROR`) before proceeding with dependent operations."
          examples:
          - - d478ae29-dedc-4869-82f0-96104425f565
          items:
            type: string
          title: Tasks
          type: array
      required:
      - tasks
      title: TaskIDsSerializer
      type: object
    PgUserOverview:
      properties:
        is_secret_revealed:
          description: Display was secret revealed or not
          examples:
          - true
          - false
          title: Is Secret Revealed
          type: boolean
        name:
          description: User name
          examples:
          - myuser
          pattern: ^[a-z]*$
          title: Name
          type: string
        role_attributes:
          description: User's attributes
          examples:
          - - INHERIT
          items:
            enum:
            - BYPASSRLS
            - CREATEDB
            - CREATEROLE
            - INHERIT
            - LOGIN
            - NOLOGIN
            type: string
          title: Role Attributes
          type: array
          uniqueItems: true
      required:
      - name
      - role_attributes
      - is_secret_revealed
      title: PgUserOverview
      type: object
    PatchPostgreSQLServerConfig:
      properties:
        pg_conf:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: New pg.conf file settings
          examples:
          - '

            listen_addresses = ''localhost''

            port = 5432

            max_connections = 100

            shared_buffers = 128MB

            logging_collector = on'
          title: Pg Conf
        pooler:
          anyOf:
          - $ref: '#/components/schemas/PoolerConfigurationSchema'
          - type: 'null'
          default: null
          examples:
          - null
          title: Pooler configuration for master
        version:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: New cluster version
          examples:
          - '15'
          title: Version
      title: PatchPostgreSQLServerConfig
      type: object
    PostgresClusterOverviewSerializer:
      properties:
        cluster_name:
          maxLength: 50
          minLength: 1
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
          title: PostgreSQL server name
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        databases:
          items:
            $ref: '#/components/schemas/DatabaseOverview'
          title: Databases
          type: array
        flavor:
          $ref: '#/components/schemas/Flavor'
          description: Instance RAM and CPU
        high_availability:
          anyOf:
          - $ref: '#/components/schemas/HighAvailabilityOptions'
          - type: 'null'
          title: HA settings
        network:
          $ref: '#/components/schemas/PublicNetworkOut'
          title: Network
        pg_server_configuration:
          $ref: '#/components/schemas/PostgreSQLServerConfig'
          description: Main PG configuration
        status:
          $ref: '#/components/schemas/ClusterStatus'
          description: Current cluster status
        storage:
          $ref: '#/components/schemas/Storage'
          description: PG's storage configuration
        users:
          items:
            $ref: '#/components/schemas/PgUserOverview'
          title: Users
          type: array
      required:
      - cluster_name
      - network
      - high_availability
      - flavor
      - storage
      - pg_server_configuration
      - created_at
      - status
      - databases
      - users
      title: PostgresClusterOverviewSerializer
      type: object
    StorageSize:
      properties:
        size_gib:
          description: Total available storage for database
          examples:
          - 100
          maximum: 100
          minimum: 1
          title: Size Gib
          type: integer
      required:
      - size_gib
      title: StorageSize
      type: object
    PGClusterShortCollectionSerializer:
      properties:
        count:
          description: Number of objects
          examples:
          - 1
          minimum: 0
          title: Count
          type: integer
        results:
          description: Objects
          items:
            $ref: '#/components/schemas/PGClusterShortSerializer'
          title: Results
          type: array
      required:
      - count
      - results
      title: PGClusterShortCollectionSerializer
      type: object
    ReplicationMode:
      enum:
      - async
      - sync
      title: ReplicationMode
      type: string
    ClusterStatus:
      enum:
      - DELETING
      - FAILED
      - PREPARING
      - READY
      - UNHEALTHY
      - UNKNOWN
      - UPDATING
      title: ClusterStatus
      type: string
    FlavorConfiguration:
      properties:
        cpu:
          description: Maximum available cores for instance
          examples:
          - 1
          - 2
          minimum: 1
          title: Cpu
          type: integer
        memory_gib:
          description: Maximum available RAM for instance
          examples:
          - 1
          - 2
          minimum: 1
          title: Memory Gib
          type: integer
        pg_conf:
          examples:
          - '

            listen_addresses = ''localhost''

            port = 5432

            max_connections = 100

            shared_buffers = 128MB

            logging_collector = on'
          title: PG Conf for flavor
          type: string
      required:
      - cpu
      - memory_gib
      - pg_conf
      title: FlavorConfiguration
      type: object
    PoolerConfigurationSchema:
      properties:
        mode:
          $ref: '#/components/schemas/PoolerModes'
          examples:
          - transaction
        type:
          const: pgbouncer
          default: pgbouncer
          examples:
          - pgbouncer
          title: Type
          type: string
      required:
      - mode
      title: PoolerConfigurationSchema
      type: object
    StorageClass:
      properties:
        name:
          description: Storage type
          examples:
          - ssd-hiiops
          title: Name
          type: string
      required:
      - name
      title: StorageClass
      type: object
    PGClusterShortSerializer:
      properties:
        cluster_name:
          description: PostgreSQL cluster name
          examples:
          - mycluster
          title: Cluster Name
          type: string
        created_at:
          description: Creation timestamp
          format: date-time
          title: Created At
          type: string
        status:
          $ref: '#/components/schemas/ClusterStatus'
          description: Current cluster status
        version:
          description: Cluster version
          examples:
          - '15'
          title: Version
          type: string
      required:
      - cluster_name
      - version
      - created_at
      - status
      title: PGClusterShortSerializer
      type: object
    RegionRequestedQuotasSerializer:
      properties:
        baremetal_basic_count_limit:
          description: Basic bare metal servers count limit
          examples:
          - 0
          title: Baremetal Basic Count Limit
          type: integer
        baremetal_basic_count_requested:
          description: Basic bare metal servers count requested
          examples:
          - 1
          title: Baremetal Basic Count Requested
          type: integer
        baremetal_basic_count_usage:
          description: Basic bare metal servers count usage
          examples:
          - 0
          title: Baremetal Basic Count Usage
          type: integer
        baremetal_gpu_a100_count_limit:
          description: Bare metal A100 GPU server count limit
          examples:
          - 0
          title: Baremetal Gpu A100 Count Limit
          type: integer
        baremetal_gpu_a100_count_requested:
          description: Bare metal A100 GPU server count requested
          examples:
          - 1
          title: Baremetal Gpu A100 Count Requested
          type: integer
        baremetal_gpu_a100_count_usage:
          description: Bare metal A100 GPU server count usage
          examples:
          - 0
          title: Baremetal Gpu A100 Count Usage
          type: integer
        baremetal_gpu_h100_count_limit:
          description: Bare metal H100 GPU server count limit
          examples:
          - 0
          title: Baremetal Gpu H100 Count Limit
          type: integer
        baremetal_gpu_h100_count_requested:
          description: Bare metal H100 GPU server count requested
          examples:
          - 1
          title: Baremetal Gpu H100 Count Requested
          type: integer
        baremetal_gpu_h100_count_usage:
          description: Bare metal H100 GPU server count usage
          examples:
          - 0
          title: Baremetal Gpu H100 Count Usage
          type: integer
        baremetal_gpu_h200_count_limit:
          description: Bare metal H200 GPU server count limit
          examples:
          - 0
          title: Baremetal Gpu H200 Count Limit
          type: integer
        baremetal_gpu_h200_count_requested:
          description: Bare metal H200 GPU server count requested
          examples:
          - 1
          title: Baremetal Gpu H200 Count Requested
          type: integer
        baremetal_gpu_h200_count_usage:
          description: Bare metal H200 GPU server count usage
          examples:
          - 0
          title: Baremetal Gpu H200 Count Usage
          type: integer
        baremetal_gpu_l40s_count_limit:
          description: Bare metal L40S GPU server count limit
          examples:
          - 0
          title: Baremetal Gpu L40S Count Limit
          type: integer
        baremetal_gpu_l40s_count_requested:
          description: Bare metal L40S GPU server count requested
          examples:
          - 1
          title: Baremetal Gpu L40S Count Requested
          type: integer
        baremetal_gpu_l40s_count_usage:
          description: Bare metal L40S GPU server count usage
          examples:
          - 0
          title: Baremetal Gpu L40S Count Usage
          type: integer
        baremetal_hf_count_limit:
          description: High-frequency bare metal servers count limit
          examples:
          - 0
          title: Baremetal Hf Count Limit
          type: integer
        baremetal_hf_count_requested:
          description: High-frequency bare metal servers count requested
          examples:
          - 1
          title: Baremetal Hf Count Requested
          type: integer
        baremetal_hf_count_usage:
          description: High-frequency bare metal servers count usage
          examples:
          - 0
          title: Baremetal Hf Count Usage
          type: integer
        baremetal_infrastructure_count_limit:
          description: Infrastructure bare metal servers count limit
          examples:
          - 0
          title: Baremetal Infrastructure Count Limit
          type: integer
        baremetal_infrastructure_count_requested:
          description: Infrastructure bare metal servers count requested
          examples:
          - 1
          title: Baremetal Infrastructure Count Requested
          type: integer
        baremetal_infrastructure_count_usage:
          description: Infrastructure bare metal servers count usage
          examples:
          - 0
          title: Baremetal Infrastructure Count Usage
          type: integer
        baremetal_network_count_limit:
          description: Bare metal Network Count limit
          examples:
          - 0
          title: Baremetal Network Count Limit
          type: integer
        baremetal_network_count_requested:
          description: Bare metal Network Count requested
          examples:
          - 1
          title: Baremetal Network Count Requested
          type: integer
        baremetal_network_count_usage:
          description: Bare metal Network Count usage
          examples:
          - 0
          title: Baremetal Network Count Usage
          type: integer
        baremetal_storage_count_limit:
          description: Storage bare metal servers count limit
          examples:
          - 0
