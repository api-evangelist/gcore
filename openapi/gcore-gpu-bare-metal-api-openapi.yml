      type: string
    InstanceFixedAddressSerializer:
      description: Schema for `fixed` addresses. This schema is used when fetching a single instance.
      properties:
        addr:
          description: IP address
          examples:
          - 10.0.0.17
          title: Addr
          type: string
        interface_name:
          anyOf:
          - type: string
          - type: 'null'
          description: Interface name. This field will be `null` if `with_interfaces_name=true` is not set in the request when listing instances. It will also be `null` if the `interface_name` was not specified during instance creation or when attaching the interface.
          examples:
          - my-interface
          title: Interface Name
        subnet_id:
          description: The unique identifier of the subnet associated with this address. Included only in the response for a single-resource lookup (GET by ID). For the trunk subports, this field is always set.
          examples:
          - ba83aec4-7bc1-4979-b934-a11fc1d36cf3
          title: Subnet Id
          type: string
        subnet_name:
          description: The name of the subnet associated with this address. Included only in the response for a single-resource lookup (GET by ID). For the trunk subports, this field is always set.
          examples:
          - my-subnet
          title: Subnet Name
          type: string
        type:
          const: fixed
          description: Type of the address
          examples:
          - fixed
          title: Type
          type: string
      required:
      - addr
      - type
      - interface_name
      - subnet_name
      - subnet_id
      title: Fixed IP Address
      type: object
    UpdateTagsSerializer:
      propertyNames:
        description: 'Tag key. Maximum 255 characters. Cannot contain spaces, tabs, newlines, empty string or ''='' character. Trailing or leading whitespaces will be stripped. '
        examples:
        - my-tag
        maxLength: 255
        minLength: 1
        pattern: ^[^\s=]+$
      title: UpdateTagsSerializer
      type: object
      additionalProperties:
        anyOf:
        - maxLength: 255
          minLength: 1
          pattern: ^[^ \t\n\r\f\v]([^\t\n\r\f\v]*[^ \t\n\r\f\v])?$
          type: string
        - type: 'null'
        description: Tag value. Maximum 255 characters. Cannot contain tabs, newlines, empty string or start/end with whitespace. Trailing or leading whitespaces will be stripped. Set to `null` in order to delete this tag.
        examples:
        - my-tag-value
    DetailedInstancePricingPerGBSerializer:
      properties:
        egress_traffic_baremetal:
          anyOf:
