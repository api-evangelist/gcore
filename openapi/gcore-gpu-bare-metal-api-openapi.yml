    StringFilter:
      additionalProperties: false
      description: 'Filter a string field by one or more operators.


        Use `exact`, `prefix`, `contains` or `suffix`; all match case-insensitively.

        Repeat one operator to match any of several values; combine different operators

        to narrow the result.


        Examples:


        * `name[contains]=web` - name contains "web".

        * `name[prefix]=prod-` - name starts with "prod-".

        * `name[prefix]=prod-&name[contains]=web` - both must hold.


        Unsupported operators return a 400.'
      properties:
        contains:
          description: Case-insensitive substring, e.g. `[contains]=web`. Repeat the key to match any substring.
          items:
            type: string
          maxItems: 5
          title: Contains
          type: array
        exact:
          description: Case-insensitive exact match, e.g. `[exact]=web-1`. Repeat the key to match any of several.
          items:
            type: string
          maxItems: 20
          title: Exact
          type: array
        prefix:
          description: Case-insensitive starts-with, e.g. `[prefix]=prod-`. Repeat the key to match any prefix.
          items:
            type: string
          maxItems: 5
          title: Prefix
          type: array
        suffix:
          description: Case-insensitive ends-with, e.g. `[suffix]=-db`. Repeat the key to match any suffix.
          items:
            type: string
          maxItems: 5
          title: Suffix
          type: array
      title: StringFilter
      type: object
