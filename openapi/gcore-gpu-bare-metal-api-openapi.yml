    IntRangeFilter:
      additionalProperties: false
      description: 'Filter a non-negative integer field (e.g. `servers_count`) by a range.


        Set a lower bound with `gt` (greater than) or `gte` (greater than or equal),

        and an upper bound with `lt` (less than) or `lte` (less than or equal). Use one

        or both; together they form a range.


        Examples:


        * `servers_count[gte]=2` - 2 or more.

        * `servers_count[gte]=2&servers_count[lt]=8` - from 2 to 8.


        Pass at most one lower and one upper bound; two lower or two upper bounds is a

        400.'
      properties:
        gt:
          description: Strictly greater than, e.g. `[gt]=1`.
          minimum: 0
          title: Gt
          type: integer
        gte:
          description: Greater than or equal, e.g. `[gte]=2`.
          minimum: 0
          title: Gte
          type: integer
        lt:
          description: Strictly less than, e.g. `[lt]=8`.
          minimum: 0
          title: Lt
          type: integer
        lte:
          description: Less than or equal, e.g. `[lte]=4`.
          minimum: 0
          title: Lte
          type: integer
      title: IntRangeFilter
      type: object
