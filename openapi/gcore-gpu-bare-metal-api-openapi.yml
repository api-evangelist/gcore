openapi: 3.2.0
info:
  title: Cloud GPU Bare Metal API
  description: '___brandName___ Cloud API provides an API to manage Cloud resources and services.

    API address is: https://api.___serverHost___/cloud


    # Authentication

    You can find the available authorization methods in this section:

    Authorization methods


    Project ID & Region ID


    Most endpoints require project_id and region_id path parameters.

    List Regions

    and

    List Projects

    to see available projects and regions.'
  version: 14.491.0
servers:
- url: https://api.___serverHost___/cloud
tags:
- name: GPU Bare Metal
paths:
  /v1/ai/clusters/{project_id}/{region_id}/{cluster_id}/interfaces:
    get:
      operationId: AIClusterPoplarInterfacesHandler.get
      summary: List bare metal GPU cluster interfaces
      description: Retrieve a list of network interfaces attached to the GPU cluster servers.
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 7
          title: Region Id
          type: integer
      - in: path
        name: cluster_id
        required: true
        description: Cluster unique identifier
        schema:
          description: Cluster unique identifier
          examples:
          - 1aaaab48-10d0-46d9-80cc-85209284ceb4
          format: uuid4
          title: Cluster Id
          type: string
      - in: query
        name: limit
        required: false
        description: Limit of items on a single page
        schema:
          default: 1000
          description: Limit of items on a single page
          examples:
          - 1000
          exclusiveMinimum: 0
          maximum: 1000
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        description: Offset in results list
        schema:
          default: 0
          description: Offset in results list
          examples:
          - 0
          minimum: 0
          title: Offset
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceInterfaceMixedCollectionSerializer'
      tags:
      - GPU Bare Metal
  /v1/ai/clusters/{project_id}/{region_id}/{cluster_id}/ports:
    get:
      operationId: AIClusterPoplarPortsHandler.get
      summary: List bare metal GPU cluster ports
      description: Retrieve a list of network ports attached to the GPU cluster servers.
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 7
          title: Region Id
          type: integer
      - in: path
        name: cluster_id
        required: true
        description: Cluster unique identifier
        schema:
          description: Cluster unique identifier
          examples:
          - 1aaaab48-10d0-46d9-80cc-85209284ceb4
          format: uuid4
          title: Cluster Id
          type: string
      responses:
        '200':
          description: Ports with security groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortWithSecurityGroupsCollectionSerializer'
      tags:
      - GPU Bare Metal
