components:
  schemas:
    InstanceStatusQuery:
      enum:
      - ACTIVE
      - BUILD
      - ERROR
      - HARD_REBOOT
      - MIGRATING
      - PAUSED
      - REBOOT
      - REBUILD
      - RESIZE
      - REVERT_RESIZE
      - SHELVED
      - SHELVED_OFFLOADED
      - SHUTOFF
      - SOFT_DELETED
      - SUSPENDED
      - VERIFY_RESIZE
      title: InstanceStatusQuery
      type: string
    PatchBaremetalClusterServerSettings:
      properties:
        image_id:
          description: System image ID
          examples:
          - 3793c250-0b3b-4678-bab3-e11afbc29657
          format: uuid4
          title: Image Id
          type: string
        servers_settings:
          $ref: '#/components/schemas/PatchServerSettingsInputSerializer'
          description: Configuration settings for the servers in the cluster
      title: PatchBaremetalClusterServerSettings
      type: object
    TaskIDsSerializer:
      properties:
        tasks:
          description: "List of task IDs representing asynchronous operations. Use these IDs to monitor operation progress:\n  * `GET /v1/tasks/{task_id}` - Check individual task status and details\n  Poll task status until completion (`FINISHED`/`ERROR`) before proceeding with dependent operations."
          examples:
          - - d478ae29-dedc-4869-82f0-96104425f565
          items:
            type: string
          title: Tasks
          type: array
      required:
      - tasks
      title: TaskIDsSerializer
      type: object
    GroupSecurityGroupSerializer:
      properties:
        id:
          description: Security group ID
          examples:
          - ae74714c-c380-48b4-87f8-758d656cdad6
          title: Id
          type: string
        name:
          description: Security group name
          examples:
          - default
          title: Name
          type: string
      required:
      - id
      - name
      title: GroupSecurityGroupSerializer
      type: object
    BaremetalClusterServerReplaceBodySerializer:
      properties:
        keep_ip_addresses:
          default: true
          description: Retain the original Public/Private IPs on the replacement node (ethernet only). When false, new IPs are assigned. No effect on InfiniBand interfaces.
          examples:
          - true
          title: Keep Ip Addresses
          type: boolean
      title: BaremetalClusterServerReplaceBodySerializer
      type: object
    GpuBaremetalFlavorSerializerWithoutPrice:
      properties:
        architecture:
          anyOf:
          - type: string
          - type: 'null'
          description: Flavor architecture type
          examples:
          - x86_64
          title: Architecture
        capacity:
          description: Number of available instances of given flavor for the client
          examples:
          - 1
          title: Capacity
          type: integer
        disabled:
          description: If the flavor is disabled, new resources cannot be created using this flavor.
          examples:
          - false
          title: Disabled
          type: boolean
        hardware_description:
          $ref: '#/components/schemas/GpuBaremetalFlavorHardwareDescriptionSerializer'
          description: Additional bare metal hardware description
        hardware_properties:
          $ref: '#/components/schemas/GpuFlavorHardwareProperties'
          description: Additional bare metal hardware properties
        name:
          description: Flavor name
          examples:
          - g1-gpu-1-2-1
          title: Name
          type: string
        reserved_capacity:
          description: Number of available instances of given flavor from reservations
          examples:
          - 5
          title: Reserved Capacity
          type: integer
        supported_features:
          $ref: '#/components/schemas/FlavorFeaturesSerializer'
          description: Set of enabled features based on the flavor's type and configuration
      required:
      - name
      - architecture
      - disabled
      - capacity
      - reserved_capacity
      - hardware_description
      - hardware_properties
      - supported_features
      title: Bare metal GPU flavors chema without price
      type: object
    CreateGPUClusterAnySubnetInterfaceSerializer:
      properties:
        floating_ip:
          $ref: '#/components/schemas/CreateGPUClusterFloatingIPSerializer'
          description: Allows the server to have a public IP that can be reached from the internet.
        interface_name:
          description: Interface name. Defaults to `null` and is returned as `null` in the API response if not set.
          maxLength: 37
          title: Interface Name
          type: string
        ip_address:
