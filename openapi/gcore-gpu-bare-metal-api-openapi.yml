      properties:
        image_id:
          description: Image ID of the OS image to apply to the cluster template. Use GET /v1/images/{project_id}/{region_id} to discover available images. Takes effect on existing servers only after a successful POST /apply_settings call.
          examples:
          - 3793c250-0b3b-4678-bab3-e11afbc29657
          format: uuid4
