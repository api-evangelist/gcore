  /v3/gpu/baremetal/{project_id}/{region_id}/clusters:
    post:
      operationId: BMClusterCollection.post
      summary: Create bare metal GPU cluster
      description: Create a new bare metal GPU cluster with the specified configuration.
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 7
          title: Region Id
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskIDsSerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaremetalClusterCreateSerializer'
      tags:
      - GPU Bare Metal
    get:
      operationId: BMClusterCollection.get
      summary: List bare metal GPU clusters
      description: List all bare metal GPU clusters in the specified project and region.
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 7
          title: Region Id
          type: integer
      - in: query
        name: created_at
        required: false
        description: Filter by creation time (UTC), e.g. `created_at[gte]=2026-01-01T00:00:00Z`.
        schema:
          $ref: '#/components/schemas/DateTimeRangeFilter'
          description: Filter by creation time (UTC), e.g. `created_at[gte]=2026-01-01T00:00:00Z`.
        style: deepObject
        explode: true
      - in: query
        name: flavor
        required: false
        description: Filter by flavor (case-insensitive), e.g. `flavor[prefix]=bm3-`, `flavor[exact]=bm3-ai-1xlarge-h100-80-8`.
        schema:
          $ref: '#/components/schemas/StringFilter'
          description: Filter by flavor (case-insensitive), e.g. `flavor[prefix]=bm3-`, `flavor[exact]=bm3-ai-1xlarge-h100-80-8`.
        style: deepObject
        explode: true
      - in: query
        name: ids
        required: false
        description: Return only clusters with these IDs, e.g. `ids=<id1>&ids=<id2>`.
        schema:
          description: Return only clusters with these IDs, e.g. `ids=<id1>&ids=<id2>`.
          examples:
          - - 1aaaab48-10d0-46d9-80cc-85209284ceb4
          items:
            format: uuid4
            type: string
          title: Ids
          type: array
      - in: query
        name: image_ids
        required: false
        description: Return only clusters built from these source image IDs, e.g. `image_ids=<id1>&image_ids=<id2>`.
        schema:
          description: Return only clusters built from these source image IDs, e.g. `image_ids=<id1>&image_ids=<id2>`.
          examples:
          - - 8363acee-eb5d-475a-89b5-bd011d1e3c28
          items:
            format: uuid4
            type: string
          title: Image Ids
          type: array
      - in: query
        name: limit
        required: false
        description: Limit of items on a single page
        schema:
          default: 10
          description: Limit of items on a single page
          examples:
          - 10
          exclusiveMinimum: 0
          maximum: 1000
          title: Limit
          type: integer
      - in: query
        name: managed_by
        required: false
        description: 'Filter by who manages the cluster: `user` (default) or `k8s` (Managed Kubernetes). Pass both to include all, e.g. `managed_by=user&managed_by=k8s`.'
        schema:
          default:
          - user
          description: 'Filter by who manages the cluster: `user` (default) or `k8s` (Managed Kubernetes). Pass both to include all, e.g. `managed_by=user&managed_by=k8s`.'
          examples:
          - - user
          items:
            $ref: '#/components/schemas/ClusterManagedBy'
          title: Managed By
          type: array
      - in: query
        name: name
        required: false
        description: Filter by name (case-insensitive), e.g. `name[contains]=gpu`, `name[prefix]=prod-`.
        schema:
          $ref: '#/components/schemas/StringFilter'
          description: Filter by name (case-insensitive), e.g. `name[contains]=gpu`, `name[prefix]=prod-`.
        style: deepObject
        explode: true
      - in: query
        name: offset
        required: false
        description: Offset in results list
        schema:
          default: 0
          description: Offset in results list
          examples:
          - 0
          minimum: 0
          title: Offset
          type: integer
      - in: query
        name: servers_count
        required: false
        description: Filter by node count, e.g. `servers_count[gte]=2`, `servers_count[gte]=2&servers_count[lt]=8`.
        schema:
          $ref: '#/components/schemas/IntRangeFilter'
          description: Filter by node count, e.g. `servers_count[gte]=2`, `servers_count[gte]=2&servers_count[lt]=8`.
        style: deepObject
        explode: true
      - in: query
        name: tag_key
        required: false
        description: Filter by tag key regardless of value, e.g. `tag_key[contains]=team`.
        schema:
          $ref: '#/components/schemas/StringFilter'
          description: Filter by tag key regardless of value, e.g. `tag_key[contains]=team`.
        style: deepObject
        explode: true
      - in: query
        name: tag_value
        required: false
        description: Filter by tag value regardless of key, e.g. `tag_value[prefix]=prod`.
        schema:
          $ref: '#/components/schemas/StringFilter'
          description: Filter by tag value regardless of key, e.g. `tag_value[prefix]=prod`.
        style: deepObject
        explode: true
      - in: query
        name: tags
        required: false
        description: Filter by exact tag key-value pairs, e.g. `tags[env]=prod&tags[team]=core`. Repeat a key to match any of several values for it, e.g. `tags[env]=prod&tags[env]=dev`. Values for one key are ORed, different keys are ANDed; values match case-insensitively.
        schema:
          $ref: '#/components/schemas/TagFilter'
          description: Filter by exact tag key-value pairs, e.g. `tags[env]=prod&tags[team]=core`. Repeat a key to match any of several values for it, e.g. `tags[env]=prod&tags[env]=dev`. Values for one key are ORed, different keys are ANDed; values match case-insensitively.
          examples:
          - env:
            - prod
        style: deepObject
        explode: true
      - in: query
        name: updated_at
        required: false
        description: Filter by last-change time (UTC), e.g. `updated_at[gte]=2026-06-01T00:00:00Z`.
        schema:
          $ref: '#/components/schemas/DateTimeRangeFilter'
          description: Filter by last-change time (UTC), e.g. `updated_at[gte]=2026-06-01T00:00:00Z`.
        style: deepObject
        explode: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaremetalClusterListSerializer'
      tags:
      - GPU Bare Metal
  /v3/gpu/baremetal/{project_id}/{region_id}/clusters/{cluster_id}:
    get:
      operationId: BMClusterInstance.get
      summary: Get bare metal GPU cluster
      description: Get detailed information about a specific bare metal GPU cluster.
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 7
          title: Region Id
          type: integer
      - in: path
        name: cluster_id
        required: true
        description: Cluster unique identifier
        schema:
          description: Cluster unique identifier
          examples:
          - 1aaaab48-10d0-46d9-80cc-85209284ceb4
          format: uuid4
          title: Cluster Id
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaremetalClusterSerializer'
      tags:
      - GPU Bare Metal
    patch:
      operationId: BMClusterInstance.patch
      summary: Update bare metal GPU cluster
      description: 'Update the name, tags, and/or server settings of an existing bare metal GPU cluster.


        Update tags using JSON Merge Patch semantics (RFC 7396).

        To add or update tags, provide key-value pairs.

        To remove a tag, set its value to null.


        Updating server settings (servers_settings, image_id) only modifies the cluster template.

        **It does NOT modify or rebuild any existing servers in the cluster.**

        Tags and name will be applied immediately. To apply the rest changes to running servers, use the

        `/cloud/v3/gpu/baremetal/{project_id}/{region_id}/clusters/{cluster_id}/apply_settings` endpoint.'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 7
          title: Region Id
          type: integer
      - in: path
        name: cluster_id
        required: true
        description: Cluster unique identifier
        schema:
          description: Cluster unique identifier
          examples:
          - 1aaaab48-10d0-46d9-80cc-85209284ceb4
          format: uuid4
          title: Cluster Id
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaremetalClusterSerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBareMetalClusterSerializer'
      tags:
      - GPU Bare Metal
    delete:
