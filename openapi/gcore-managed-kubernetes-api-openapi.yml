    post:
      operationId: K8sClusterCheckLimitsV2.post
      summary: Check cluster quota
      description: 'Calculate quota requirements for a new K8s cluster before creation.

        Returns exceeded quotas if regional limits would be violated. Validates

        requirements for all pools, logging, and cluster infrastructure (floating IPs,

        external IPs for pools with is_public_ipv4, load balancers, security groups).

        Use before cluster creation to validate resource availability.'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 7
          title: Region Id
          type: integer
