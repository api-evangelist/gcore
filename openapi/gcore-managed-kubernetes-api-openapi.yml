openapi: 3.2.0
info:
  title: Cloud Managed Kubernetes API
  description: '___brandName___ Cloud API provides an API to manage Cloud resources and services.

    API address is: https://api.___serverHost___/cloud


    # Authentication

    You can find the available authorization methods in this section:

    Authorization methods


    Project ID & Region ID


    Most endpoints require project_id and region_id path parameters.

    List Regions

    and

    List Projects

    to see available projects and regions.'
  version: 14.491.0
servers:
- url: https://api.___serverHost___/cloud
tags:
- name: Managed Kubernetes
paths:
  /v2/k8s/{project_id}/{region_id}/create_versions:
    get:
      operationId: K8sClusterCreateVersionViewSet.get
      summary: List k8s cluster versions
      description: List available k8s cluster versions for creation
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 7
          title: Region Id
          type: integer
      - in: query
        name: limit
        required: false
        description: Optional. Limit the number of returned items
        schema:
          default: 1000
          description: Optional. Limit the number of returned items
          examples:
          - 1000
          exclusiveMinimum: 0
          maximum: 1000
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        description: Optional. Offset value is used to exclude the first set of records from the result
        schema:
          default: 0
          description: Optional. Offset value is used to exclude the first set of records from the result
          examples:
          - 0
          minimum: 0
          title: Offset
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/K8sClusterVersionV2CollectionSerializer'
      tags:
      - Managed Kubernetes
  /v1/k8s/{project_id}/{region_id}/flavors:
    get:
      operationId: K8sFlavorsViewSet.get
      summary: List k8s cluster flavors
      description: 'Retrieve a list of flavors for k8s pool.

        When the include_prices query parameter is specified, the list shows prices.

        A client in trial mode gets all price values as 0. If you get Pricing Error contact the support'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 7
          title: Region Id
          type: integer
      - in: query
        name: exclude_gpu
        required: false
        description: Set to true to exclude GPU flavors. Default is false.
        schema:
          default: false
          description: Set to true to exclude GPU flavors. Default is false.
          examples:
          - false
          - true
          title: Exclude Gpu
          type: boolean
      - in: query
        name: include_capacity
        required: false
        description: Set to true to include flavor capacity. Default is False.
        schema:
          default: false
          description: Set to true to include flavor capacity. Default is False.
          examples:
          - false
          - true
          title: Include Capacity
          type: boolean
      - in: query
        name: include_prices
        required: false
        description: Set to true to include flavor prices. Default is False.
        schema:
          default: false
          description: Set to true to include flavor prices. Default is False.
          examples:
          - false
          - true
          title: Include Prices
          type: boolean
      - in: query
        name: limit
        required: false
        description: Optional. Limit the number of returned items
        schema:
          default: 1000
          description: Optional. Limit the number of returned items
          examples:
          - 1000
          exclusiveMinimum: 0
          maximum: 1000
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        description: Optional. Offset value is used to exclude the first set of records from the result
        schema:
          default: 0
          description: Optional. Offset value is used to exclude the first set of records from the result
          examples:
          - 0
          minimum: 0
          title: Offset
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BareMetalFlavorExtendedCollectionSerializer'
      tags:
      - Managed Kubernetes
