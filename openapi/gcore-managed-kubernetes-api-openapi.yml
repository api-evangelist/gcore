    K8sClusterUpdateV2Serializer:
      properties:
        add_ons:
          $ref: '#/components/schemas/K8sClusterAddonsUpdateV2Serializer'
          description: Cluster add-ons configuration
          examples:
          - slurm:
              enabled: true
              file_share_id: cbc94d0e-06c6-4d12-9e86-9782ba14fc8c
              ssh_key_ids:
              - 25735292-bd97-44b0-a1af-d7eab876261d
              - efc01f3a-35b9-4385-89f9-e38439093ee7
              worker_count: 2
        authentication:
          anyOf:
          - $ref: '#/components/schemas/K8sClusterAuthenticationCreateV2Serializer'
          - type: 'null'
          default: null
          description: Authentication settings
          examples:
          - oidc:
              client_id: kubernetes
              groups_claim: groups
              groups_prefix: 'oidc:'
              issuer_url: https://accounts.provider.example
              required_claims:
                claim: value
              signing_algs:
              - RS256
              - RS512
              username_claim: sub
              username_prefix: 'oidc:'
        autoscaler_config:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          default: null
          description: "Cluster autoscaler configuration.\n\n  It allows you to override the default cluster-autoscaler parameters provided by the platform with your preferred values.\n\n  Supported parameters (in alphabetical order):\n  - balance-similar-node-groups (boolean: true/false) - Detect similar node groups and balance the number of nodes between them.\n  - expander (string: random, most-pods, least-waste, price, priority, grpc) - Type of node group expander to be used in scale up. Specifying multiple values separated by commas will call the expanders in succession until there is only one option remaining.\n  - expendable-pods-priority-cutoff (float) - Pods with priority below cutoff will be expendable. They can be killed without any consideration during scale down and they don't cause scale up. Pods with null priority (PodPriority disabled) are non expendable.\n  - ignore-daemonsets-utilization (boolean: true/false) - Should CA ignore DaemonSet pods when calculating resource utilization for scaling down.\n  - max-empty-bulk-delete (integer) - Maximum number of empty nodes that can be deleted at the same time.\n  - max-graceful-termination-sec (integer) - Maximum number of seconds CA waits for pod termination when trying to scale down a node.\n  - max-node-provision-time (duration: e.g., '15m') - The default maximum time CA waits for node to be provisioned - the value can be overridden per node group.\n  - max-total-unready-percentage (float) - Maximum percentage of unready nodes in the cluster. After this is exceeded, CA halts operations.\n  - new-pod-scale-up-delay (duration: e.g., '10s') - Pods less than this old will not be considered for scale-up. Can be increased for individual pods through annotation.\n  - ok-total-unready-count (integer) - Number of allowed unready nodes, irrespective of max-total-unready-percentage.\n  - scale-down-delay-after-add (duration: e.g., '10m') - How long after scale up that scale down evaluation resumes.\n  - scale-down-delay-after-delete (duration: e.g., '10s') - How long after node deletion that scale down evaluation resumes.\n  - scale-down-delay-after-failure (duration: e.g., '3m') - How long after scale down failure that scale down evaluation resumes.\n  - scale-down-enabled (boolean: true/false) - Should CA scale down the cluster.\n  - scale-down-unneeded-time (duration: e.g., '10m') - How long a node should be unneeded before it is eligible for scale down.\n  - scale-down-unready-time (duration: e.g., '20m') - How long an unready node should be unneeded before it is eligible for scale down.\n  - scale-down-utilization-threshold (float) - The maximum value between the sum of cpu requests and sum of memory requests of all pods running on the node divided by node's corresponding allocatable resource, below which a node can be considered for scale down.\n  - scan-interval (duration: e.g., '10s') - How often cluster is reevaluated for scale up or down.\n  - skip-nodes-with-custom-controller-pods (boolean: true/false) - If true cluster autoscaler will never delete nodes with pods owned by custom controllers.\n  - skip-nodes-with-local-storage (boolean: true/false) - If true cluster autoscaler will never delete nodes with pods with local storage, e.g. EmptyDir or HostPath.\n  - skip-nodes-with-system-pods (boolean: true/false) - If true cluster autoscaler will never delete nodes with pods from kube-system (except for DaemonSet or mirror pods)."
          examples:
          - scale-down-unneeded-time: 5m
          title: Autoscaler Config
        cni:
          anyOf:
          - $ref: '#/components/schemas/K8sClusterCNICreateV2Serializer'
          - type: 'null'
          default: null
          description: Cluster CNI settings
          examples:
          - cilium:
              cni_exclusive: true
              encryption: true
              hubble_relay: true
              hubble_ui: true
              lb_acceleration: true
              lb_mode: snat
              tunnel: geneve
            provider: cilium
        ddos_profile:
          anyOf:
          - $ref: '#/components/schemas/K8sClusterDdosProfileUpdateV2Serializer'
          - type: 'null'
          default: null
          description: Advanced DDoS Protection profile
          examples:
          - enabled: true
            fields:
            - base_field: 10
              field_value:
              - 45046
              - 45047
            profile_template: 29
          - enabled: false
        logging:
          anyOf:
          - $ref: '#/components/schemas/K8sClusterLoggingUpdateV2Serializer'
          - type: 'null'
          default: null
          description: Logging configuration
          examples:
          - destination_region_id: 1
            enabled: true
            retention_policy:
              period: 45
            topic_name: my-log-name
          - enabled: false
          - null
      title: K8sClusterUpdateV2Serializer
      type: object
