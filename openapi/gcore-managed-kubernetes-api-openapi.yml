            schema:
              $ref: '#/components/schemas/K8sClusterCheckLimitsV2Serializer'
      tags:
      - Managed Kubernetes
  /v2/k8s/clusters/{project_id}/{region_id}/pools/check_limits:
    post:
      operationId: K8sClusterPoolCheckLimitsV2.post
      summary: Check cluster pool quota
      description: 'Calculate quota requirements for a new cluster pool before creation.

