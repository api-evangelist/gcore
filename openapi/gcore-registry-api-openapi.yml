components:
  schemas:
    RegistryUserUpdateSerializer:
      properties:
        duration:
          description: User account operating time, days
          examples:
          - 14
          maximum: 365
          minimum: -1
          title: Duration
          type: integer
        read_only:
          default: false
          description: Read-only user
          examples:
          - false
          title: Read Only
          type: boolean
      required:
      - duration
      title: RegistryUserUpdateSerializer
      type: object
    RegistryCreateSerializer:
      properties:
        name:
          description: "A name for the container registry. \n\n  Should be in lowercase, consisting only of numbers, letters and -, \n\n  with maximum length of 24 characters"
          examples:
          - reg-home1
          pattern: ^[a-z][-a-z0-9]{0,22}[a-z0-9]$
          title: Name
          type: string
        storage_limit:
          default: 5
          description: Registry storage limit, GiB
          examples:
          - 5
          maximum: 1000
          minimum: 1
          title: Storage Limit
          type: integer
      required:
      - name
      title: RegistryCreateSerializer
      type: object
    RegistryBatchUsersCreateSerializer:
      properties:
        users:
          description: Set of users
          examples:
          - - duration: -1
              name: user1
              read_only: false
          items:
            $ref: '#/components/schemas/RegistryUserCreateSerializer'
          title: Users
          type: array
      required:
      - users
      title: RegistryBatchUsersCreateSerializer
      type: object
    RegistryQuotaCheckSerializer:
      properties:
        registry_count_limit:
          description: Registries count limit
          examples:
          - 5
          title: Registry Count Limit
          type: integer
        registry_count_requested:
          description: Registries count requested
          examples:
          - 1
          title: Registry Count Requested
          type: integer
        registry_count_usage:
          description: Registries count usage
          examples:
          - 5
          title: Registry Count Usage
          type: integer
        registry_storage_limit:
          description: Registries storage limit, GiB
          examples:
          - 500
          title: Registry Storage Limit
          type: integer
        registry_storage_requested:
          description: Registries storage requested, GiB
          examples:
          - 100
          title: Registry Storage Requested
          type: integer
        registry_storage_usage:
          description: Registries storage usage, GiB
          examples:
          - 450
          title: Registry Storage Usage
          type: integer
      title: RegistryQuotaCheckSerializer
      type: object
    RegistryRepositorySerializer:
      properties:
        artifact_count:
          description: Number of artifacts in the repository
          examples:
          - 1
          title: Artifact Count
          type: integer
        created_at:
          description: Repository creation date-time
          examples:
          - '2024-06-18T09:36:53.335000Z'
          format: date-time
          title: Created At
          type: string
        id:
          description: Repository ID
          examples:
          - 1
          title: Id
          type: integer
        name:
          description: Repository name
          examples:
          - nginx
          title: Name
          type: string
        pull_count:
          description: Number of pools from the repository
          examples:
          - 1
          title: Pull Count
