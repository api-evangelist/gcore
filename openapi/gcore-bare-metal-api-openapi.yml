          - - d478ae29-dedc-4869-82f0-96104425f565
          items:
            type: string
          title: Tasks
          type: array
      required:
      - tasks
      title: TaskIDsSerializer
      type: object
    BareMetalFlavorExtendedSerializer:
      description: Bare metal flavor schema
      properties:
        architecture:
          description: Flavor architecture type
          examples:
          - x86_64
          title: Architecture
          type: string
        capacity:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          description: Number of available instances of given configuration
          examples:
          - 1
          title: Capacity
        currency_code:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Currency code. Shown if the include_prices query parameter if set to true
          examples:
          - USD
          title: Currency Code
        disabled:
          description: Disabled flavor flag
          examples:
          - false
          title: Disabled
          type: boolean
        flavor_id:
          description: Flavor ID is the same as name
          examples:
          - g2-standard-32-64
          title: Flavor Id
          type: string
        flavor_name:
          description: Flavor name
          examples:
          - g2-standard-32-64
          title: Flavor Name
          type: string
        hardware_description:
          additionalProperties:
            type: string
          default: {}
          description: Additional hardware description
          title: Hardware Description
          type: object
        os_type:
          description: Flavor operating system
          examples:
          - linux
          title: Os Type
          type: string
        price_per_hour:
          anyOf:
          - type: number
          - type: integer
          - type: 'null'
          default: null
          description: Price per hour. Shown if the include_prices query parameter if set to true
          examples:
          - 1
          title: Price Per Hour
        price_per_month:
          anyOf:
          - type: number
          - type: integer
          - type: 'null'
          default: null
          description: Price per month. Shown if the include_prices query parameter if set to true
          examples:
          - 720
          title: Price Per Month
        price_status:
          anyOf:
          - $ref: '#/components/schemas/PriceDisplayStatus'
          - type: 'null'
          default: null
          description: Price status for the UI
          examples:
          - show
        ram:
          description: RAM size in MiB
          examples:
          - 2048
          title: Ram
          type: integer
        reserved_capacity:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          description: Number of available instances of given flavor from reservations
          examples:
          - 5
          title: Reserved Capacity
        resource_class:
          anyOf:
          - type: string
          - type: 'null'
