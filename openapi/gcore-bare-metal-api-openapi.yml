openapi: 3.2.0
info:
  title: Cloud Bare Metal API
  description: '___brandName___ Cloud API provides an API to manage Cloud resources and services.

    API address is: https://api.___serverHost___/cloud


    # Authentication

    You can find the available authorization methods in this section:

    Authorization methods


    Project ID & Region ID


    Most endpoints require project_id and region_id path parameters.

    List Regions

    and

    List Projects

    to see available projects and regions.'
  version: 14.491.0
servers:
- url: https://api.___serverHost___/cloud
tags:
- name: Bare Metal
paths:
  /v2/baremetal/{project_id}/{region_id}/{server_id}/action:
    post:
      operationId: BMInstancesActionHandler.post
      summary: Execute bare metal server action
      description: 'The action can be one of: start, stop, reboot or reboot_hard.'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      - in: path
        name: server_id
        required: true
        description: Server ID
        schema:
          description: Server ID
          examples:
          - 024a29e-b4b7-4c91-9a46-505be123d9f8
          format: uuid4
          title: Server Id
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskIDsSerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BareMetalActionSerializer'
      tags:
      - Bare Metal
  /v3/baremetal/{project_id}/{region_id}/{server_id}/get_console:
    get:
      operationId: BMInstanceConsoleHandler.get
      summary: Get bare metal server console URL
      description: Returns a URL to access the remote console for a bare metal server.
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      - in: path
        name: server_id
        required: true
        description: Server ID
        schema:
          description: Server ID
          examples:
          - 024a29e-b4b7-4c91-9a46-505be123d9f8
          format: uuid4
          title: Server Id
          type: string
      - in: query
        name: console_type
        required: false
        description: Console type you expect the server to give. The server hardware sets the available types. A value that the hardware does not give causes an error. Omit this parameter to accept the type of the server.
        schema:
          $ref: '#/components/schemas/BareMetalConsoleType'
          description: Console type you expect the server to give. The server hardware sets the available types. A value that the hardware does not give causes an error. Omit this parameter to accept the type of the server.
          examples:
          - vnc
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoteConsoleSerializer'
      tags:
      - Bare Metal
  /v1/bmcapacity/{project_id}/{region_id}:
    get:
      operationId: BmCapacityHandler.get
      summary: Get bare metal capacity
      description: 'Get the number of available bare metal nodes per flavor

        in the specified project and region.'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 4
          title: Region Id
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BmCapacityResponse'
      tags:
      - Bare Metal
  /v2/bmcapacity/{region_id}:
    get:
      operationId: ClientBmCapacityHandler.get
      summary: Get bare metal capacity from default project
      description: 'Get the number of available bare metal nodes without

        client''s reservations in the default project.'
      parameters:
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 4
          title: Region Id
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BmCapacityResponse'
      tags:
      - Bare Metal
  /v1/bmflavors/{project_id}/{region_id}:
    get:
      operationId: BmFlavorsViewSet.get
      summary: List bare metal flavors
      description: 'List all available bare metal flavors in the specified project and region.

        When include_prices is specified, the list includes pricing information.

        A client in trial mode gets all price values as 0. If you get Pricing Error contact the support.'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 7
          title: Region Id
          type: integer
      - in: query
        name: disabled
        required: false
        description: Flag for filtering disabled flavors in the region
        schema:
          default: true
          description: Flag for filtering disabled flavors in the region
          title: Disabled
          type: boolean
      - in: query
        name: exclude_linux
        required: false
        description: Set to true to exclude flavors dedicated to linux images
        schema:
          default: false
          description: Set to true to exclude flavors dedicated to linux images
          title: Exclude Linux
          type: boolean
      - in: query
        name: exclude_windows
        required: false
        description: Set to true to exclude flavors dedicated to windows images
        schema:
          default: false
          description: Set to true to exclude flavors dedicated to windows images
          title: Exclude Windows
          type: boolean
      - in: query
        name: include_capacity
        required: false
        description: Set to true if the response should include flavor capacity
        schema:
          default: false
          description: Set to true if the response should include flavor capacity
          title: Include Capacity
          type: boolean
      - in: query
        name: include_prices
        required: false
        description: Set to true if the response should include flavor prices
        schema:
          default: false
          deprecated: true
          description: Set to true if the response should include flavor prices
          title: Include Prices
          type: boolean
      - in: query
        name: include_reservation_stock
        required: false
        description: Optional. Set to true if flavor listing should include count of reserved resources in stock.
        schema:
          default: false
          description: Optional. Set to true if flavor listing should include count of reserved resources in stock.
          title: Include Reservation Stock
          type: boolean
      - in: query
        name: limit
        required: false
        description: Optional. Limit the number of returned items
        schema:
          default: 1000
          description: Optional. Limit the number of returned items
          examples:
          - 1000
          exclusiveMinimum: 0
          maximum: 1000
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        description: Optional. Offset value is used to exclude the first set of records from the result
        schema:
          default: 0
          description: Optional. Offset value is used to exclude the first set of records from the result
          examples:
          - 0
          minimum: 0
          title: Offset
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BareMetalFlavorExtendedCollectionSerializer'
      tags:
      - Bare Metal
  /v1/bmflavors/{region_id}:
    get:
      operationId: DefaultBmFlavorsViewSet.get
      summary: List bare metal flavors from default project
      description: 'List all available bare metal flavors in the default project.

        When include_prices is specified, the list includes pricing information.

        A client in trial mode gets all price values as 0. If you get Pricing Error contact the support.'
      parameters:
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 7
          title: Region Id
          type: integer
      - in: query
        name: client_id
        required: false
        description: Client identifier. Must be used for users w/o client_id in jwt
        schema:
          description: Client identifier. Must be used for users w/o client_id in jwt
          title: Client Id
          type: integer
      - in: query
        name: disabled
        required: false
        description: Flag for filtering disabled flavors in the region
        schema:
          default: true
          description: Flag for filtering disabled flavors in the region
          title: Disabled
          type: boolean
      - in: query
        name: exclude_linux
        required: false
        description: Set to true to exclude flavors dedicated to linux images
        schema:
          default: false
          description: Set to true to exclude flavors dedicated to linux images
          title: Exclude Linux
          type: boolean
      - in: query
        name: exclude_windows
        required: false
        description: Set to true to exclude flavors dedicated to windows images
        schema:
          default: false
          description: Set to true to exclude flavors dedicated to windows images
          title: Exclude Windows
          type: boolean
      - in: query
        name: include_capacity
        required: false
        description: Set to true if the response should include flavor capacity
        schema:
          default: false
          description: Set to true if the response should include flavor capacity
          title: Include Capacity
          type: boolean
      - in: query
        name: include_prices
        required: false
        description: Set to true if the response should include flavor prices
        schema:
          default: false
          deprecated: true
          description: Set to true if the response should include flavor prices
          title: Include Prices
          type: boolean
      - in: query
        name: include_reservation_stock
        required: false
        description: Optional. Set to true if flavor listing should include count of reserved resources in stock.
        schema:
          default: false
          description: Optional. Set to true if flavor listing should include count of reserved resources in stock.
          title: Include Reservation Stock
          type: boolean
      - in: query
        name: limit
        required: false
        description: Optional. Limit the number of returned items
        schema:
          default: 1000
          description: Optional. Limit the number of returned items
          examples:
          - 1000
          exclusiveMinimum: 0
          maximum: 1000
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        description: Optional. Offset value is used to exclude the first set of records from the result
        schema:
          default: 0
          description: Optional. Offset value is used to exclude the first set of records from the result
          examples:
          - 0
          minimum: 0
          title: Offset
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BareMetalFlavorExtendedCollectionSerializer'
      tags:
      - Bare Metal
  /v1/bminstances/{project_id}/{region_id}:
    post:
      operationId: BmInstanceCreateSet.post
      summary: Create bare metal server
      description: 'Create a new bare metal server with the specified configuration.


        How to get access:


        For Linux,


        - Use the `user_data` field to provide a

        cloud-init script

        in base64 to apply configurations to the instance.

        - Specify the `username` and `password` to create a new user.

        - When only `password` is provided, it is set as the password for the default user of the image.

        - The `user_data` is ignored when the `password` is specified.


        For Windows,


        - Use the `user_data` field to provide a

        cloudbase-init script

        in base64 to create new users on Windows.

        - Use the `password` field to set the password for the ''Admin'' user on Windows.

        - The password of the Admin user cannot be updated via `user_data`.

        - The `username` cannot be specified in the request.'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskIDsSerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBareMetalServerSerializer'
      tags:
      - Bare Metal
    get:
      operationId: BmInstanceCreateSet.get
      summary: List bare metal servers
      description: 'List all bare metal servers in the specified project and region.

        Results can be filtered by various parameters like name, status, and IP address.'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      - in: query
        name: changes-before
        required: false
        description: Filters the instances by a date and time stamp when the instances last changed.
        schema:
          description: Filters the instances by a date and time stamp when the instances last changed.
          examples:
          - '2025-10-01T12:00:00Z'
          format: date-time
          title: Changes-Before
          type: string
      - in: query
        name: changes-since
        required: false
        description: Filters the instances by a date and time stamp when the instances last changed status.
        schema:
          description: Filters the instances by a date and time stamp when the instances last changed status.
          examples:
          - '2025-10-01T12:00:00Z'
          format: date-time
          title: Changes-Since
          type: string
      - in: query
        name: flavor_id
        required: false
        description: Filter out instances by flavor_id. Flavor id must match exactly.
        schema:
          description: Filter out instances by flavor_id. Flavor id must match exactly.
          examples:
          - bm2-hf-small
          title: Flavor Id
          type: string
      - in: query
        name: flavor_prefix
        required: false
        description: Filter out instances by flavor_prefix.
        schema:
          description: Filter out instances by flavor_prefix.
          examples:
          - bm2-
          - bm2-hf
          title: Flavor Prefix
          type: string
      - in: query
        name: include_k8s
        required: false
        description: Include managed k8s worker nodes
        schema:
          default: true
          description: Include managed k8s worker nodes
          title: Include K8S
          type: boolean
      - in: query
        name: ip
        required: false
        description: 'An IPv4 address to filter results by. Note: partial matches are allowed. For example, searching for 192.168.0.1 will return 192.168.0.1, 192.168.0.10, 192.168.0.110, and so on.'
        schema:
          description: 'An IPv4 address to filter results by. Note: partial matches are allowed. For example, searching for 192.168.0.1 will return 192.168.0.1, 192.168.0.10, 192.168.0.110, and so on.'
          examples:
          - 192.168.0.1
          title: Ip
          type: string
      - in: query
        name: limit
        required: false
        description: Optional. Limit the number of returned items
        schema:
          default: 1000
          description: Optional. Limit the number of returned items
          examples:
          - 1000
          exclusiveMinimum: 0
          maximum: 1000
          title: Limit
          type: integer
      - in: query
        name: name
        required: false
        description: Filter instances by name. You can provide a full or partial name, instances with matching names will be returned. For example, entering 'test' will return all instances that contain 'test' in their name.
        schema:
          description: Filter instances by name. You can provide a full or partial name, instances with matching names will be returned. For example, entering 'test' will return all instances that contain 'test' in their name.
          title: Name
          type: string
      - in: query
        name: offset
        required: false
        description: Optional. Offset value is used to exclude the first set of records from the result
        schema:
          default: 0
          description: Optional. Offset value is used to exclude the first set of records from the result
          examples:
          - 0
          minimum: 0
          title: Offset
          type: integer
      - in: query
        name: only_isolated
        required: false
        description: Include only isolated instances
        schema:
          default: false
          description: Include only isolated instances
          title: Only Isolated
          type: boolean
      - in: query
        name: only_with_fixed_external_ip
        required: false
        description: Return bare metals only with external fixed IP addresses.
        schema:
          description: Return bare metals only with external fixed IP addresses.
          examples:
          - true
          title: Only With Fixed External Ip
          type: boolean
      - in: query
        name: order_by
        required: false
        description: Order by field and direction.
        schema:
          $ref: '#/components/schemas/BareMetalOrderByChoices'
          default: created.desc
          description: Order by field and direction.
          examples:
          - name.asc
      - in: query
        name: profile_name
        required: false
        description: Filter result by ddos protection profile name. Effective only with with_ddos set to true.
        schema:
          description: Filter result by ddos protection profile name. Effective only with with_ddos set to true.
          examples:
          - profile_name
          title: Profile Name
          type: string
      - in: query
        name: protection_status
        required: false
        description: Filter result by DDoS protection_status. Effective only with with_ddos set to true. (Active, Queued or Error)
        schema:
          description: Filter result by DDoS protection_status. Effective only with with_ddos set to true. (Active, Queued or Error)
          enum:
          - Active
          - Queued
          - Error
          examples:
          - Active
          title: Protection Status
          type: string
      - in: query
        name: status
        required: false
        description: Filters instances by a server status, as a string.
        schema:
          $ref: '#/components/schemas/BareMetalStatusQueryChoices'
          description: Filters instances by a server status, as a string.
          examples:
          - ACTIVE
      - in: query
        name: tag_key_value
        required: false
        description: Optional. Filter by tag key-value pairs.
        schema:
          contentMediaType: application/json
          contentSchema:
            propertyNames:
              description: 'Tag key. Maximum 255 characters. Cannot contain spaces, tabs, newlines, empty string or ''='' character. Trailing or leading whitespaces will be stripped. '
              examples:
              - my-tag
              maxLength: 255
              minLength: 1
              pattern: ^[^\s=]+$
            type: object
            additionalProperties:
              description: 'Tag value. Maximum 255 characters. Cannot contain tabs, newlines, or empty strings. Trailing or leading whitespaces will be stripped. '
              examples:
              - my-tag-value
              maxLength: 255
              minLength: 1
              pattern: ^[^ \t\n\r\f\v]([^\t\n\r\f\v]*[^ \t\n\r\f\v])?$
              type: string
          description: Optional. Filter by tag key-value pairs.
          examples:
          - key: value
          title: Tag Key Value
          type: string
      - in: query
        name: tag_value
        required: false
        description: Optional. Filter by tag values. ?tag_value=value1&tag_value=value2
        schema:
          description: Optional. Filter by tag values. ?tag_value=value1&tag_value=value2
          examples:
          - - value1
            - value2
          items:
            description: 'Tag value. Maximum 255 characters. Cannot contain tabs, newlines, or empty strings. Trailing or leading whitespaces will be stripped. '
            examples:
            - my-tag-value
            maxLength: 255
            minLength: 1
            pattern: ^[^ \t\n\r\f\v]([^\t\n\r\f\v]*[^ \t\n\r\f\v])?$
            type: string
          title: Tag Value
          type: array
      - in: query
        name: type_ddos_profile
        required: false
        description: Return bare metals either only with advanced or only basic DDoS protection. Effective only with with_ddos set to true. (advanced or basic)
        schema:
          description: Return bare metals either only with advanced or only basic DDoS protection. Effective only with with_ddos set to true. (advanced or basic)
          enum:
          - basic
          - advanced
          examples:
          - advanced
          title: Type Ddos Profile
          type: string
      - in: query
        name: uuid
        required: false
        description: Filter the server list result by the UUID of the server. Allowed UUID part
        schema:
          description: Filter the server list result by the UUID of the server. Allowed UUID part
          examples:
          - b5b4d65d-945f-4b98-ab6f-332319c724ef
          maxLength: 36
          title: Uuid
          type: string
      - in: query
        name: with_ddos
        required: false
        description: Include DDoS profile information for bare-metal servers in the response when set to `true`. Otherwise, the `ddos_profile` field in the response is `null` by default.
        schema:
          default: false
          description: Include DDoS profile information for bare-metal servers in the response when set to `true`. Otherwise, the `ddos_profile` field in the response is `null` by default.
          examples:
          - true
          title: With Ddos
          type: boolean
      - in: query
        name: with_interfaces_name
        required: false
        description: Include `interface_name` in the addresses
        schema:
          default: false
          description: Include `interface_name` in the addresses
          examples:
          - true
          title: With Interfaces Name
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BareMetalServerCollectionSerializer'
      tags:
      - Bare Metal
  /v1/bminstances/{project_id}/{region_id}/{server_id}:
    get:
      operationId: BMInstancesViewSet.get
      summary: Get bare metal server
      description: 'Retrieve detailed information about a specific baremetal instance.

        This endpoint always returns `ddos_profile` (if present) and therefore always requires `DDOS_READ`.'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      - in: path
        name: server_id
        required: true
        description: Server ID
        schema:
          description: Server ID
          examples:
          - 024a29e-b4b7-4c91-9a46-505be123d9f8
          format: uuid4
          title: Server Id
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BareMetalServerSerializer'
      tags:
      - Bare Metal
    patch:
      operationId: BMInstancesViewSet.patch
      summary: Update bare metal server
      description: Rename bare metal server or update tags
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      - in: path
        name: server_id
        required: true
        description: Server ID
        schema:
          description: Server ID
          examples:
          - 024a29e-b4b7-4c91-9a46-505be123d9f8
          format: uuid4
          title: Server Id
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BareMetalServerSerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBareMetalServerSerializer'
      tags:
      - Bare Metal
    delete:
      operationId: BMInstancesViewSet.delete
      summary: Delete bare metal server
      description: Delete a bare metal server and it's associated resources
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      - in: path
        name: server_id
        required: true
        description: Server ID
        schema:
          description: Server ID
          examples:
          - 024a29e-b4b7-4c91-9a46-505be123d9f8
          format: uuid4
          title: Server Id
          type: string
      - in: query
        name: all_floating_ips
        required: false
        description: True if it is required to delete floating IPs assigned to the instance. Can't be used with `floating_ip_ids`.
        schema:
          default: false
          description: True if it is required to delete floating IPs assigned to the instance. Can't be used with `floating_ip_ids`.
          title: All Floating Ips
          type: boolean
      - in: query
        name: all_reserved_fixed_ips
        required: false
        description: True if it is required to delete reserved fixed IPs assigned to the instance. Can't be used with `reserved_fixed_ip_ids`.
        schema:
          default: false
          description: True if it is required to delete reserved fixed IPs assigned to the instance. Can't be used with `reserved_fixed_ip_ids`.
