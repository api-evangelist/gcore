  /v3/inference/{project_id}/deployments/{deployment_name}/start:
    post:
      operationId: InferenceInstanceStartHandlerV3.post
      summary: Start inference deployment
      description: 'This operation initializes an inference deployment after it was stopped, making it available to handle inference

        requests again.

        The instance will launch with the **minimum** number of replicas defined in the scaling settings.


        - If the minimum replicas are set to **0**, the instance will initially start with **0** replicas.

        - It will automatically scale up when it receives requests or SQS messages,

        according to the configured scaling rules.'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: deployment_name
        required: true
        description: Inference instance name.
        schema:
          description: Inference instance name.
          examples:
          - my-instance
          title: Deployment Name
          type: string
      responses:
        '204':
          description: No Content
      tags:
      - Everywhere Inference
  /v3/inference/{project_id}/deployments/{deployment_name}/stop:
    post:
      operationId: InferenceInstanceStopHandlerV3.post
      summary: Stop inference deployment
      description: 'This operation shuts down an inference deployment, making it unavailable for handling requests.

        The deployment will scale down to **0** replicas, overriding any minimum replica settings.


        - Once stopped, the deployment will **not** process any inference requests or SQS messages.

        - It will **not** restart automatically and must be started manually.

        - While stopped, the deployment will **not** incur any charges.'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
