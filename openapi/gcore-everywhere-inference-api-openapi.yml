openapi: 3.2.0
info:
  title: Cloud Everywhere Inference API
  description: '___brandName___ Cloud API provides an API to manage Cloud resources and services.

    API address is: https://api.___serverHost___/cloud


    # Authentication

    You can find the available authorization methods in this section:

    Authorization methods


    Project ID & Region ID


    Most endpoints require project_id and region_id path parameters.

    List Regions

    and

    List Projects

    to see available projects and regions.'
  version: 14.491.0
servers:
- url: https://api.___serverHost___/cloud
tags:
- name: Everywhere Inference
paths:
  /v3/inference/{project_id}/api_keys:
    post:
      operationId: InferenceApiKeysHandler.post
      summary: Create inference API key
      description: 'This endpoint creates a new API key for everywhere inference. It returs api key''s actual secret only once

        after creation.'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateApiKeyResponseSerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyCreateRequestSerializer'
      tags:
      - Everywhere Inference
    get:
      operationId: InferenceApiKeysHandler.get
      summary: List inference API keys
      description: This endpoint retrieves a list of API keys for everywhere inference.
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: query
        name: limit
        required: false
        description: Optional. Limit the number of returned items
        schema:
          default: 100
          description: Optional. Limit the number of returned items
          examples:
          - 100
          exclusiveMinimum: 0
          maximum: 1000
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        description: Optional. Offset value is used to exclude the first set of records from the result
        schema:
          default: 0
          description: Optional. Offset value is used to exclude the first set of records from the result
          examples:
          - 0
          minimum: 0
          title: Offset
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyListResponseSerializer'
      tags:
      - Everywhere Inference
  /v3/inference/{project_id}/api_keys/{api_key_name}:
    get:
      operationId: InferenceApiKeyHandler.get
      summary: Get inference API key
      description: This endpoint retrieves a specific API key for everywhere inference.
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: api_key_name
        required: true
        description: Api key name.
        schema:
          description: Api key name.
          examples:
          - aws-dev
          minLength: 4
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
          title: Api Key Name
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetApiKeyResponseSerializer'
