      tags:
      - Everywhere Inference
    delete:
      operationId: InferenceApiKeyHandler.delete
      summary: Delete inference API key
      description: 'This endpoint deletes a specific API key for everywhere inference.

        If the API key is attached to any inference deployments, it will not be removed. ConflictError will be raised'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: api_key_name
        required: true
        description: Api key name.
        schema:
          description: Api key name.
          examples:
