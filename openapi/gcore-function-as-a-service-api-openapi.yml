        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      - in: query
        name: expire_in
        required: false
        description: Days to expire
        schema:
          description: Days to expire
          examples:
          - 5
          minimum: 1
          title: Expire In
          type: integer
      - in: query
        name: limit
        required: false
        description: Optional. Limit the number of returned items
        schema:
          default: 1000
          description: Optional. Limit the number of returned items
          examples:
          - 1000
          exclusiveMinimum: 0
          maximum: 1000
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        description: Optional. Offset value is used to exclude the first set of records from the result
        schema:
          default: 0
          description: Optional. Offset value is used to exclude the first set of records from the result
          examples:
          - 0
          minimum: 0
          title: Offset
          type: integer
      - in: query
        name: order_by
        required: false
        description: Ordering fields and directions.
        schema:
          $ref: '#/components/schemas/ApiKeysOrderByChoices'
          default: created_at.desc
          description: Ordering fields and directions.
          examples:
          - created_at.desc
      - in: query
        name: search
        required: false
        description: Search through which value
        schema:
          description: Search through which value
          examples:
          - search-value
          pattern: ^[-a-z0-9]{0,25}[-a-z0-9]$
          title: Search
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaasApiKeyListSerializer'
      tags:
      - Function as a Service
