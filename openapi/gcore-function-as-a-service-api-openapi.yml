openapi: 3.2.0
info:
  title: Cloud Function as a Service API
  description: '___brandName___ Cloud API provides an API to manage Cloud resources and services.

    API address is: https://api.___serverHost___/cloud


    # Authentication

    You can find the available authorization methods in this section:

    Authorization methods


    Project ID & Region ID


    Most endpoints require project_id and region_id path parameters.

    List Regions

    and

    List Projects

    to see available projects and regions.'
  version: 14.491.0
servers:
- url: https://api.___serverHost___/cloud
tags:
- name: Function as a Service
paths:
  /v1/faas/flavors/{project_id}/{region_id}:
    get:
      operationId: FaaSFlavorsHandler.get
      summary: List flavors
      description: 'Retrieve a list of available compute flavors for functions.

        Flavors define CPU and memory resources for function execution.'
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      - in: query
        name: name
        required: false
        description: Function name
        schema:
          anyOf:
          - pattern: ^[0-9]{0,12}mCPU-[0-9]{0,12}MB$
            type: string
          - type: 'null'
          default: null
          description: Function name
          examples:
          - function-name
          title: Name
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaasFlavorsListSerializer'
      tags:
      - Function as a Service
  /v1/faas/keys/{project_id}/{region_id}:
    post:
      operationId: FaaSAuthKeysHandler.post
      summary: Create API key
      description: 'Create a new API key for function authentication.

        The key can be configured with an expiration time and permissions.'
