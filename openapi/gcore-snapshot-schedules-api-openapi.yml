openapi: 3.2.0
info:
  title: Cloud Snapshot Schedules API
  description: '___brandName___ Cloud API provides an API to manage Cloud resources and services.

    API address is: https://api.___serverHost___/cloud


    # Authentication

    You can find the available authorization methods in this section:

    Authorization methods


    Project ID & Region ID


    Most endpoints require project_id and region_id path parameters.

    List Regions

    and

    List Projects

    to see available projects and regions.'
  version: 14.491.0
servers:
- url: https://api.___serverHost___/cloud
tags:
- name: Snapshot Schedules
paths:
  /v1/lifecycle_policy/{project_id}/{region_id}:
    post:
      operationId: PoliciesViewSet.post
      summary: Create snapshot policy
      description: Create a new snapshot policy with the specified configuration.
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecyclePolicySerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLifecyclePolicySerializer'
      tags:
      - Snapshot Schedules
    get:
      operationId: PoliciesViewSet.get
      summary: List snapshot policies
      description: List all snapshot policies in the specified project and region.
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecyclePolicyCollectionSerializer'
      tags:
      - Snapshot Schedules
  /v1/lifecycle_policy/{project_id}/{region_id}/{policy_id}:
    get:
      operationId: PolicyViewSet.get
      summary: Get snapshot policy
      description: Get detailed information about a specific snapshot policy.
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      - in: path
        name: policy_id
        required: true
        description: Lifecycle policy ID.
        schema:
          description: Lifecycle policy ID.
          examples:
          - 1
          title: Policy Id
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecyclePolicySerializer'
      tags:
      - Snapshot Schedules
    patch:
      operationId: PolicyViewSet.patch
      summary: Update snapshot policy
      description: Update the configuration of an existing snapshot policy.
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      - in: path
        name: policy_id
        required: true
        description: Lifecycle policy ID.
        schema:
          description: Lifecycle policy ID.
          examples:
          - 1
          title: Policy Id
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecyclePolicySerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLifecyclePolicySerializer'
      tags:
      - Snapshot Schedules
    delete:
      operationId: PolicyViewSet.delete
      summary: Delete snapshot policy
      description: Delete a specific snapshot policy and all its associated schedules.
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      - in: path
        name: policy_id
        required: true
        description: Lifecycle policy ID.
        schema:
          description: Lifecycle policy ID.
          examples:
          - 1
          title: Policy Id
          type: integer
      responses:
        '204':
          description: No Content
      tags:
      - Snapshot Schedules
  /v1/lifecycle_policy/{project_id}/{region_id}/{policy_id}/add_schedules:
    post:
      operationId: AddSchedulesToPolicyViewSet.post
      summary: Add schedules to policy
      description: Add new schedules to an existing snapshot policy.
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      - in: path
        name: policy_id
        required: true
        description: Lifecycle policy ID.
        schema:
          description: Lifecycle policy ID.
          examples:
          - 1
          title: Policy Id
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecyclePolicySerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddSchedulesSerializer'
      tags:
      - Snapshot Schedules
  /v1/lifecycle_policy/{project_id}/{region_id}/{policy_id}/add_volumes_to_policy:
    put:
      operationId: AddVolumesInPolicyViewSet.put
      summary: Add volumes to policy
      description: Add volumes to an existing snapshot policy.
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      - in: path
        name: policy_id
        required: true
        description: Lifecycle policy ID.
        schema:
          description: Lifecycle policy ID.
          examples:
          - 1
          title: Policy Id
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecyclePolicySerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VolumeIdsSerializer'
      tags:
      - Snapshot Schedules
  /v1/lifecycle_policy/{project_id}/{region_id}/{policy_id}/remove_schedules:
    post:
      operationId: RemoveSchedulesFromPolicyViewSet.post
      summary: Remove schedules from policy
      description: Remove schedules from an existing snapshot policy.
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      - in: path
        name: policy_id
        required: true
        description: Lifecycle policy ID.
        schema:
          description: Lifecycle policy ID.
          examples:
          - 1
          title: Policy Id
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecyclePolicySerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveScheduleSerializer'
      tags:
      - Snapshot Schedules
  /v1/lifecycle_policy/{project_id}/{region_id}/{policy_id}/remove_volumes_from_policy:
    put:
      operationId: RemoveVolumesFromPolicyViewSet.put
      summary: Remove volumes from policy
      description: Remove volumes from an existing snapshot policy.
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      - in: path
        name: policy_id
        required: true
        description: Lifecycle policy ID.
        schema:
          description: Lifecycle policy ID.
          examples:
          - 1
          title: Policy Id
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecyclePolicySerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VolumeIdsSerializer'
      tags:
      - Snapshot Schedules
  /v1/lifecycle_policy/{project_id}/{region_id}/estimate_max_policy_usage:
    post:
      operationId: PolicyCostViewSet.post
      summary: Check snapshot policy quota
      description: Calculate the maximum resource usage if all snapshots are created by the policy.
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecyclePolicyUsageSerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLifecyclePolicySerializer'
      tags:
      - Snapshot Schedules
  /v2/pricing/{project_id}/{region_id}/lifecycle_policy:
    post:
      operationId: LifecyclePolicyPricingV2ViewSet.post
      summary: Preview snapshot policy price
      description: Get the maximum usage cost for resources if the policy creates all snapshots.
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          format: int64
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          format: int64
          title: Region Id
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifeCyclePolicyV2ResponseSerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PricingLifecyclePolicyV2Serializer'
      tags:
      - Snapshot Schedules
  /v1/schedule/{project_id}/{region_id}/{schedule_id}:
    get:
      operationId: SnapshotScheduleViewSet.get
      summary: Get schedule
      description: ''
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      - in: path
        name: schedule_id
        required: true
        description: Schedule ID
        schema:
          description: Schedule ID
          examples:
          - 1488e2ce-f906-47fb-ba32-c25a3f63df4f
          title: Schedule Id
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleSerializer'
      tags:
      - Snapshot Schedules
    patch:
      operationId: SnapshotScheduleViewSet.patch
      summary: Update schedule
      description: ''
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          title: Region Id
          type: integer
      - in: path
        name: schedule_id
        required: true
        description: Schedule ID
        schema:
          description: Schedule ID
          examples:
          - 1488e2ce-f906-47fb-ba32-c25a3f63df4f
          title: Schedule Id
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleSerializer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchScheduleSerializer'
      tags:
      - Snapshot Schedules
  /v1/pricing/{project_id}/{region_id}/lifecycle_policy:
    post:
      operationId: MaxLifecyclePolicyPricingViewSet.post
      summary: Preview snapshot policy price
      description: Get maximum usage cost of resources if all snapshots are created by the policy
      parameters:
      - in: path
        name: project_id
        required: true
        description: Project ID
        schema:
          description: Project ID
          examples:
          - 1
          format: int64
          title: Project Id
          type: integer
      - in: path
        name: region_id
        required: true
        description: Region ID
        schema:
          description: Region ID
          examples:
          - 1
          format: int64
          title: Region Id
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemPriceResponseSerializer'
      deprecated: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLifecyclePolicySerializer'
      tags:
      - Snapshot Schedules
components:
  schemas:
    RemoveScheduleSerializer:
      properties:
        schedule_ids:
          description: List of schedule IDs.
          examples:
          - - 1488e2ce-f906-47fb-ba32-c25a3f63df4f
          items:
            type: string
          title: Schedule Ids
          type: array
      required:
      - schedule_ids
      title: RemoveScheduleSerializer
      type: object
    PricingLifecyclePolicyV2Serializer:
      properties:
        schedules:
          default: []
          description: List of schedules associated with the policy.
          items:
            $ref: '#/components/schemas/CreateScheduleSerializer'
          maxItems: 10
          title: Schedules
          type: array
        volume_ids:
          description: List of volume IDs.
          examples:
          - - 3ed9e2ce-f906-47fb-ba32-c25a3f63df4f
          items:
            format: uuid4
            type: string
          maxItems: 100
          minItems: 1
          title: Volume Ids
          type: array
          uniqueItems: true
      required:
      - volume_ids
      title: PricingLifecyclePolicyV2Serializer
      type: object
    UpdateLifecyclePolicySerializer:
      properties:
        name:
          description: Name of the lifecycle policy.
          examples:
          - schedule_1
          pattern: ^[a-zA-Z0-9][a-zA-Z 0-9._\-]{1,61}[a-zA-Z0-9._]$
          title: Name
          type: string
        status:
          $ref: '#/components/schemas/LifecyclePolicyStatusesEnum'
          description: Status of the lifecycle policy.
          examples:
          - paused
      title: UpdateLifecyclePolicySerializer
      type: object
    VolumeIdsSerializer:
      properties:
        volume_ids:
          description: List of volume IDs.
          examples:
          - - 1488e2ce-f906-47fb-ba32-c25a3f63df4f
          items:
            type: string
          title: Volume Ids
          type: array
      required:
      - volume_ids
      title: VolumeIdsSerializer
      type: object
    PriceDisplayStatus:
      enum:
      - error
      - hide
      - show
      title: PriceDisplayStatus
      type: string
    PatchScheduleSerializer:
      properties:
        day:
          description: Day of the month (1-31, '*') or a comma-separated list of days
          examples:
          - '5'
          title: Day
          type: string
        day_of_week:
          description: Weekday or a comma-separated list of weekdays (mon,tue,wed,thu,fri,sat,sun,*)
          examples:
          - mon,fri
          title: Day Of Week
          type: string
        days:
          description: Number of days to wait
          examples:
          - 0
          title: Days
          type: integer
        hour:
          description: Hour (0-23, '*') or a comma-separated list of hours
          examples:
          - '0'
          - 0, 20
          title: Hour
          type: string
        hours:
          description: Number of hours to wait
          examples:
          - 2
          title: Hours
          type: integer
        max_quantity:
          description: Number of stored resources.
          examples:
          - 2
          exclusiveMinimum: 0
          maximum: 10000
          title: Max Quantity
          type: integer
        minute:
          description: Minute (0-59, '*') or a comma-separated list of minutes
          examples:
          - '30'
          title: Minute
          type: string
        minutes:
          description: Number of minutes to wait
          examples:
          - 1
          title: Minutes
          type: integer
        month:
          description: Month (1-12, '*') or a comma-separated list of months
          examples:
          - '1'
          - 1,6
          title: Month
          type: string
        resource_name_template:
          description: Template for resource names.
          examples:
          - Snapshot of volume {volume_id} created by policy {lifecycle_policy_id}
          title: Resource Name Template
          type: string
        retention_time:
          $ref: '#/components/schemas/CreateIntervalTimeSerializer'
          description: Time after which the resource will be deleted
        timezone:
          description: A pytz timezone. Defaults to UTC.
          examples:
          - UTC
          title: Timezone
          type: string
        type:
          description: Type of the schedule.
          enum:
          - cron
          - interval
          examples:
          - cron
          title: Type
          type: string
        week:
          description: ISO week (1-53, '*') or a comma-separated list of weeks
          examples:
          - '1'
          title: Week
          type: string
        weeks:
          description: Number of weeks to wait
          examples:
          - 0
          title: Weeks
          type: integer
      title: PatchScheduleSerializer
      type: object
    CreateLifecyclePolicySerializer:
      properties:
        action:
          $ref: '#/components/schemas/LifecyclePolicyActionEnum'
          description: Action that the policy will perform.
          examples:
          - volume_snapshot
        name:
          description: Name of the lifecycle policy.
          examples:
          - schedule_1
          title: Name
          type: string
        schedules:
          default: []
          description: List of schedules associated with the policy.
          items:
            $ref: '#/components/schemas/CreateScheduleSerializer'
          maxItems: 10
          title: Schedules
          type: array
        status:
          $ref: '#/components/schemas/LifecyclePolicyStatusesEnum'
          default: active
          description: Current status of the lifecycle policy.
          examples:
          - active
        volume_ids:
          default: []
          description: List of volume IDs.
          examples:
          - - 3ed9e2ce-f906-47fb-ba32-c25a3f63df4f
          items:
            format: uuid4
            type: string
          title: Volume Ids
          type: array
      required:
      - action
      - name
      title: CreateLifecyclePolicySerializer
      type: object
    LifecyclePolicyCollectionSerializer:
      properties:
        count:
          description: Number of objects
          examples:
          - 1
          minimum: 0
          title: Count
          type: integer
        results:
          description: Objects
          items:
            $ref: '#/components/schemas/LifecyclePolicySerializer'
          title: Results
          type: array
      required:
      - count
      - results
      title: LifecyclePolicyCollectionSerializer
      type: object
    CreateCronScheduleSerializer:
      properties:
        day:
          description: Day of the month (1-31, '*') or a comma-separated list of days
          examples:
          - '5'
          title: Day
          type: string
        day_of_week:
          description: Weekday or a comma-separated list of weekdays (mon,tue,wed,thu,fri,sat,sun,*)
          examples:
          - mon,fri
          title: Day Of Week
          type: string
        hour:
          description: Hour (0-23, '*') or a comma-separated list of hours
          examples:
          - '0'
          - 0, 20
          title: Hour
          type: string
        max_quantity:
          default: 2
          description: Number of stored resources.
          examples:
          - 2
          exclusiveMinimum: 0
          maximum: 10000
          title: Max Quantity
          type: integer
        minute:
          description: Minute (0-59, '*') or a comma-separated list of minutes
          examples:
          - '30'
          title: Minute
          type: string
        month:
          description: Month (1-12, '*') or a comma-separated list of months
          examples:
          - '1'
          - 1,6
          title: Month
          type: string
        resource_name_template:
          default: Snapshot of volume {volume_id} created by policy {lifecycle_policy_id}
          description: Template for resource names.
          examples:
          - Snapshot of volume {volume_id} created by policy {lifecycle_policy_id}
          title: Resource Name Template
          type: string
        retention_time:
          $ref: '#/components/schemas/CreateIntervalTimeSerializer'
          description: Time after which the resource will be deleted
        timezone:
          description: A pytz timezone. Defaults to UTC.
          examples:
          - UTC
          title: Timezone
          type: string
        type:
          const: cron
          description: Schedule type
          examples:
          - cron
          title: Type
          type: string
        week:
          description: ISO week (1-53, '*') or a comma-separated list of weeks
          examples:
          - '1'
          title: Week
          type: string
      required:
      - type
      title: CreateCronScheduleSerializer
      type: object
    AddSchedulesSerializer:
      properties:
        schedules:
          description: List of schedules associated with the policy.
          examples:
          - - day_of_week: fri, tue
              hour: 0, 20
              max_quantity: 2
              minute: '30'
              resource_name_template: CRON reserve snap of the volume {volume_id}
              retention_time:
                weeks: 2
              timezone: UTC
              type: cron
            - days: 0
              hours: 2
              max_quantity: 2
              minutes: 1
              resource_name_template: INTERVAL reserve snap of the volume {volume_id}
              retention_time:
                days: 1
              type: interval
              weeks: 0
          items:
            $ref: '#/components/schemas/CreateScheduleSerializer'
          title: Schedules
          type: array
      required:
      - schedules
      title: AddSchedulesSerializer
      type: object
    GetIntervalScheduleSerializer:
      properties:
        days:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          description: Number of days to wait
          examples:
          - 0
          title: Days
        hours:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          description: Number of hours to wait
          examples:
          - 2
          title: Hours
        id:
          description: Schedule ID
          examples:
          - 1488e2ce-f906-47fb-ba32-c25a3f63df4f
          title: Id
          type: string
        max_quantity:
          description: Number of stored resources.
          examples:
          - 2
          exclusiveMinimum: 0
          maximum: 10000
          title: Max Quantity
          type: integer
        minutes:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          description: Number of minutes to wait
          examples:
          - 1
          title: Minutes
        owner:
          description: Schedule owner
          examples:
          - lifecycle_policy
          title: Owner
          type: string
        owner_id:
          description: Owner ID
          examples:
          - 1
          title: Owner Id
          type: integer
        resource_name_template:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Template for resource names
          examples:
          - reserve snap of the volume {volume_id}
          title: Resource Name Template
        retention_time:
          anyOf:
          - $ref: '#/components/schemas/RetentionTimeSerializer'
          - type: 'null'
          description: Time after which the resource will be deleted
        type:
          const: interval
          description: Schedule type
